# web/ is a workspace member (#419). Before this it sat outside, which meant
# pnpm silently ignored web/pnpm-lock.yaml unless --ignore-workspace was
# passed: a `pnpm add` there wrote the ROOT lockfile and left web's stale, so
# local installs passed while a clean --frozen-lockfile failed. It also kept
# web's dependency graph outside the overrides below, outside the SBOM, and
# outside scripts/classify-changed-paths.mjs.
packages:
  - "."
  - "web"

allowBuilds:
  esbuild: true
  unrs-resolver: true
overrides:
  # Security floor: esbuild >=0.25.0 avoids GHSA-67mh-4wv8-2f99.
  # Compatibility ceiling: <0.26.0 is the narrow bound for deprecated core-utils.
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0 <0.26.0'
  postcss: 8.5.23
  # Security floor: nanoid 3.3.18 avoids GHSA-2v37-7h3g-55p8 and CVE-2026-67213.
  # Unscoped on purpose (#881). This was keyed 'postcss@8.5.23>nanoid', which
  # applied the floor only when nanoid was reached through that exact postcss
  # version -- so the floor disarmed itself the moment postcss moved, without
  # failing or warning, because pnpm treats an override that matches nothing as
  # an override with no work to do. postcss is the only path nanoid takes into
  # this tree, so the unscoped key selects the same package and goes on
  # selecting it after a postcss bump. scripts/check-override-pins.mjs fails
  # the build if any override key here stops matching the lockfile.
  nanoid: 3.3.18
