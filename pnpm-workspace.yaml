allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # drizzle-kit reaches esbuild 0.18.20 through the deprecated @esbuild-kit/*
  # packages, which are superseded by the tsx dependency it already declares.
  # That resolution carries the development-server request-exposure advisory.
  esbuild: '>=0.25.0'
  postcss: 8.5.18
  sharp: 0.35.0
