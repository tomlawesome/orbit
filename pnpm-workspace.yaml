# web/ is a workspace member (#419). Before this it sat outside, which meant
# pnpm silently ignored web/pnpm-lock.yaml unless --ignore-workspace was
# passed: a `pnpm add` there wrote the ROOT lockfile and left web's stale, so
# local installs passed while a clean --frozen-lockfile failed. It also kept
# web's dependency graph outside the overrides below, outside the SBOM, and
# outside scripts/classify-changed-paths.mjs.
packages:
  - "."
  - "web"

# Never auto-install before running a script (#874, and the damage it causes is
# #784). pnpm compares node_modules against the lockfile before any script and,
# left at its default of `install`, silently runs an install when they
# disagree. In a git worktree node_modules is a symlink to the main checkout's,
# so they never agree -- and pnpm then installs with the WORKTREE as its
# working directory, which makes the main checkout a workspace member to link,
# fills its node_modules with symlinks into .worktrees/, and drops the `orbit`
# link. Nothing dangles until the worktree is deleted, so the checkout looks
# healthy in the meantime.
#
# `warn` rather than `false`: the mismatch is still worth being told about, it
# is only the unattended install that is dangerous. Run `pnpm install` from the
# MAIN checkout when it warns.
#
# pnpm 11 reads this key from this file, not .npmrc -- checked, not assumed.
verifyDepsBeforeRun: warn

allowBuilds:
  esbuild: true
  unrs-resolver: true
overrides:
  # Security floor: esbuild >=0.25.0 avoids GHSA-67mh-4wv8-2f99.
  # Compatibility ceiling: <0.26.0 is the narrow bound for deprecated core-utils.
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0 <0.26.0'
  postcss: 8.5.23
  # Security floor: js-yaml 4.3.1 avoids GHSA-5p4m-2wfm-xmqj.
  js-yaml: 4.3.1
  # Security floor: nanoid 3.3.18 avoids GHSA-2v37-7h3g-55p8 and CVE-2026-67213.
  'postcss@8.5.23>nanoid': 3.3.18
