<style>
.wrap{display:grid;grid-template-columns:1fr 380px;gap:30px;align-items:center;
      max-width:940px;width:100%;padding:0 30px}
.nebula{position:relative;height:420px;display:grid;place-items:center;cursor:pointer}
.blob{width:190px;height:190px;border-radius:50%;filter:blur(26px);opacity:.5;
      background:radial-gradient(circle at 42% 40%, #8fb8ff 0%, #d8b45a44 55%, transparent 75%);
      animation:churn 9s ease-in-out infinite alternate;transition:all 1.2s}
@keyframes churn{from{transform:scale(1) rotate(0)}to{transform:scale(1.18) rotate(40deg)}}
.nebula.condensed .blob{width:60px;height:60px;filter:blur(4px);opacity:.95;
      background:radial-gradient(circle at 40% 36%, #fff8 0%, var(--upcoming) 40%, #26426e 90%)}
.nebula .say{position:absolute;bottom:36px;font:11px var(--mono);color:var(--ink-faint);
             letter-spacing:.1em;text-align:center}
.nebula .ringed{position:absolute;width:120px;height:44px;border:1px solid var(--accent);
      border-radius:50%;opacity:0;transform:rotate(-22deg);transition:opacity 1s .6s}
.nebula.condensed .ringed{opacity:.7}
.form{padding:26px 28px}
.form h2{font:600 19px var(--display);margin-bottom:16px}
.form label{display:block;font:10.5px var(--mono);letter-spacing:.12em;color:var(--ink-faint);
            text-transform:uppercase;margin:13px 0 5px}
.form input,.form select{width:100%;background:var(--panel);border:1px solid var(--line);
       border-radius:9px;color:var(--ink);font-size:13.5px;padding:8px 12px}
.types{display:flex;gap:8px}
.types button{flex:1;font:11px var(--mono);color:var(--ink-mid);background:var(--panel);
              border:1px solid var(--line);border-radius:9px;padding:7px 4px;cursor:pointer}
.types button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.go{margin-top:20px;width:100%;padding:12px;border-radius:11px;border:0;cursor:pointer;
    font:600 14px var(--display);color:var(--bg);background:var(--accent)}
.sugg{font:10.5px var(--mono);color:var(--upcoming);margin-top:10px;opacity:0;transition:opacity .8s .8s}
.wrap.suggested .sugg{opacity:1}
</style></head><body>

<div class="stage"><div class="wrap" id="wrap">
  <div class="nebula" id="nebula" onclick="condense()" role="button"
       aria-label="Drop a document to begin">
    <div class="ringed"></div><div class="blob"></div>
    <div class="say">DROP A DOCUMENT &middot; OR CLICK TO SIMULATE<br>matter becomes a world</div>
  </div>
  <form class="form glass" onsubmit="return false">
    <h2>New orbit</h2>
    <label>name</label><input id="f-name" placeholder="what needs keeping on track?">
    <label>type</label><div class="types">
      <button type="button" aria-pressed="true">&#9679; service</button>
      <button type="button" aria-pressed="false">&#9678; renewal</button>
      <button type="button" aria-pressed="false">&#9681; inspection</button></div>
    <label>orbital period</label><select><option>1 year</option><option>6 months</option><option>2 years</option><option>once</option></select>
    <label>next due</label><input id="f-due" placeholder="date">
    <label>typical cost</label><input id="f-cost" placeholder="optional">
    <div class="sugg">&#9670; suggested from your document &mdash; review before accepting</div>
    <button class="go">Set into orbit</button>
  </form>
</div></div>
<script>
function condense(){
  document.getElementById("nebula").classList.add("condensed");
  document.getElementById("wrap").classList.add("suggested");
  setTimeout(() => {
    document.getElementById("f-name").value = "Home insurance renewal";
    document.getElementById("f-due").value = "02 Oct 2026";
    document.getElementById("f-cost").value = "~£400";
  }, 900);
}
</script>
<div class="vignette"></div>
<div class="foot">genesis &middot; the drop-zone is a nebula; a document condenses it into a world</div>
