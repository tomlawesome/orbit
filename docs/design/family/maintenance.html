<style>
.sky g{animation:drowse 260s linear infinite}
@keyframes drowse{to{transform:translateX(-24px)}}
.sky .tw{animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.12}to{opacity:.85}}
.nebula{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.n1{left:8%;top:12%;width:34vw;height:22vw;background:#4b3a7a;opacity:.10}
.n2{right:4%;top:52%;width:30vw;height:26vw;background:#1d3a6e;opacity:.12}
.n3{left:30%;bottom:-8%;width:40vw;height:20vw;background:#5a2f18;opacity:.08}
.meteor{position:fixed;width:150px;height:1px;z-index:1;opacity:0;
        background:linear-gradient(90deg,transparent,#f4f0ff);transform:rotate(-28deg);
        top:16%;left:12%;animation:meteor 11s linear infinite}
@keyframes meteor{0%,80%{opacity:0;translate:0 0}82%{opacity:.9}92%{opacity:0;translate:260px 138px}100%{opacity:0}}
.solar{position:relative;width:min(88vh,880px);height:min(88vh,880px);z-index:2}
.solar svg{width:100%;height:100%}
.crown{mix-blend-mode:screen;transform-origin:50% 50%}
.c1{animation:spin 110s linear infinite}
.c2{animation:spinr 160s linear infinite}
.c3{animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.halo{transform-origin:50% 50%;animation:breathe-sun 5s ease-in-out infinite alternate}
.halo.h2{animation-duration:7s;animation-delay:1.4s}
@keyframes breathe-sun{from{transform:scale(1)}to{transform:scale(1.06)}}
.sun-msg{font-family:var(--display);font-weight:600;fill:#0b1226}
</style></head><body>
