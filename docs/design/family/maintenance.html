<style>
.sky g{animation:drowse 260s linear infinite}
@keyframes drowse{to{transform:translateX(-24px)}}
.solar{position:relative;width:560px;height:560px}
.solar svg{width:100%;height:100%}
.crown1{transform-origin:50% 50%;animation:spin 90s linear infinite}
.crown2{transform-origin:50% 50%;animation:spinr 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.chromo{transform-origin:50% 50%;animation:breathe-sun 4.5s ease-in-out infinite alternate}
@keyframes breathe-sun{from{transform:scale(1)}to{transform:scale(1.05)}}
.prom{stroke-linecap:round;fill:none;filter:blur(1.2px);
      stroke-dasharray:300;animation:lick 11s ease-in-out infinite alternate}
.prom.p2{animation-delay:3.5s}.prom.p3{animation-delay:7s}
@keyframes lick{from{stroke-dashoffset:60;opacity:.5}to{stroke-dashoffset:0;opacity:.9}}
.msg{position:absolute;left:50%;top:74%;transform:translateX(-50%);text-align:center;width:460px}
.msg b{font:600 21px var(--display)}
.msg p{font:11.5px var(--mono);color:var(--ink-mid);margin-top:9px;line-height:1.8}
</style></head><body>
