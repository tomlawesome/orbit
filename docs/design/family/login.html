<style>
.sky .near{animation:appr 70s linear infinite}
.sky .far{animation:appr 130s linear infinite}
@keyframes appr{to{transform:translate(-90px,40px)}}
.horizon{position:fixed;left:50%;bottom:-118vw;width:160vw;height:160vw;
         transform:translateX(-50%);border-radius:50%;background:#04060e;
         box-shadow:0 -2px 0 rgba(240,180,41,.55), 0 -14px 44px rgba(240,180,41,.28),
                    0 -60px 160px rgba(226,119,43,.18);z-index:1}
.dawn{position:fixed;left:50%;bottom:18vh;transform:translateX(-50%);z-index:0;
      width:900px;height:520px;pointer-events:none}
.dawn svg{width:100%;height:100%}
.crown{transform-origin:50% 100%;animation:crest 120s linear infinite}
@keyframes crest{to{transform:rotate(360deg)}}
.dawnglow{transform-origin:50% 100%;animation:breathe-sun 5s ease-in-out infinite alternate}
@keyframes breathe-sun{from{transform:scale(1)}to{transform:scale(1.07)}}
.threshold{position:relative;z-index:3;text-align:center;top:-6vh}
.threshold .wordmark{display:flex;align-items:center;gap:16px;justify-content:center}
.threshold .wordmark span{font:600 44px var(--display);letter-spacing:.01em}
.threshold .strap{font:11px var(--mono);color:var(--ink-mid);letter-spacing:.22em;margin:14px 0 8vh}
.gate{display:inline-flex;align-items:center;gap:18px;padding:14px 16px 14px 26px;border-radius:99px}
.gate span{font:12.5px var(--mono);color:var(--ink-mid)}
.gate button{font:600 14px var(--display);color:var(--bg);background:var(--accent);
             border:0;border-radius:99px;padding:11px 26px;cursor:pointer}
.gate button:hover{filter:brightness(1.08)}
.below{position:fixed;bottom:5vh;left:0;right:0;text-align:center;z-index:3;
       font:10.5px var(--mono);color:var(--ink-faint);letter-spacing:.14em}
</style></head><body>
