<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — planetary conjunction</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="family.css">
<style>
/* 404 — planetary conjunction: a ringed world (the 0) with two "4"s tumbling on
   inclined, eccentric orbits (offset circles, planet off-centre) so each glyph's
   far arc genuinely swings behind the ring disc and its near arc swings in front.
   Orbit A: 20s. Orbit B: 40s. Every 40s (their lcm) both land on the horizontal
   axis through the planet, upright, in front, and it reads 404 for ~2.75s. Motion
   is a single smooth ease (near-standstill at conjunction, gentle floaty coast at
   speed, easing back to standstill) — no piecewise speed jumps. */

body{overflow:hidden}

/* ---------- starfield, two depth layers, independent slow drift ---------- */
.sky{position:fixed;inset:-5%;pointer-events:none;overflow:hidden;z-index:0}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.drift-far{animation:driftFar 320s linear infinite}
.drift-near{animation:driftNear 160s linear infinite}
@keyframes driftFar{from{transform:translateX(0)}to{transform:translateX(-1600px)}}
@keyframes driftNear{from{transform:translateX(0)}to{transform:translateX(-1600px)}}
.star-far{fill:#c9d3f2;opacity:var(--o);animation-name:twA;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.star-near{fill:#eef1fb;opacity:var(--o);animation-name:twA;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.tw-a{animation-duration:3.4s}
.tw-b{animation-duration:4.7s}
.tw-c{animation-duration:6.1s}
.tw-d{animation-duration:5.3s}
@keyframes twA{from{opacity:calc(var(--o) * .45)}to{opacity:calc(var(--o) * 1.4)}}

/* ---------- nebula wash, far behind everything, dim + blurred ---------- */
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:screen;opacity:.5}
.nebula .blobA{animation:nebDriftA 64s ease-in-out infinite alternate}
.nebula .blobB{animation:nebDriftB 88s ease-in-out infinite alternate}
@keyframes nebDriftA{from{transform:translate(-18px,-8px) scale(1)}to{transform:translate(22px,14px) scale(1.06)}}
@keyframes nebDriftB{from{transform:translate(16px,10px) scale(1.02)}to{transform:translate(-20px,-16px) scale(0.97)}}

/* ---------- orbital scene ---------- */
.orbit-stage{position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.orbit-stage svg{width:100%;height:100%;max-width:1600px;max-height:1000px;overflow:visible}

.orbit-path{fill:none;stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:1.5 8;opacity:.08}

.ring-core{animation:ringBreathe 17s ease-in-out infinite}
.ring-halo{animation:haloBreathe 23s ease-in-out infinite}
@keyframes ringBreathe{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes haloBreathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.8;transform:scale(1.035)}}

.glyph-core{filter:url(#glyphCrisp)}
.glyph-mid{filter:url(#glyphGlowSoft)}
.glyph-halo{filter:url(#glyphGlowWide)}

.conj-glow{animation:conjGlow 40s linear infinite}
@keyframes conjGlow{
  0%{filter:brightness(2) saturate(1.15)}
  3.5%{filter:brightness(2) saturate(1.15)}
  6%{filter:brightness(1) saturate(1)}
  94%{filter:brightness(1) saturate(1)}
  96.5%{filter:brightness(2) saturate(1.15)}
  100%{filter:brightness(2) saturate(1.15)}
}

/* ---------- film grain ---------- */
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.06}

/* ---------- vignette, slow ambient breathe ---------- */
.vignette{animation:vigBreathe 26s ease-in-out infinite alternate;z-index:2}
@keyframes vigBreathe{
  from{background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.32) 100%)}
  to{background:radial-gradient(ellipse at 50% 42%,transparent 58%,rgba(0,0,0,.4) 100%)}
}

/* ---------- copy ---------- */
.epilogue{position:fixed;left:0;right:0;bottom:64px;text-align:center;z-index:4}
.epilogue .tagline{font:14px/1.6 var(--display);letter-spacing:.14em;color:var(--ink-mid);
                    text-transform:none}
.epilogue .home{display:inline-block;margin-top:14px;font:11px var(--mono);letter-spacing:.1em;
                 color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);
                 padding-bottom:4px}
.epilogue .home:hover{border-color:var(--accent)}

@media (prefers-reduced-motion: reduce){
  .drift-far,.drift-near,.star-far,.star-near,.ring-core,.ring-halo,
  .nebula .blobA,.nebula .blobB,.vignette,.conj-glow{animation:none!important}
}
</style></head><body>

        <stop offset="100%" stop-color="#2a3a6e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#4a2f52" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#4a2f52" stop-opacity="0"/>
      </radialGradient>
      <filter id="nebBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    </defs>
    <ellipse class="blobA" cx="380" cy="720" rx="420" ry="300" fill="url(#nebA)" filter="url(#nebBlur)"/>
    <ellipse class="blobB" cx="1260" cy="220" rx="380" ry="260" fill="url(#nebB)" filter="url(#nebBlur)"/>
  </svg>
</div>
