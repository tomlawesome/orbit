<style>
.sky g{opacity:.8}
.lost{position:fixed;z-index:2;animation:tumble 60s linear infinite}
@keyframes tumble{from{transform:translate(18vw,72vh) rotate(0)}to{transform:translate(78vw,18vh) rotate(280deg)}}
.beacon{position:relative;text-align:center}
.beacon .ring{position:absolute;left:50%;top:34px;width:12px;height:12px;border-radius:50%;
              border:1px solid var(--accent);transform:translateX(-50%);
              animation:beacon 2.6s ease-out infinite}
@keyframes beacon{from{opacity:.8;scale:1}to{opacity:0;scale:7}}
.beacon h1{font:600 68px var(--display);letter-spacing:-.02em}
.beacon p{font:12.5px var(--mono);color:var(--ink-mid);margin:12px 0 26px}
.beacon a{font:12.5px var(--mono);color:var(--accent);text-decoration:none;
          border:1px solid var(--line);border-radius:99px;padding:8px 20px}
.beacon a:hover{border-color:var(--accent)}
