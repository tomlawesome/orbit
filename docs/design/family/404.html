<title>Orbit — off the chart</title>

<style>
/* layers: giant numerals(0) < derelict(1) < content(3) — nothing crosses above content */
.big404{position:fixed;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none}
.big404 span{font:600 46vh var(--display);letter-spacing:.02em;color:transparent;
             -webkit-text-stroke:1.5px rgba(77,88,120,.35);line-height:1}
.derelict{position:fixed;z-index:1;pointer-events:none;
          animation:drift-x 74s linear infinite}
.derelict .bob{animation:drift-y 74s ease-in-out infinite}
@keyframes drift-x{from{transform:translateX(-14vw)}to{transform:translateX(110vw)}}
@keyframes drift-y{from{transform:translateY(72vh)}50%{transform:translateY(26vh)}to{transform:translateY(64vh)}}
.derelict svg{overflow:visible}
.spinner{transform-origin:26px 26px;animation:selfspin 9s linear infinite}
@keyframes selfspin{to{transform:rotate(360deg)}}
.trail{stroke-dasharray:3 9;stroke-linecap:round;opacity:.4}
.stage{position:relative;z-index:3}
.home{text-align:center}
.home .minisun{position:relative;width:120px;height:120px;margin:0 auto 20px}
.home .minisun .glow{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#fff3d6 0%,rgba(240,180,41,.55) 26%,rgba(226,119,43,.1) 62%,transparent 75%);
  animation:breathe-sun 4s ease-in-out infinite alternate}
@keyframes breathe-sun{from{transform:scale(1)}to{transform:scale(1.12)}}
.home .minisun svg{position:absolute;inset:0;overflow:visible}
.home .minisun .orbiter{transform-origin:60px 60px;animation:orb 7s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.home h1{font:600 30px var(--display);letter-spacing:-.01em}
.home p{font:12px var(--mono);color:var(--ink-mid);margin:10px 0 24px}
.home a{font:12.5px var(--mono);color:var(--accent);text-decoration:none;
        border-bottom:1px solid var(--line);padding-bottom:4px}
.home a:hover{border-color:var(--accent)}
</style></head><body>
