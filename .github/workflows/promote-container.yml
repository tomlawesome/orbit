name: Promote tested Orbit release candidate

on:
  workflow_dispatch:
    inputs:
      release_candidate_digest:
        description: "Feature-complete release-candidate digest, beginning sha256:"
        required: true
        type: string
      version:
        description: Stable semantic version, for example v0.2.0
        required: true
        type: string
      update_latest:
        description: Also point latest at this tested digest
        required: true
        default: true
        type: boolean

concurrency:
  group: orbit-stable-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote immutable digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out stable branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate promotion request
        env:
          RELEASE_CANDIDATE_DIGEST: ${{ inputs.release_candidate_digest }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "${RELEASE_CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Release-candidate digest must be sha256 followed by 64 lowercase hexadecimal characters.\n' >&2
            exit 1
          }
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Version must be a semantic version beginning with v, such as v0.2.0\n' >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify tested release candidate
        id: release_candidate
        env:
          RELEASE_CANDIDATE_DIGEST: ${{ inputs.release_candidate_digest }}
          VERSION: ${{ inputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools inspect "${image}@${RELEASE_CANDIDATE_DIGEST}" >/dev/null
          if docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null 2>&1; then
            printf 'Stable tag %s already exists and will not be overwritten.\n' "${VERSION}" >&2
            exit 1
          fi
          docker pull "${image}@${RELEASE_CANDIDATE_DIGEST}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${RELEASE_CANDIDATE_DIGEST}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image}@${RELEASE_CANDIDATE_DIGEST}")"
          release_candidate_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}@${RELEASE_CANDIDATE_DIGEST}")"
          [[ "${release_stage}" == "release-candidate" ]] || {
            printf 'Only an image labelled as a release candidate can be promoted; received stage %s.\n' "${release_stage:-<missing>}" >&2
            exit 1
          }
          [[ "${release_candidate_version}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.[0-9]+$ ]] || {
            printf 'Image version %s is not a semantic release-candidate version.\n' "${release_candidate_version:-<missing>}" >&2
            exit 1
          }
          expected_version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          [[ "${VERSION}" == "${expected_version}" ]] || {
            printf 'Stable version %s does not match release candidate %s; expected %s.\n' \
              "${VERSION}" "${release_candidate_version}" "${expected_version}" >&2
            exit 1
          }
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Release candidate has no valid source-revision label.\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "${revision}" origin/main || {
            printf 'Release-candidate revision %s has not been merged into main.\n' "${revision}" >&2
            exit 1
          }
          git diff --quiet "${revision}^{tree}" "origin/main^{tree}" || {
            printf 'Main no longer has the exact source tree used by this release candidate; create and test a new release candidate.\n' >&2
            exit 1
          }
          printf 'digest=%s\n' "${RELEASE_CANDIDATE_DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "${revision}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${release_candidate_version}" >> "${GITHUB_OUTPUT}"

      - name: Promote exact release-candidate digest
        env:
          DIGEST: ${{ steps.release_candidate.outputs.digest }}
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags=(--tag "${image}:${VERSION}")
          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "${image}@${DIGEST}"
          promoted_manifest="$(mktemp)"
          docker buildx imagetools inspect --raw "${image}:${VERSION}" > "${promoted_manifest}"
          promoted_digest="sha256:$(sha256sum "${promoted_manifest}" | awk '{print $1}')"
          [[ "${promoted_digest}" == "${DIGEST}" ]] || {
            printf 'Promoted version did not retain the tested digest.\n' >&2
            exit 1
          }

      - name: Record stable promotion
        env:
          DIGEST: ${{ steps.release_candidate.outputs.digest }}
          RELEASE_CANDIDATE_VERSION: ${{ steps.release_candidate.outputs.version }}
          REVISION: ${{ steps.release_candidate.outputs.revision }}
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          {
            printf '## Orbit stable image promoted\n\n'
            printf -- '- Version: `%s`\n' "${VERSION}"
            printf -- '- Release candidate: `%s`\n' "${RELEASE_CANDIDATE_VERSION}"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Source revision: `%s`\n' "${REVISION}"
            printf -- '- Updated `latest`: `%s`\n' "${UPDATE_LATEST}"
            printf '\nNo container rebuild occurred during promotion.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
