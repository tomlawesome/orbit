name: Promote tested Orbit candidate

on:
  workflow_dispatch:
    inputs:
      candidate_digest:
        description: "Tested candidate digest, beginning sha256:"
        required: true
        type: string
      version:
        description: Stable semantic version, for example v0.2.0
        required: true
        type: string
      update_latest:
        description: Also point latest at this tested digest
        required: true
        default: true
        type: boolean

concurrency:
  group: orbit-stable-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote immutable digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out stable branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate promotion request
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Candidate digest must be sha256 followed by 64 lowercase hexadecimal characters.\n' >&2
            exit 1
          }
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Version must be a semantic version beginning with v, such as v0.2.0\n' >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify tested candidate
        id: candidate
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          VERSION: ${{ inputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools inspect "${image}@${CANDIDATE_DIGEST}" >/dev/null
          if docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null 2>&1; then
            printf 'Stable tag %s already exists and will not be overwritten.\n' "${VERSION}" >&2
            exit 1
          fi
          docker pull "${image}@${CANDIDATE_DIGEST}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${CANDIDATE_DIGEST}")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Candidate has no valid source-revision label.\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "${revision}" origin/main || {
            printf 'Candidate revision %s has not been merged into main.\n' "${revision}" >&2
            exit 1
          }
          git diff --quiet "${revision}^{tree}" "origin/main^{tree}" || {
            printf 'Main no longer has the exact source tree used by this candidate; create and test a new candidate.\n' >&2
            exit 1
          }
          printf 'digest=%s\n' "${CANDIDATE_DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "${revision}" >> "${GITHUB_OUTPUT}"

      - name: Promote exact candidate digest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags=(--tag "${image}:${VERSION}")
          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "${image}@${DIGEST}"
          promoted_manifest="$(mktemp)"
          docker buildx imagetools inspect --raw "${image}:${VERSION}" > "${promoted_manifest}"
          promoted_digest="sha256:$(sha256sum "${promoted_manifest}" | awk '{print $1}')"
          [[ "${promoted_digest}" == "${DIGEST}" ]] || {
            printf 'Promoted version did not retain the tested digest.\n' >&2
            exit 1
          }

      - name: Record stable promotion
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          {
            printf '## Orbit stable image promoted\n\n'
            printf -- '- Version: `%s`\n' "${VERSION}"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Source revision: `%s`\n' "${REVISION}"
            printf -- '- Updated `latest`: `%s`\n' "${UPDATE_LATEST}"
            printf '\nNo container rebuild occurred during promotion.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
