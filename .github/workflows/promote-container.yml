name: Promote tested Orbit preview

on:
  workflow_dispatch:
    inputs:
      preview_digest:
        description: "Accepted preview digest, beginning sha256:"
        required: true
        type: string

concurrency:
  group: orbit-stable-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote immutable digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
      attestations: read

    steps:
      - name: Check out stable branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate promotion request
        env:
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
        run: |
          [[ "${PREVIEW_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Preview digest must be sha256 followed by 64 lowercase hexadecimal characters.\n' >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch protected preview refs
        run: git fetch --no-tags origin '+refs/heads/preview:refs/remotes/origin/preview' '+refs/heads/hotfix/*:refs/remotes/origin/hotfix/*'

      - name: Resolve and verify tested preview
        id: preview
        env:
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools inspect "${image}@${PREVIEW_DIGEST}" >/dev/null
          docker pull "${image}@${PREVIEW_DIGEST}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${PREVIEW_DIGEST}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}@${PREVIEW_DIGEST}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image}@${PREVIEW_DIGEST}")"
          source_branch="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.source-branch" }}' "${image}@${PREVIEW_DIGEST}")"
          embedded_version="$(docker run --rm --entrypoint cat "${image}@${PREVIEW_DIGEST}" /opt/orbit/VERSION)"
          embedded_revision="$(docker run --rm --entrypoint cat "${image}@${PREVIEW_DIGEST}" /opt/orbit/REVISION)"
          reported_version="$(docker run --rm "${image}@${PREVIEW_DIGEST}" --version)"

          [[ "${embedded_version}" == "${version}" && "${reported_version}" == "Orbit ${version}" ]] || {
            printf 'Embedded and reported versions do not match the image version label.\n' >&2
            exit 1
          }
          [[ "${embedded_revision}" == "${revision}" ]] || {
            printf 'Embedded revision does not match the image revision label.\n' >&2
            exit 1
          }
          channel=preview
          if [[ "${source_branch}" == hotfix/* ]]; then
            channel=hotfix
          elif [[ "${source_branch}" != "preview" ]]; then
            printf 'Preview source branch is not eligible for stable promotion.\n' >&2
            exit 1
          fi
          expected_version="$(node scripts/calculate-version.mjs --channel "${channel}")"
          [[ "${version}" == "${expected_version}" ]] || {
            printf 'Embedded version %s does not match calculated version %s.\n' \
              "${version}" "${expected_version}" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            printf 'Stable Git tag %s already exists and will not be overwritten.\n' "${version}" >&2
            exit 1
          fi

          ORBIT_PROMOTION_PHASE=promote \
          ORBIT_PREVIEW_DIGEST="${PREVIEW_DIGEST}" \
          ORBIT_STABLE_VERSION="${version}" \
          ORBIT_PREVIEW_STAGE="${release_stage}" \
          ORBIT_PREVIEW_REVISION="${revision}" \
          ORBIT_PREVIEW_SOURCE_BRANCH="${source_branch}" \
            node scripts/stable-promotion-policy.mjs
          {
            printf 'digest=%s\n' "${PREVIEW_DIGEST}"
            printf 'revision=%s\n' "${revision}"
            printf 'source_branch=%s\n' "${source_branch}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify accepted digest attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.preview.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          gh attestation verify "${image_reference}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 >/dev/null

      - name: Promote exact preview digest to latest
        env:
          DIGEST: ${{ steps.preview.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:latest" "${image}@${DIGEST}"
          promoted_manifest="$(mktemp)"
          docker buildx imagetools inspect --raw "${image}:latest" > "${promoted_manifest}"
          promoted_digest="sha256:$(sha256sum "${promoted_manifest}" | awk '{print $1}')"
          [[ "${promoted_digest}" == "${DIGEST}" ]] || {
            printf 'Latest did not retain the tested digest.\n' >&2
            exit 1
          }

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.preview.outputs.digest }}
          REVISION: ${{ steps.preview.outputs.revision }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          notes="$(mktemp)"
          {
            printf 'Orbit %s\n\n' "${VERSION}"
            printf -- '- Container digest: `%s`\n' "${DIGEST}"
            printf -- '- Preview source revision: `%s`\n' "${REVISION}"
            printf '\nThe exact tested preview digest was promoted without rebuilding it.\n'
          } > "${notes}"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Orbit ${VERSION}" \
            --notes-file "${notes}"

      - name: Record stable promotion
        env:
          DIGEST: ${{ steps.preview.outputs.digest }}
          REVISION: ${{ steps.preview.outputs.revision }}
          SOURCE_BRANCH: ${{ steps.preview.outputs.source_branch }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          {
            printf '## Orbit stable image promoted\n\n'
            printf -- '- Version: `%s`\n' "${VERSION}"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Source revision: `%s`\n' "${REVISION}"
            printf -- '- Source branch: `%s`\n' "${SOURCE_BRANCH}"
            printf -- '- Updated tag: `latest`\n'
            printf '\nThe matching Git tag and GitHub Release were created. No container rebuild occurred.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
