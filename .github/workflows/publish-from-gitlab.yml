name: Publish the GitLab-tested image to GHCR

# GitLab (ai/orbit) is where Orbit is tested and merged; this repository is a
# push mirror of it (#801 step 5). When a merge to `preview` or a hotfix branch
# arrives here, the GitLab pipeline for the same commit builds the image, runs
# the whole gate against it, records the digest it tested and has it attested
# with GitLab's key. This workflow publishes that exact digest to GHCR, where
# operators pull from, and attests it. It never builds: a rebuild here would be
# a different image from the one that was tested.
#
# GitHub never connects to GitLab (#1824; GitHub's runners cannot reliably
# reach it, #1821). GitLab hands off instead: its handoff_to_github job saves
# the tested image, by digest, with its attestation, as one OCI-layout archive
# and uploads it with the evidence and the SBOM to a release named
# handoff-<commit> in the separate public handoff repository,
# <owner>/orbit-handoff (GitLab's upload script): a draft first,
# handoff-complete.json last, published only once every file is up. This is
# offline image transfer: save, carry, load, verify on arrival. The release is
# only the carrier and is not trusted:
#
#   1. github-await-handoff.sh waits for the published release, checks every file against
#      handoff-complete.json and the evidence against this run's commit and
#      ref, and refuses evidence older than seven days;
#   2. the archive is loaded into a throwaway registry on this runner, and
#      GitLab's attestation is verified there with the committed cosign.pub by
#      the shared verifier (verify-validation-evidence.sh);
#   3. only then are the image and that attestation copied to GHCR, tagged and
#      attested. Nothing unverified is written to GHCR.
#
# The mirror push lands within minutes of the merge while the GitLab pipeline
# takes the best part of an hour, so the first step waits for the handoff. If
# GitLab's pipeline fails, no handoff appears, this fails too and publishes
# nothing; retry on GitLab, then run this again from the Actions tab.
#
# The channel tag is `preview` for hotfix branches as well, as the retired
# GitHub build did: verify_preview and
# GitLab's `promote_stable` job (scripts/ci/promote-stable.sh, #821) resolve
# `:preview` for both.
#
# Secrets: none beyond the built-in token, which holds `contents: read` only,
# in every job (#1107, 21a): the handoff repository is public, so reading it
# needs no write access, and this workflow never writes to it, prunes it or
# deletes anything there (GitLab's handoff job does that). The token GitLab
# uploads with (the handoff token, Contents on the handoff repository only)
# lives on GitLab, never here, and has no power over this repository: a key
# that could write here could push a commit swapping cosign.pub (ADR-0031).

on:
  push:
    branches:
      - preview
      - "hotfix/**"
  workflow_dispatch: {}

concurrency:
  group: publish-from-gitlab-${{ github.ref }}
  # Never cancel: every merge deserves its own published digest. A slower run
  # for an older commit still publishes its sha- tag; it only moves the channel
  # tag if that commit is still the head of the branch (checked below).
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The throwaway registry on this runner that the handoff archive is loaded
  # into and verified in. Plain HTTP on the loopback address only; it lives as
  # long as the job.
  THROWAWAY_IMAGE: 127.0.0.1:5000/ai/orbit

jobs:
  publish:
    name: Copy tested digest to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      # Read only, as at the top: see the header (#1107, 21a).
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      # Space-separated, same value the "Decide which tags this commit may
      # take" step below computes: "sha-<sha>" alone, or "sha-<sha> preview"
      # when this commit is still the branch head and the channel tag moved.
      # verify_bootstrap reads this to know whether there is a freshly moved
      # channel tag worth re-proving, rather than re-running on every commit
      # that only got a sha- tag.
      tags: ${{ steps.tags.outputs.list }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for GitLab's handoff and check it
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HANDOFF_REPO: ${{ github.repository_owner }}/orbit-handoff
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_REF: ${{ github.ref_name }}
          ORBIT_FETCH_IMAGE: "1"
        run: bash scripts/ci/github-await-handoff.sh

      - name: Set up crane
        run: |
          crane_dir="$(bash scripts/ci/ensure-crane.sh)"
          echo "${crane_dir}" >> "$GITHUB_PATH"

      # The archive is not trusted yet, so it is unpacked only if it holds
      # nothing but an OCI layout: regular files and directories with layout
      # names, no links, nothing outside the target directory. The throwaway
      # registry keeps running for the rest of the job.
      - name: Load the handoff into a throwaway registry
        env:
          ARCHIVE: ${{ steps.evidence.outputs.image_archive }}
          DIGEST: ${{ steps.evidence.outputs.digest }}
        run: |
          set -Eeuo pipefail
          layout="${RUNNER_TEMP}/orbit-image-layout"
          unexpected="$(tar -tf "${ARCHIVE}" | grep -Evx '\./|\./(oci-layout|index\.json|blobs/|blobs/sha256/|blobs/sha256/[0-9a-f]{64})' || true)"
          types="$(tar -tvf "${ARCHIVE}" | cut -c1 | sort -u | tr -d '\n')"
          if [[ -n "${unexpected}" || ! "${types}" =~ ^[-d]+$ ]]; then
            printf '::error::the handoff archive holds something other than an OCI layout; refusing it\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          mkdir -p "${layout}"
          tar --no-same-owner --no-same-permissions -C "${layout}" -xf "${ARCHIVE}"
          registry="${THROWAWAY_IMAGE%%/*}"
          nohup crane registry serve --address "${registry}" > "${RUNNER_TEMP}/throwaway-registry.log" 2>&1 &
          for _ in $(seq 30); do
            curl --silent --fail "http://${registry}/v2/" > /dev/null && break
            sleep 1
          done
          curl --silent --show-error --fail "http://${registry}/v2/" > /dev/null
          cosign="$(bash scripts/ci/ensure-cosign.sh)"
          "${cosign}" load --dir "${layout}" "${THROWAWAY_IMAGE}"
          loaded="$(crane digest "${THROWAWAY_IMAGE}@${DIGEST}")" || {
            printf '::error::the handoff archive does not hold the image the evidence names (%s)\n' "${DIGEST}" >&2
            exit 1
          }
          printf 'Loaded %s@%s.\n' "${THROWAWAY_IMAGE}" "${loaded}"

      # The cryptographic check, with the shared verifier every publishing hop
      # uses (#1108). Nothing reaches GHCR unless GitLab's key-based
      # attestation for this exact digest verifies with the committed
      # cosign.pub. It runs against the throwaway registry, which holds exactly
      # what GitLab handed off and nothing else.
      - name: Verify GitLab's signed evidence before copying
        env:
          ORBIT_IMAGE: ${{ env.THROWAWAY_IMAGE }}
          ORBIT_DIGEST: ${{ steps.evidence.outputs.digest }}
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_REF: ${{ github.ref_name }}
        run: bash scripts/ci/verify-validation-evidence.sh

      # Only the newest commit on the branch may own the channel tag. This run
      # could be for an older commit if two merges landed within an hour.
      - name: Decide which tags this commit may take
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}" --jq '.commit.sha')"
          tags="sha-${GITHUB_SHA}"
          if [[ "${head}" == "${GITHUB_SHA}" ]]; then
            tags="${tags} preview"
          else
            printf '%s is no longer the head of %s (now %s); publishing only the sha- tag.\n' "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${head}"
          fi
          printf 'list=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GITHUB_TOKEN}" | crane auth login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

      # From the throwaway registry, the one the verifier just checked. The
      # sha- tag goes first, then GitLab's attestation (the referrers of the
      # validation type, copied by digest, so crane adds each to GHCR's
      # referrer list without dropping what is already there), and only then
      # the channel tag, so `preview` never points at an image whose
      # attestation is not on GHCR yet.
      - name: Copy the exact tested digest
        id: publish
        env:
          SOURCE: ${{ env.THROWAWAY_IMAGE }}@${{ steps.evidence.outputs.digest }}
          DIGEST: ${{ steps.evidence.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=scripts/release-metadata-patterns.sh
          source scripts/release-metadata-patterns.sh
          image="${REGISTRY}/${IMAGE_NAME,,}"
          # The source must still resolve to the digest the evidence names.
          [[ "$(crane digest "${SOURCE}")" == "${DIGEST}" ]] || {
            printf 'The throwaway registry no longer serves %s.\n' "${SOURCE}" >&2
            exit 1
          }
          predicate_type="$(sed -n 's/^readonly PREDICATE_TYPE="\(.*\)"$/\1/p' scripts/ci/verify-validation-evidence.sh)"
          referrers="$(crane manifest "${THROWAWAY_IMAGE}:sha256-${DIGEST#sha256:}" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => { raw += c; }).on("end", () => {
              const index = JSON.parse(raw);
              const wanted = (index.manifests ?? []).filter((m) =>
                m.artifactType === "application/vnd.dev.sigstore.bundle.v0.3+json" &&
                m.annotations?.["dev.sigstore.bundle.predicateType"] === process.argv[1]);
              process.stdout.write(wanted.map((m) => m.digest).join("\n"));
            });
          ' -- "${predicate_type}")"
          [[ -n "${referrers}" ]] || {
            printf 'The handoff carries no attestation of type %s to copy.\n' "${predicate_type}" >&2
            exit 1
          }
          for referrer in ${referrers}; do
            [[ "${referrer}" =~ ${ORBIT_DIGEST_PATTERN} ]] || {
              printf 'The handoff names an attestation with a malformed digest: %s\n' "${referrer}" >&2
              exit 1
            }
          done
          first=1
          for tag in ${TAGS}; do
            crane copy "${SOURCE}" "${image}:${tag}"
            published="$(crane digest "${image}:${tag}")"
            [[ "${published}" == "${DIGEST}" ]] || {
              printf '%s:%s resolved to %s after the copy, expected %s.\n' "${image}" "${tag}" "${published}" "${DIGEST}" >&2
              exit 1
            }
            if [[ "${first}" == 1 ]]; then
              for referrer in ${referrers}; do
                crane copy "${THROWAWAY_IMAGE}@${referrer}" "${image}@${referrer}"
              done
              first=0
            fi
          done
          printf 'image=%s\n' "${image}" >> "${GITHUB_OUTPUT}"

      # The same verifier against GHCR, so a copy that left GitLab's
      # attestation behind fails here. countersign.yml and stable promotion
      # read it from GHCR later.
      - name: Verify GitLab's evidence arrived on GHCR
        env:
          ORBIT_DIGEST: ${{ steps.evidence.outputs.digest }}
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_REF: ${{ github.ref_name }}
        run: ORBIT_IMAGE="${REGISTRY}/${IMAGE_NAME,,}" bash scripts/ci/verify-validation-evidence.sh

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          sbom-path: ${{ steps.evidence.outputs.sbom }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify published image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.evidence.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json \
            > .orbit-supply-chain/provenance-verification.json
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > .orbit-supply-chain/sbom-verification.json

      - name: Upload publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-published-from-gitlab
          path: |
            .orbit-supply-chain/gitlab-tested-image.json
            .orbit-supply-chain/image.spdx.json
            .orbit-supply-chain/provenance-verification.json
            .orbit-supply-chain/sbom-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record published image
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          TAGS: ${{ steps.tags.outputs.list }}
          IMAGE_DIGEST: ${{ steps.evidence.outputs.digest }}
          SOURCE: ${{ steps.evidence.outputs.source_reference }}
          PIPELINE_URL: ${{ steps.evidence.outputs.pipeline_url }}
        run: |
          {
            printf '## Orbit preview image, published from GitLab\n\n'
            printf -- '- Image: `%s`\n' "${IMAGE}"
            printf -- '- Tags: `%s`\n' "${TAGS}"
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Tested on GitLab as: `%s`\n' "${SOURCE}"
            printf -- '- Handed off in: release `handoff-%s` of the handoff repository\n' "${GITHUB_SHA}"
            printf -- '- Tested by: %s\n' "${PIPELINE_URL}"
            printf -- '- Source revision: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Source branch: `%s`\n' "${GITHUB_REF_NAME}"
            printf '\nNo container was built here. Deploy this immutable digest for engineering or release acceptance; it is not stable until protected promotion succeeds.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  verify_bootstrap:
    name: Prove the published channel tag resolves (#724)
    # scripts/test-install-bootstrap.sh is the strongest install evidence
    # Orbit owns, and until #724 nothing ran it -- not on a schedule and not
    # on the one event that can actually invalidate what it asserts: a
    # publish that moves ghcr.io/tomlawesome/orbit:preview to a digest the
    # documented bootstrap then fails to resolve. `publish` above is that
    # event for this repository: GitLab's own record_image and
    # publish_channel jobs (.gitlab-ci.yml) push only to
    # registry.tomlawson.io, so GHCR's
    # channel tag -- the one this harness checks -- only ever moves here, in
    # the "Copy the exact tested digest" step. Running immediately after that
    # step is this repository's publication path.
    #
    # Gated on needs.publish.outputs.tags containing "preview" rather than
    # needs.publish.result alone: a run for a commit that lost the race to be
    # branch head (see "Decide which tags this commit may take" above)
    # published only its sha- tag and left the channel tag untouched, so
    # there is nothing this commit's publish changed for the harness to
    # re-prove.
    #
    # Green only, not `--red`. `--red` corrupts the expected digest to prove
    # the comparison can fail at all -- a property of the harness itself, not
    # of any one publish -- so it stays on install_bootstrap's weekly
    # schedule in .gitlab-ci.yml, where a self-test belongs. This job checks
    # the thing that actually changed: does the tag this publish just moved
    # resolve to the digest that was published.
    needs: publish
    if: success() && contains(needs.publish.outputs.tags, 'preview')
    runs-on: ubuntu-latest
    # The harness bounds its own install at 30 minutes; the rest is headroom
    # for checkout and the OIDC sidecar's one-time image build.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the published preview channel tag resolves
        # ubuntu-latest ships Docker and the Compose v2 plugin already, so
        # this needs none of the dind setup .gitlab-ci.yml's install_bootstrap
        # job builds for itself -- the runner is already the daemon.
        run: bash scripts/test-install-bootstrap.sh --branch "${GITHUB_REF_NAME}" --channel preview
