name: Validate Orbit and publish previews

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - develop
      - "release/**"

concurrency:
  group: orbit-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy@sha256:c6e969c5662a546ad5de4a73c2a6b7a7c627f86d916903e175aa623af5b97ada

jobs:
  # Classifies a pull request as executable or not so that container and browser
  # validation can be skipped for changes that cannot affect runtime behaviour.
  #
  # The classification is an allowlist of provably non-executable paths: any
  # unrecognised path, and every push event, is treated as executable. The gate
  # is applied at job level rather than through a workflow-level `paths:` filter,
  # because a required check that never runs leaves a pull request pending
  # forever under the branch ruleset, whereas a skipped job reports a result.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      executable: ${{ steps.classify.outputs.executable }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          ORBIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORBIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-changed-paths.mjs

  fast:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enforce protected planning governance
        if: github.event_name == 'pull_request'
        env:
          ORBIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORBIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORBIT_PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-planning-governance.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        env:
          ORBIT_TEST_COVERAGE: "true"
        run: bash scripts/test-backend.sh

      - name: Upload diagnostic coverage
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-coverage
          path: coverage/
          retention-days: 14

  supply_chain_source:
    name: Source dependency and secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate supply-chain policy
        run: node scripts/supply-chain-policy.mjs validate

      - name: Scan repository dependencies and secrets
        run: |
          mkdir -p .orbit-supply-chain "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" fs \
            --scanners vuln,secret \
            --format json \
            --output /workspace/.orbit-supply-chain/source-raw.json \
            /workspace
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json

      - name: Enforce source supply-chain policy
        run: |
          set +e
          node scripts/supply-chain-policy.mjs source \
            --input .orbit-supply-chain/source-raw.json \
            --output .orbit-supply-chain/source-evidence.json
          policy_status=$?
          set -e
          rm -f .orbit-supply-chain/source-raw.json
          exit "${policy_status}"

      - name: Upload bounded source supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-source
          path: |
            .orbit-supply-chain/source-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: PostgreSQL service and API integration
    needs:
      - changes
      - fast
      - supply_chain_source
    # Skipped rather than filtered out, so the required check still reports.
    if: needs.changes.outputs.executable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated PostgreSQL integration tests
        run: |
          set +e
          pnpm test:integration &
          first_pid=$!
          pnpm test:integration &
          second_pid=$!
          wait "$first_pid"
          first_status=$?
          wait "$second_pid"
          second_status=$?
          if (( first_status != 0 || second_status != 0 )); then
            exit 1
          fi

  smoke:
    name: Compose smoke test
    needs:
      - changes
      - fast
      - supply_chain_source
      - integration
    if: github.event_name == 'pull_request' && needs.changes.outputs.executable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUBLICATION_CHANNEL: ci

    # Reuse one validation sequence while keeping PR and publication token
    # permissions isolated at the job boundary.
    steps: &container_validation_steps
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test configuration
        run: |
          bash scripts/configure.sh
          openssl rand -hex 32 > .orbit-secrets/smtp-password
          openssl rand -hex 32 > .orbit-secrets/imap-password
          openssl rand -hex 32 > .orbit-secrets/imap-alias-current-secret
          openssl rand -hex 32 > .orbit-secrets/imap-alias-previous-secret
          chmod 600 .orbit-secrets/smtp-password .orbit-secrets/imap-password \
            .orbit-secrets/imap-alias-current-secret \
            .orbit-secrets/imap-alias-previous-secret
          sed --in-place 's/^SMTP_HOST=.*/SMTP_HOST=smtp.example.invalid/' .env-orbit
          sed --in-place 's/^SMTP_USER=.*/SMTP_USER=orbit@example.invalid/' .env-orbit
          sed --in-place 's/^IMAP_HOST=.*/IMAP_HOST=imap.example.invalid/' .env-orbit
          sed --in-place 's/^IMAP_USER=.*/IMAP_USER=orbit@example.invalid/' .env-orbit
          sed --in-place 's/^IMAP_TLS_SERVER_NAME=.*/IMAP_TLS_SERVER_NAME=imap.example.invalid/' .env-orbit
          sed --in-place 's/^IMAP_RECIPIENT_DOMAIN=.*/IMAP_RECIPIENT_DOMAIN=ingest.example.invalid/' .env-orbit
          sed --in-place 's/^IMAP_ENABLED=.*/IMAP_ENABLED=false/' .env-orbit
          sed --in-place 's/^OIDC_CLIENT_ID=.*/OIDC_CLIENT_ID=orbit-smoke/' .env-orbit
          sed --in-place 's/^OIDC_CLIENT_SECRET=.*/OIDC_CLIENT_SECRET=orbit-smoke-only-secret/' .env-orbit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Generate unique preview tag
        id: preview_tag
        run: |
          branch_slug="$(
            printf '%s' "${GITHUB_REF_NAME}" |
              tr '[:upper:]' '[:lower:]' |
              sed --regexp-extended 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g'
          )"
          [[ -n "${branch_slug}" ]] || {
            printf 'Could not derive a safe preview branch identifier.\n' >&2
            exit 1
          }
          preview_tag="preview-${branch_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'tag=%s\n' "${preview_tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate exact image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ci-${{ github.sha }},enable=${{ env.PUBLICATION_CHANNEL == 'ci' }}
            type=raw,value=${{ steps.preview_tag.outputs.tag }},enable=${{ env.PUBLICATION_CHANNEL == 'preview' }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Everything in your orbit, on track.
            io.github.tomlawesome.orbit.release-stage=${{ env.PUBLICATION_CHANNEL }}
            io.github.tomlawesome.orbit.source-branch=${{ github.ref_name }}

      - name: Build and load final image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record exact local image identity
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t image_tags < <(printf '%s\n' "${IMAGE_TAGS}" | sed '/^$/d')
          [[ "${#image_tags[@]}" -eq 1 ]] || {
            printf 'Expected exactly one image tag, received %s.\n' "${#image_tags[@]}" >&2
            exit 1
          }
          image_tag="${image_tags[0]}"
          image_id="$(docker image inspect --format '{{.Id}}' "${image_tag}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_tag}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image_tag}")"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Built image has no valid configuration identity.\n' >&2
            exit 1
          }
          [[ "${revision}" == "${GITHUB_SHA}" ]] || {
            printf 'Built image revision %s does not match workflow revision %s.\n' "${revision}" "${GITHUB_SHA}" >&2
            exit 1
          }
          [[ "${release_stage}" == "${PUBLICATION_CHANNEL}" ]] || {
            printf 'Built image stage %s does not match channel %s.\n' "${release_stage}" "${PUBLICATION_CHANNEL}" >&2
            exit 1
          }
          {
            printf 'id=%s\n' "${image_id}"
            printf 'tag=%s\n' "${image_tag}"
          } >> "${GITHUB_OUTPUT}"
          printf 'ORBIT_IMAGE=%s\n' "${image_tag}" >> "${GITHUB_ENV}"

      - name: Scan exact local image
        env:
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p .orbit-supply-chain "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --format json \
            --output /workspace/.orbit-supply-chain/image-vulnerabilities.json \
            "${TESTED_IMAGE_TAG}"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --format spdx-json \
            --output /workspace/.orbit-supply-chain/image.spdx.json \
            "${TESTED_IMAGE_TAG}"
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json
          node scripts/supply-chain-policy.mjs image \
            --input .orbit-supply-chain/image-vulnerabilities.json \
            --sbom .orbit-supply-chain/image.spdx.json \
            --output .orbit-supply-chain/image-evidence.json \
            --expected-image-id "${TESTED_IMAGE_ID}" \
            --expected-tag "${TESTED_IMAGE_TAG}" \
            --revision "${GITHUB_SHA}"

      - name: Upload exact-image supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-image-${{ env.PUBLICATION_CHANNEL }}
          path: |
            .orbit-supply-chain/image-vulnerabilities.json
            .orbit-supply-chain/image.spdx.json
            .orbit-supply-chain/image-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env-orbit config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.acceptance.yml config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.mail-alias-rotation.yml config --quiet
          docker compose --env-file .env-orbit \
            -f docker-compose.yml -f docker-compose.full.yml \
            --profile processing --profile ai config --quiet
          processing_config="$(docker compose --env-file .env-orbit \
            --profile processing config --format json)"
          jq --exit-status '
            .networks["orbit-document-processing"].internal == true
            and (.services["orbit-tika"].networks | keys == ["orbit-document-processing"])
            and .services["orbit-tika"].user == "35002:35002"
            and .services["orbit-tika"].read_only == true
            and .services["orbit-tika"].command == ["-c", "/etc/orbit/tika-config.xml"]
            and (.services["orbit-tika"].cap_drop == ["ALL"])
            and (.services["orbit-tika"].configs | any(.source == "orbit-tika-config" and .target == "/etc/orbit/tika-config.xml"))
            and ((.services["orbit-tika"].volumes // []) | length == 0)
            and ((.services["orbit-tika"].secrets // []) | length == 0)
            and (.services["orbit-app"].networks | has("default") and has("orbit-document-processing"))
            and (.services["orbit-db"].networks | has("default") and (has("orbit-document-processing") | not))
            and (.services["orbit-clamav"].networks | keys == ["orbit-document-processing", "orbit-malware-signature-updates"])
            and ((.services["orbit-clamav"].networks | has("default")) | not)
          ' <<< "${processing_config}"

      - name: Detect exact processor validation scope
        id: processor_scope
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
             git diff --quiet HEAD^ HEAD -- \
               config/tika-config.xml \
               docker-compose.yml \
               src/server/document-drafts.ts \
               src/server/documents \
               src/server/item-document-inspection.ts \
               scripts/test-tika-processor.mjs \
               .github/workflows/publish-container.yml; then
            printf 'required=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'required=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify exact hostile-document processor
        if: steps.processor_scope.outputs.required == 'true'
        env:
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker compose --env-file .env-orbit --profile processing pull orbit-tika
          docker compose --env-file .env-orbit --profile processing up --detach orbit-tika
          tika_id="$(docker compose --env-file .env-orbit --profile processing ps --quiet orbit-tika)"
          test -n "${tika_id}"
          tika_user="$(docker inspect --format '{{.Config.User}}' "${tika_id}")"
          tika_read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${tika_id}")"
          tika_network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "${tika_id}")"
          test "${tika_user}" = "35002:35002"
          test "${tika_read_only}" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "${tika_id}")" = '["ALL"]'
          test "$(docker network inspect --format '{{.Internal}}' "${tika_network}")" = "true"
          docker inspect "${tika_id}" | jq --exit-status '
            .[0].Mounts
            | length >= 1
            and any(.Destination == "/etc/orbit/tika-config.xml" and .RW == false)
            and all(.Destination == "/etc/orbit/tika-config.xml" or .Destination == "/tmp")
          '
          docker compose --env-file .env-orbit --profile processing exec -T orbit-tika \
            sh -c 'test -r /etc/orbit/tika-config.xml && test -w /tmp'
          tika_uid="$(docker compose --env-file .env-orbit --profile processing exec -T orbit-tika \
            sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "${tika_uid}" = "35002"
          docker run --rm \
            --network "${tika_network}" \
            --entrypoint node \
            --env TIKA_TEST_URL=http://orbit-tika:9998 \
            --volume "${GITHUB_WORKSPACE}/scripts/test-tika-processor.mjs:/tmp/test-tika-processor.mjs:ro" \
            "${TESTED_IMAGE_TAG}" \
            /tmp/test-tika-processor.mjs

      - name: Build disposable OIDC acceptance provider
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.acceptance.yml build orbit-oidc

      - name: Start application and database
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml up --detach --no-build --wait --wait-timeout 180

      - name: Verify health endpoint
        run: |
          response="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          jq --exit-status '.status == "ready" and .service == "orbit"' <<< "${response}"

      - name: Verify non-root runtime and private secrets
        run: |
          runtime_uid="$(docker compose --env-file .env-orbit exec -T orbit-app \
            sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "${runtime_uid}" = "1001"
          docker compose --env-file .env-orbit exec -T orbit-app sh -c '
            for secret in /run/orbit-secrets/*; do
              test -f "${secret}"
              test "$(stat -c %u "${secret}")" = "1001"
              test "$(stat -c %a "${secret}")" = "400"
            done
          '

      - name: Verify malware scanner detection
        run: bash scripts/test-malware-scanner.sh

      - name: Verify backup and restore round trip
        run: bash scripts/test-backup-restore.sh

      - name: Verify signed-out privacy boundary and favicon
        run: |
          status="$(curl --silent --output /tmp/orbit-workspace.json --write-out '%{http_code}' http://127.0.0.1:3000/api/workspace)"
          test "${status}" = "401"
          curl --fail --silent --show-error --output /tmp/orbit-icon.svg http://127.0.0.1:3000/icon.svg
          grep --quiet '<svg' /tmp/orbit-icon.svg

      - name: Run browser and accessibility checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ORBIT_ACCEPTANCE_OIDC: "true"
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          bash scripts/test-frontend.sh

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml ps
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml logs --no-color
          app_container="$(docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml ps --quiet orbit-app)"
          if [[ -n "${app_container}" ]]; then
            docker inspect --format='{{json .State.Health}}' "${app_container}"
          fi

      - name: Stop smoke-test services
        if: always()
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml --profile processing down --volumes --remove-orphans

      - name: Log in to GitHub Container Registry
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact tested image
        id: publish
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          docker push "${IMAGE_TAG}"
          published_digest="$(
            docker buildx imagetools inspect "${IMAGE_TAG}" |
              awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          )"
          [[ "${published_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Registry did not return a valid immutable image digest.\n' >&2
            exit 1
          }
          repository="${IMAGE_TAG%:*}"
          docker pull "${repository}@${published_digest}"
          published_image_id="$(
            docker image inspect --format '{{.Id}}' "${repository}@${published_digest}"
          )"
          [[ "${published_image_id}" == "${TESTED_IMAGE_ID}" ]] || {
            printf 'Published image identity %s does not match tested identity %s.\n' \
              "${published_image_id}" "${TESTED_IMAGE_ID}" >&2
            exit 1
          }
          {
            printf 'digest=%s\n' "${published_digest}"
            printf 'id=%s\n' "${published_image_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: .orbit-supply-chain/image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify published image attestations
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json \
            > .orbit-supply-chain/provenance-verification.json
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > .orbit-supply-chain/sbom-verification.json

      - name: Upload attestation verification evidence
        if: ${{ !cancelled() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-attestation
          path: |
            .orbit-supply-chain/provenance-verification.json
            .orbit-supply-chain/sbom-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record published image
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          TESTED_IMAGE_ID: ${{ steps.publish.outputs.id }}
        run: |
          {
            printf '## Orbit preview image\n\n'
            printf -- '- Tag: `%s`\n' "${IMAGE_TAG}"
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Tested image ID: `%s`\n' "${TESTED_IMAGE_ID}"
            printf -- '- Source revision: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Source branch: `%s`\n' "${GITHUB_REF_NAME}"
            printf -- '- Supply-chain evidence: dependency/secret policy, exact-image vulnerability report, SPDX SBOM, and verified provenance/SBOM attestations\n'
            printf '\nDeploy this immutable digest for engineering or release acceptance. It is not stable until protected promotion succeeds.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_preview:
    name: Validate and publish preview image
    needs:
      - fast
      - supply_chain_source
      - integration
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/develop' ||
          (
            startsWith(github.ref, 'refs/heads/release/') &&
            github.ref_name != 'release/architecture-consolidation-rc'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLICATION_CHANNEL: preview
    steps: *container_validation_steps
