name: Validate Orbit and publish previews

# Since the mirror flip (#801 step 5) this repository is a push mirror of
# gitlab.tomlawson.io ai/orbit, where every merge is decided and .gitlab-ci.yml
# runs the whole gate. This workflow is GitHub's second opinion on the same
# commits: it still runs everything, but a failure here blocks nothing, and it
# no longer publishes. The image operators pull from GHCR is copied there by
# publish-from-gitlab.yml, by the digest GitLab tested, so nothing built here
# can reach a registry. Pull-request triggers are kept for the rare pull request
# opened here directly; the day-to-day trigger is the mirror's push.
on:
  pull_request:
    # Deliberately no `labeled` (#757). It fired one whole run per label, so
    # `gh pr create --label a --label b` started three; the concurrency group
    # cancelled two, and because branch protection reads the newest check run
    # of each name, a cancelled run with a higher id could leave every real
    # green check reported as CANCELLED and the pull request BLOCKED.
    #
    # GitHub cannot filter an event by label name, and there is no
    # workflow-level `if`, so the alternatives were both worse: gating the
    # jobs still creates a run whose SKIPPED results replace the real ones,
    # and a helper workflow cannot dispatch this one because events raised
    # with GITHUB_TOKEN start no run.
    #
    # Asking for the on-demand lanes after opening is therefore a dispatch:
    # `gh workflow run publish-container.yml --ref <branch>`. The
    # `ci: acceptance` label still opts a run in whenever one happens for
    # another reason, so labelling before the first push works as before.
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - dev
      - preview
  push:
    branches:
      - dev
      - preview
      - main
      - "hotfix/**"
  workflow_dispatch: {}

concurrency:
  group: orbit-container-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel only a superseded pull-request commit. A push must never cancel the
  # validation of an earlier merge: the delivery model requires trusted evidence
  # for that exact merge SHA, and a cancelled run leaves it permanently without.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Least-privilege default for anything added later: every job below already
  # declares its own block, so this changes nothing today. Without it a job
  # added without a permissions block would silently inherit the repository's
  # default token scope instead of read-only access (#508).
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy@sha256:c6e969c5662a546ad5de4a73c2a6b7a7c627f86d916903e175aa623af5b97ada
  # The vulnerability database comes from the vendor's own registry, not from
  # Trivy's built-in default of mirror.gcr.io -- a public Google mirror with no
  # availability commitment to us, whose 403 failed this security gate on an
  # unrelated pull request (#673).
  #
  # Deliberately ONE repository, not a list. Trivy 0.72 accepts a
  # comma-separated value but does not fall back: given a failing primary and a
  # working secondary it exits fatally on the first, reporting "1 error
  # occurred". Verified against this exact image pin. Resilience here is the
  # retry in the scanning steps, never a second repository.
  #
  # The organisation is `aquasecurity`, not the `aquasec` of the Docker Hub
  # image above. The wrong one does not 404 -- ghcr denies the token request,
  # which reads like a credentials fault rather than a typo.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

jobs:
  # Selects the cheapest pull-request lane that still exercises every changed
  # boundary: fast, real PostgreSQL integration, or exact-image system tests.
  #
  # Classification is fail-safe: an unknown path, unreadable comparison, changed
  # production dependency graph, workflow/deployment boundary, and every push
  # event selects the broad system lane. Gates remain at job level rather than
  # using workflow path filters, because required skipped jobs report a terminal
  # result instead of leaving a pull request pending forever.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      build: ${{ steps.classify.outputs.build }}
      integration: ${{ steps.classify.outputs.integration }}
      system: ${{ steps.classify.outputs.system }}
      web: ${{ steps.classify.outputs.web }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The classifier uses pnpm's lockfile-only graph reader. It never installs
      # dependencies or executes package lifecycle scripts.
      - name: Set up pnpm graph reader
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Classify changed paths
        id: classify
        env:
          ORBIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORBIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-changed-paths.mjs

  base_image:
    name: Base image freshness
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Blocking since #651: Orbit now pins its own base image, so a stale base
    # is a fixable condition rather than an upstream one we can only wait on.
    # The time-boxed `continue-on-error` this replaces existed because the
    # check was correct and red at the same time — node:22-alpine's packages
    # trailed its own Alpine release (#646), and #648 patched that at build
    # time instead of fixing the base. Both of those are gone with the pin.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse a stale base image
        run: bash scripts/check-base-image-current.sh

  fast:
    name: Static and unit checks
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        env:
          ORBIT_TEST_COVERAGE: "true"
        run: bash scripts/test-backend.sh

      - name: Build production application
        if: >-
          ${{
            github.event_name == 'push' &&
            needs.changes.outputs.build == 'true'
          }}
        run: pnpm --filter orbit-web build

      # The render proof, run here as well as inside the image (#735). The
      # container build is the authoritative gate, but it is minutes away;
      # this fails in seconds when a packaging change breaks previews.
      - name: Prove document previews can still be rendered
        if: >-
          ${{
            github.event_name == 'push' &&
            needs.changes.outputs.build == 'true'
          }}
        run: pnpm test:web-pdfjs

      - name: Upload diagnostic coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-coverage
          path: coverage/
          retention-days: 14

  supply_chain_source:
    name: Source dependency and secret policy
    needs:
      - changes
    # Runs on a push (existing), an on-demand dispatch, a pull request
    # that opted in with the `ci: acceptance` label, or one touching a
    # system-risk path (#617). None of these new paths publishes anything;
    # only the push branch/ref restriction above decides that, and this
    # job stays read-only regardless.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance') ||
        needs.changes.outputs.system == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate supply-chain policy
        run: node scripts/supply-chain-policy.mjs validate

      # A pin lives in two places: the file that uses it and the policy that
      # records it. Dependabot can rewrite the first and cannot see the second,
      # so its pull requests arrive with the two disagreeing. `--offline` runs
      # only that comparison, so it costs no registry call and runs on every
      # pull request that reaches this job. Remedy is one command:
      # `node scripts/sidecar-pins.mjs sync` (#771).
      - name: Refuse a pin that drifted between compose and policy
        run: node scripts/sidecar-pins.mjs check --offline

      - name: Scan repository dependencies and secrets
        run: |
          mkdir -p .orbit-supply-chain "${RUNNER_TEMP}/trivy-cache"
          bash scripts/trivy-db-retry.sh docker run --rm \
            --env TRIVY_DB_REPOSITORY \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" fs \
            --scanners vuln,secret \
            --format json \
            --output /workspace/.orbit-supply-chain/source-raw.json \
            /workspace
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json

      - name: Enforce source supply-chain policy
        run: |
          set +e
          node scripts/supply-chain-policy.mjs source \
            --input .orbit-supply-chain/source-raw.json \
            --output .orbit-supply-chain/source-evidence.json
          policy_status=$?
          set -e
          rm -f .orbit-supply-chain/source-raw.json
          exit "${policy_status}"

      - name: Upload bounded source supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-supply-chain-source
          path: |
            .orbit-supply-chain/source-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

  # Scans every image pinned in `.github/supply-chain-policy.json`, not just
  # the one Orbit builds: an operator's deployment runs the sidecars too, and
  # Postgres shipped the OpenSSL flaw #646 fixed in Orbit's own image with
  # nothing in CI able to say so (#647).
  #
  # `--ignore-unfixed` because these are upstream images Orbit pulls rather
  # than builds: a fixable HIGH is actionable (re-pin), an unfixable one is
  # not, and a check that is red whatever anyone does is worse than no check.
  #
  # Reporting-only for now: every pinned sidecar currently has fixable HIGH
  # findings and no clean upstream digest exists to re-pin to — the evidence
  # is on #647. When the pins scan clean, delete `continue-on-error` so a
  # newly published advisory against a pinned digest fails the job.
  sidecar_images:
    name: Pinned sidecar image scan
    needs:
      - changes
    # Same reach as the source policy job: a push, an on-demand dispatch, an
    # opted-in pull request, or one touching a system-risk path. Nothing here
    # publishes; the job only reads registries.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance') ||
        needs.changes.outputs.system == 'true'
      }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate supply-chain policy
        run: node scripts/supply-chain-policy.mjs validate

      - name: Scan every pinned image
        run: |
          mkdir -p .orbit-supply-chain/sidecar-scans "${RUNNER_TEMP}/trivy-cache"
          node scripts/sidecar-image-evidence.mjs --list-references \
            --policy .github/supply-chain-policy.json \
            | while read -r slug reference; do
                echo "scanning ${reference}"
                bash scripts/trivy-db-retry.sh docker run --rm \
                  --env TRIVY_DB_REPOSITORY \
                  --volume "${GITHUB_WORKSPACE}:/workspace" \
                  --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
                  "${TRIVY_IMAGE}" image \
                  --scanners vuln \
                  --ignore-unfixed \
                  --format json \
                  --output "/workspace/.orbit-supply-chain/sidecar-scans/${slug}.json" \
                  "${reference}"
              done
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json

      - name: Enforce sidecar image policy
        run: |
          set +e
          node scripts/sidecar-image-evidence.mjs evaluate \
            --policy .github/supply-chain-policy.json \
            --scans .orbit-supply-chain/sidecar-scans \
            --output .orbit-supply-chain/sidecar-evidence.json \
            --revision "${GITHUB_SHA}"
          policy_status=$?
          set -e
          rm -rf .orbit-supply-chain/sidecar-scans
          exit "${policy_status}"

      - name: Upload sidecar supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-supply-chain-sidecars
          path: |
            .orbit-supply-chain/sidecar-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

  # The only automatic check the v19 presentation layer has (#620). Its 28
  # Svelte components are not type-checked at zero, not linted, and until this
  # job existed the 17 committed baselines were compared by hand or not at all.
  fidelity:
    name: v19 visual fidelity
    needs:
      - changes
      - fast
    # Skipped rather than filtered out, so the check reports a terminal result.
    # Deliberately NOT behind the `ci: acceptance` label that gates the jobs
    # below: a label nobody remembers is how #613 reached `dev`, and a visual
    # regression that is only caught on the preview push is caught too late.
    # A pull request that moves web/ pays for this; one that does not never
    # sees it.
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Pinned by digest to the image the baselines were proven against: all 17
    # reproduced at *zero* differing pixels inside it, against a budget of
    # 0.1%. Any other browser build is a different rasteriser, and then the
    # comparison stops measuring the design and starts measuring the runner.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image ships its own Node and the browser build that matches it, so
      # neither is installed here: replacing either would defeat the pinning
      # above. Only pnpm is missing.
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # web/tsconfig.json extends ./.svelte-kit/tsconfig.json, which
      # `svelte-kit sync` generates and which is gitignored -- so it exists on
      # any machine that has built once, and on no fresh checkout. Playwright
      # reads that tsconfig while LOADING its config, before the webServer
      # command it would have been built by ever runs, so without this the job
      # dies in 45s on "Failed to load tsconfig file".
      - name: Generate the SvelteKit type scaffolding
        run: pnpm --filter orbit-web exec svelte-kit sync

      # playwright.config.js stands up both servers itself: the adapter-node
      # build of the app, and the static host for the ratified mockups. CI is
      # set by Actions, so neither reuses a stray server.
      - name: Run the v19 fidelity gate
        run: pnpm --filter orbit-web fidelity

      # The spec writes expected/actual/diff triplets on failure only (#448).
      # Without them a red tick says a screen changed and not how.
      - name: Upload fidelity diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-fidelity-diffs
          path: web/test-results/fidelity/
          retention-days: 14

  integration:
    name: PostgreSQL service and API integration
    needs:
      - changes
      - fast
    # Skipped rather than filtered out, so the required check still reports.
    # The changed-paths filter stays in force for every event that reaches
    # here, including the new dispatch and label paths — it is a cost
    # filter, not a publication gate.
    if: >-
      ${{
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'ci: acceptance') ||
          needs.changes.outputs.system == 'true'
        ) &&
        needs.changes.outputs.integration == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated PostgreSQL integration tests
        run: |
          set +e
          pnpm test:integration &
          first_pid=$!
          pnpm test:integration &
          second_pid=$!
          wait "$first_pid"
          first_status=$?
          wait "$second_pid"
          second_status=$?
          if (( first_status != 0 || second_status != 0 )); then
            exit 1
          fi

  smoke:
    name: Compose smoke test
    needs:
      - changes
      - fast
      - supply_chain_source
      - integration
      - base_image
    # Retain the existing check identity, but defer the expensive exact-image
    # path until the preview push, except when evidence was explicitly
    # requested on demand or via the acceptance label. `publish_preview` below
    # reuses these same steps for the push-triggered run, so this job and that
    # one never both run for the same event: this job is gated to non-push
    # events only.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance') ||
        needs.changes.outputs.system == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUBLICATION_CHANNEL: ci

    # Reuse one validation sequence while keeping PR and publication token
    # permissions isolated at the job boundary.
    steps: &container_validation_steps
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stable Git tags are the version calculator's durable baseline.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test configuration
        run: bash scripts/ci/create-test-configuration.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Calculate release-train version
        id: version
        run: |
          channel=preview
          if [[ "${GITHUB_REF_NAME}" == hotfix/* ]]; then
            channel=hotfix
          fi
          version="$(node scripts/calculate-version.mjs --channel "${channel}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate preview-lane preflight
        run: |
          channel=preview
          if [[ "${GITHUB_REF_NAME}" == hotfix/* ]]; then
            channel=hotfix
          fi
          bash scripts/preview-lane-preflight.sh --channel "${channel}"

      - name: Generate exact image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=preview
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Everything in your orbit, on track.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.github.tomlawesome.orbit.release-stage=${{ env.PUBLICATION_CHANNEL }}
            io.github.tomlawesome.orbit.source-branch=${{ github.ref_name }}

      - name: Build and load final image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORBIT_VERSION=${{ steps.version.outputs.version }}
            ORBIT_REVISION=${{ steps.version.outputs.revision }}
            ORBIT_CHANNEL=${{ env.PUBLICATION_CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record exact local image identity
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          ORBIT_REVISION: ${{ github.sha }}
        run: bash scripts/ci/verify-image-identity.sh

      - name: Install acceptance exemplar
        env:
          ORBIT_ACCEPTANCE_IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/test-install-acceptance.sh --lifecycle --red

      - name: Scan exact local image
        env:
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          ORBIT_REVISION: ${{ github.sha }}
        run: bash scripts/ci/scan-image.sh

      - name: Upload exact-image supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-supply-chain-image-${{ env.PUBLICATION_CHANNEL }}
          path: |
            .orbit-supply-chain/image-vulnerabilities.json
            .orbit-supply-chain/image.spdx.json
            .orbit-supply-chain/image-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the deployment asset set without a source tree
        run: bash scripts/ci/validate-deployment-assets.sh

      - name: Validate Compose configuration
        env:
          ORBIT_VERSION: ${{ steps.version.outputs.version }}
          ORBIT_REVISION: ${{ steps.version.outputs.revision }}
          ORBIT_CHANNEL: ${{ env.PUBLICATION_CHANNEL }}
        run: bash scripts/ci/validate-compose.sh

      - name: Detect exact processor validation scope
        id: processor_scope
        run: bash scripts/ci/detect-processor-scope.sh

      - name: Verify exact hostile-document processor
        if: steps.processor_scope.outputs.required == 'true'
        env:
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/ci/verify-tika-processor.sh

      - name: Build disposable OIDC acceptance provider
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.acceptance.yml build orbit-oidc

      - name: Start application and database
        run: bash scripts/ci/start-acceptance-stack.sh

      - name: Verify health endpoint
        run: bash scripts/ci/verify-health-endpoint.sh

      - name: Verify startup banner and immutable identity
        env:
          TESTED_IMAGE_VERSION: ${{ steps.image.outputs.version }}
          ORBIT_REVISION: ${{ github.sha }}
        run: bash scripts/ci/verify-startup-banner.sh

      - name: Verify non-root runtime and private secrets
        run: bash scripts/ci/verify-nonroot-runtime.sh

      - name: Verify malware scanner detection
        run: bash scripts/test-malware-scanner.sh

      - name: Verify backup and restore round trip
        run: bash scripts/test-backup-restore.sh

      - name: Verify signed-out privacy boundary and favicon
        run: bash scripts/ci/verify-privacy-boundary.sh

      - name: Run browser and accessibility checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ORBIT_ACCEPTANCE_OIDC: "true"
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          bash scripts/test-frontend.sh

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show service diagnostics
        if: failure()
        run: bash scripts/ci/show-stack-diagnostics.sh

      - name: Stop smoke-test services
        if: always()
        run: bash scripts/ci/stop-acceptance-stack.sh

      # The disposable registry bound to a Compose project named "orbit" must
      # never collide with the smoke stack above, so this runs only after it is
      # fully torn down.
      - name: Start disposable installer registry
        id: installer_registry
        env:
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          ORBIT_RUN_ID: ${{ github.run_id }}
          ORBIT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/ci/start-installer-registry.sh

      - name: Prepare empty installer target and Git guard
        id: installer_target
        run: bash scripts/ci/prepare-installer-target.sh

      - name: Verify empty target refuses unattended install
        id: installer_refusal
        working-directory: ${{ steps.installer_target.outputs.install_target }}
        env:
          ORBIT_REGISTRY: 127.0.0.1:5000
          ORBIT_REPOSITORY: ${{ env.IMAGE_NAME }}
          ORBIT_CHANNEL: ${{ steps.installer_registry.outputs.channel }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
          GIT_MARKER: ${{ steps.installer_target.outputs.git_marker }}
          ORBIT_RUN_ID: ${{ github.run_id }}
          ORBIT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/verify-installer-refusal.sh"

      - name: Pre-provision unattended installer target
        env:
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
        run: bash scripts/ci/provision-installer-target.sh

      - name: Run installer against the pre-provisioned disposable registry
        working-directory: ${{ steps.installer_target.outputs.install_target }}
        env:
          ORBIT_REGISTRY: 127.0.0.1:5000
          ORBIT_REPOSITORY: ${{ env.IMAGE_NAME }}
          ORBIT_CHANNEL: ${{ steps.installer_registry.outputs.channel }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-installer.sh"

      - name: Verify exact-image installer evidence
        env:
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
          GIT_MARKER: ${{ steps.installer_target.outputs.git_marker }}
          ORBIT_REVISION: ${{ github.sha }}
        run: bash scripts/ci/verify-installed-image.sh

      - name: Clean up installer validation resources
        if: always()
        env:
          REGISTRY_NAME: ${{ steps.installer_registry.outputs.registry_name }}
          REGISTRY_ID: ${{ steps.installer_registry.outputs.registry_id }}
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
          REFUSAL_OUTPUT: ${{ steps.installer_refusal.outputs.refusal_output }}
        run: bash scripts/ci/clean-up-installer.sh


  repair_journeys:
    name: Repair journey acceptance
    needs:
      - changes
      - fast
      - supply_chain_source
      - integration
    # Gated exactly as the Compose smoke test is, but with a timeout of its
    # own: live repair evidence should not fail because install acceptance ran
    # long (#532).
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance') ||
        needs.changes.outputs.system == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and load the image under repair
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: orbit-repair-journeys:ci
          build-args: |
            ORBIT_VERSION=v0.0.0
            ORBIT_REVISION=${{ github.sha }}
            ORBIT_CHANNEL=ci
          # Read the smoke job's layer cache; never write a competing one.
          cache-from: type=gha

      - name: Prove the repair journeys against a live deployment
        env:
          ORBIT_REPAIR_JOURNEYS_IMAGE: orbit-repair-journeys:ci
        run: bash scripts/test-repair-journeys.sh

  verify_preview:
    name: Verify tested preview for stable merge
    needs:
      - fast
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Check out proposed stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview identity and source
        id: preview
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          channel=preview
          if [[ "${SOURCE_BRANCH}" == hotfix/* ]]; then
            channel=hotfix
          elif [[ "${SOURCE_BRANCH}" != "preview" ]]; then
            printf 'Stable pull requests must come from preview or a hotfix branch.\n' >&2
            exit 1
          fi

          expected_version="$(node scripts/calculate-version.mjs --channel "${channel}")"
          image="${REGISTRY}/${IMAGE_NAME,,}"
          digest="$(
            docker buildx imagetools inspect "${image}:preview" |
              awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'The preview tag did not resolve to an immutable digest.\n' >&2
            exit 1
          }
          docker pull "${image}@${digest}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${digest}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}@${digest}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image}@${digest}")"
          source_branch="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.source-branch" }}' "${image}@${digest}")"
          embedded_version="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/VERSION)"
          embedded_revision="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/REVISION)"
          embedded_channel="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/CHANNEL)"
          reported_version="$(docker run --rm "${image}@${digest}" --version)"

          [[ "${version}" == "${expected_version}" && "${embedded_version}" == "${version}" ]] || {
            printf 'Preview version does not match the calculated release train.\n' >&2
            exit 1
          }
          [[ "${revision}" == "${embedded_revision}" ]] || {
            printf 'Preview revision label and embedded identity differ.\n' >&2
            exit 1
          }
          [[ "${embedded_channel}" == "${release_stage}" ]] || {
            printf 'Preview channel label and embedded identity differ.\n' >&2
            exit 1
          }
          [[ "${reported_version}" == "Orbit ${version}" ]] || {
            printf 'Preview --version output does not match its embedded identity.\n' >&2
            exit 1
          }

          ORBIT_PROMOTION_PHASE=merge \
          ORBIT_PREVIEW_DIGEST="${digest}" \
          ORBIT_STABLE_VERSION="${version}" \
          ORBIT_PREVIEW_STAGE="${release_stage}" \
          ORBIT_PREVIEW_REVISION="${revision}" \
          ORBIT_PREVIEW_SOURCE_BRANCH="${source_branch}" \
          ORBIT_EXPECTED_PREVIEW_REVISION="${EXPECTED_REVISION}" \
            node scripts/stable-promotion-policy.mjs
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify preview attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.preview.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          gh attestation verify "${image_reference}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 >/dev/null

      - name: Record stable merge evidence
        run: |
          {
            printf '## Orbit preview verified for stable merge\n\n'
            printf -- '- Version: `%s`\n' "${{ steps.preview.outputs.version }}"
            printf -- '- Digest: `%s`\n' "${{ steps.preview.outputs.digest }}"
            printf -- '- Source revision: `%s`\n' "${{ github.event.pull_request.head.sha }}"
            printf '\nNo container rebuild occurred.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The name survives from when this job pushed to GHCR. Since the mirror flip
  # (#801 step 5) it validates the preview push exactly as `smoke` validates a
  # pull request -- same steps, `ci` channel, read-only token -- and publishes
  # nothing: publish-from-gitlab.yml copies the digest GitLab tested. Two
  # publishers racing for the `preview` tag with different digests is what this
  # prevents.
  publish_preview:
    name: Validate preview push (advisory; GitLab publishes)
    needs:
      - fast
      - supply_chain_source
      - integration
      - base_image
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/preview' ||
          startsWith(github.ref, 'refs/heads/hotfix/')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUBLICATION_CHANNEL: ci
    steps: *container_validation_steps
