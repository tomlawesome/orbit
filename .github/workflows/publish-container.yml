name: Validate Orbit and publish candidates

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      include_arm64:
        description: Include ARM64 in this release candidate
        required: false
        default: false
        type: boolean

concurrency:
  group: orbit-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  fast:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        run: bash scripts/test-backend.sh

  smoke:
    name: Compose smoke test
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test configuration
        run: |
          bash scripts/configure.sh
          sed --in-place 's/^OIDC_CLIENT_ID=.*/OIDC_CLIENT_ID=orbit-smoke/' .env-orbit
          sed --in-place 's/^OIDC_CLIENT_SECRET=.*/OIDC_CLIENT_SECRET=orbit-smoke-only-secret/' .env-orbit

      - name: Validate Compose configuration
        run: docker compose --env-file .env-orbit config --quiet

      - name: Build application image
        run: bash scripts/build-container.sh

      - name: Start application and database
        run: docker compose --env-file .env-orbit up --detach --no-build --wait --wait-timeout 180

      - name: Verify health endpoint
        run: |
          response="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          jq --exit-status '.status == "ok" and .service == "orbit"' <<< "${response}"

      - name: Verify non-root runtime and private secrets
        run: |
          runtime_uid="$(docker compose --env-file .env-orbit exec -T orbit-app \
            sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "${runtime_uid}" = "1001"
          docker compose --env-file .env-orbit exec -T orbit-app sh -c '
            for secret in /run/orbit-secrets/*; do
              test -f "${secret}"
              test "$(stat -c %u "${secret}")" = "1001"
              test "$(stat -c %a "${secret}")" = "400"
            done
          '

      - name: Verify malware scanner detection
        run: bash scripts/test-malware-scanner.sh

      - name: Verify backup and restore round trip
        run: bash scripts/test-backup-restore.sh

      - name: Verify signed-out privacy boundary and favicon
        run: |
          status="$(curl --silent --output /tmp/orbit-workspace.json --write-out '%{http_code}' http://127.0.0.1:3000/api/workspace)"
          test "${status}" = "401"
          curl --fail --silent --show-error --output /tmp/orbit-icon.svg http://127.0.0.1:3000/icon.svg
          grep --quiet '<svg' /tmp/orbit-icon.svg

      - name: Run browser and accessibility checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          bash scripts/test-frontend.sh

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose --env-file .env-orbit ps
          docker compose --env-file .env-orbit logs --no-color
          app_container="$(docker compose --env-file .env-orbit ps --quiet orbit-app)"
          if [[ -n "${app_container}" ]]; then
            docker inspect --format='{{json .State.Health}}' "${app_container}"
          fi

      - name: Stop smoke-test services
        if: always()
        run: docker compose --env-file .env-orbit down --volumes --remove-orphans

  candidate:
    name: Publish release candidate
    needs: smoke
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.include_arm64
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=rc-{{date 'YYYY.MM.DD' tz='Europe/London'}}.${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Everything in your orbit, on track.

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_arm64) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate
        env:
          CANDIDATE_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Orbit release candidate\n\n'
            printf -- '- Tag: `%s`\n' "${CANDIDATE_TAGS}"
            printf -- '- Digest: `%s`\n' "${CANDIDATE_DIGEST}"
            printf -- '- Source revision: `%s`\n' "${GITHUB_SHA}"
            printf '\nDeploy and test this immutable digest before merging the release branch into `main`.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  development:
    name: Publish development image
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable development image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Orbit development build

      - name: Record development image
        run: |
          printf 'Development image: `%s:dev-%s`\n' "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
