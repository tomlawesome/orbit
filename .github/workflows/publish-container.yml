name: Validate Orbit and publish previews

on:
  pull_request:
    # `labeled` is required so applying `ci: acceptance` starts a run by
    # itself; the default types alone only fire on a new commit or open.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - dev
      - preview
  push:
    branches:
      - preview
      - "hotfix/**"
  workflow_dispatch: {}

concurrency:
  group: orbit-container-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel only a superseded pull-request commit. A push must never cancel the
  # validation of an earlier merge: the delivery model requires trusted evidence
  # for that exact merge SHA, and a cancelled run leaves it permanently without.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy@sha256:c6e969c5662a546ad5de4a73c2a6b7a7c627f86d916903e175aa623af5b97ada

jobs:
  # Selects the cheapest pull-request lane that still exercises every changed
  # boundary: fast, real PostgreSQL integration, or exact-image system tests.
  #
  # Classification is fail-safe: an unknown path, unreadable comparison, changed
  # production dependency graph, workflow/deployment boundary, and every push
  # event selects the broad system lane. Gates remain at job level rather than
  # using workflow path filters, because required skipped jobs report a terminal
  # result instead of leaving a pull request pending forever.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      build: ${{ steps.classify.outputs.build }}
      integration: ${{ steps.classify.outputs.integration }}
      system: ${{ steps.classify.outputs.system }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The classifier uses pnpm's lockfile-only graph reader. It never installs
      # dependencies or executes package lifecycle scripts.
      - name: Set up pnpm graph reader
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Classify changed paths
        id: classify
        env:
          ORBIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORBIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-changed-paths.mjs

  fast:
    name: Static and unit checks
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        env:
          ORBIT_TEST_COVERAGE: "true"
        run: bash scripts/test-backend.sh

      - name: Build production application
        if: >-
          ${{
            github.event_name == 'push' &&
            needs.changes.outputs.build == 'true'
          }}
        run: pnpm build

      - name: Upload diagnostic coverage
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-coverage
          path: coverage/
          retention-days: 14

  supply_chain_source:
    name: Source dependency and secret policy
    # Runs on a push (existing), an on-demand dispatch, or a pull request
    # that opted in with the `ci: acceptance` label. Neither new path
    # publishes anything; only the push branch/ref restriction above
    # decides that, and this job stays read-only regardless.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate supply-chain policy
        run: node scripts/supply-chain-policy.mjs validate

      - name: Scan repository dependencies and secrets
        run: |
          mkdir -p .orbit-supply-chain "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" fs \
            --scanners vuln,secret \
            --format json \
            --output /workspace/.orbit-supply-chain/source-raw.json \
            /workspace
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json

      - name: Enforce source supply-chain policy
        run: |
          set +e
          node scripts/supply-chain-policy.mjs source \
            --input .orbit-supply-chain/source-raw.json \
            --output .orbit-supply-chain/source-evidence.json
          policy_status=$?
          set -e
          rm -f .orbit-supply-chain/source-raw.json
          exit "${policy_status}"

      - name: Upload bounded source supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-source
          path: |
            .orbit-supply-chain/source-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: PostgreSQL service and API integration
    needs:
      - changes
      - fast
    # Skipped rather than filtered out, so the required check still reports.
    # The changed-paths filter stays in force for every event that reaches
    # here, including the new dispatch and label paths — it is a cost
    # filter, not a publication gate.
    if: >-
      ${{
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'ci: acceptance')
        ) &&
        needs.changes.outputs.integration == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated PostgreSQL integration tests
        run: |
          set +e
          pnpm test:integration &
          first_pid=$!
          pnpm test:integration &
          second_pid=$!
          wait "$first_pid"
          first_status=$?
          wait "$second_pid"
          second_status=$?
          if (( first_status != 0 || second_status != 0 )); then
            exit 1
          fi

  smoke:
    name: Compose smoke test
    needs:
      - changes
      - fast
      - supply_chain_source
      - integration
    # Retain the existing check identity for branch protection, but defer the
    # expensive exact-image path until the protected preview merge, except when
    # evidence was explicitly requested on demand or via the acceptance label.
    # `publish_preview` below reuses these same steps for the one push-triggered
    # run that actually publishes, so this job and that one never both run for
    # the same event: this job is gated to non-push events only.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ci: acceptance')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUBLICATION_CHANNEL: ci

    # Reuse one validation sequence while keeping PR and publication token
    # permissions isolated at the job boundary.
    steps: &container_validation_steps
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Stable Git tags are the version calculator's durable baseline.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test configuration
        run: |
          bash scripts/configure.sh
          # The GreenMail sidecar's imaps listener and the app's trust anchor are
          # bind-mounted from these two files. A missing source is silently
          # created as a directory, which surfaces 16 minutes later as a mail
          # poll timeout rather than as a certificate error, so assert them.
          bash scripts/dev-greenmail-cert.sh
          for required in .orbit-secrets/greenmail.p12 .orbit-secrets/greenmail-ca.pem; do
            [[ -f "${required}" ]] || { echo "missing GreenMail TLS material: ${required}" >&2; exit 1; }
          done
          openssl rand -hex 32 > .orbit-secrets/smtp-password
          openssl rand -hex 32 > .orbit-secrets/imap-password
          openssl rand -hex 32 > .orbit-secrets/imap-alias-current-secret
          openssl rand -hex 32 > .orbit-secrets/imap-alias-previous-secret
          chmod 600 .orbit-secrets/smtp-password .orbit-secrets/imap-password \
            .orbit-secrets/imap-alias-current-secret \
            .orbit-secrets/imap-alias-previous-secret
          # Ephemeral fixture overrides are appended deliberately: dotenv uses
          # the final assignment, so this remains valid whether an operator
          # setting is active, commented, or omitted from the example file.
          {
            printf '%s\n' \
              'SMTP_HOST=smtp.example.invalid' \
              'SMTP_USER=orbit@example.invalid' \
              'IMAP_HOST=imap.example.invalid' \
              'IMAP_USER=orbit@example.invalid' \
              'IMAP_TLS_SERVER_NAME=imap.example.invalid' \
              'IMAP_RECIPIENT_DOMAIN=ingest.example.invalid' \
              'IMAP_ENABLED=false' \
              'OIDC_CLIENT_ID=orbit-smoke' \
              'OIDC_CLIENT_SECRET=orbit-smoke-only-secret'
          } >> .env-orbit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Calculate release-train version
        id: version
        run: |
          channel=preview
          if [[ "${GITHUB_REF_NAME}" == hotfix/* ]]; then
            channel=hotfix
          fi
          version="$(node scripts/calculate-version.mjs --channel "${channel}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate preview-lane preflight
        run: |
          channel=preview
          if [[ "${GITHUB_REF_NAME}" == hotfix/* ]]; then
            channel=hotfix
          fi
          bash scripts/preview-lane-preflight.sh --channel "${channel}"

      - name: Generate exact image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=preview
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Everything in your orbit, on track.
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.github.tomlawesome.orbit.release-stage=${{ env.PUBLICATION_CHANNEL }}
            io.github.tomlawesome.orbit.source-branch=${{ github.ref_name }}

      - name: Build and load final image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORBIT_VERSION=${{ steps.version.outputs.version }}
            ORBIT_REVISION=${{ steps.version.outputs.revision }}
            ORBIT_CHANNEL=${{ env.PUBLICATION_CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record exact local image identity
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t image_tags < <(printf '%s\n' "${IMAGE_TAGS}" | sed '/^$/d')
          [[ "${#image_tags[@]}" -eq 1 ]] || {
            printf 'Expected exactly one image tag, received %s.\n' "${#image_tags[@]}" >&2
            exit 1
          }
          image_tag="${image_tags[0]}"
          image_id="$(docker image inspect --format '{{.Id}}' "${image_tag}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_tag}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image_tag}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image_tag}")"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Built image has no valid configuration identity.\n' >&2
            exit 1
          }
          [[ "${revision}" == "${GITHUB_SHA}" ]] || {
            printf 'Built image revision %s does not match workflow revision %s.\n' "${revision}" "${GITHUB_SHA}" >&2
            exit 1
          }
          [[ "${version}" == "${{ steps.version.outputs.version }}" ]] || {
            printf 'Built image version %s does not match calculated version %s.\n' \
              "${version}" "${{ steps.version.outputs.version }}" >&2
            exit 1
          }
          [[ "${release_stage}" == "${PUBLICATION_CHANNEL}" ]] || {
            printf 'Built image stage %s does not match channel %s.\n' "${release_stage}" "${PUBLICATION_CHANNEL}" >&2
            exit 1
          }
          embedded_version="$(docker run --rm --entrypoint cat "${image_tag}" /opt/orbit/VERSION)"
          embedded_revision="$(docker run --rm --entrypoint cat "${image_tag}" /opt/orbit/REVISION)"
          embedded_channel="$(docker run --rm --entrypoint cat "${image_tag}" /opt/orbit/CHANNEL)"
          [[ "${embedded_version}" == "${version}" ]] || {
            printf 'Embedded version does not match the image version label.\n' >&2
            exit 1
          }
          [[ "${embedded_revision}" == "${revision}" ]] || {
            printf 'Embedded revision does not match the image revision label.\n' >&2
            exit 1
          }
          [[ "${embedded_channel}" == "${release_stage}" ]] || {
            printf 'Embedded channel does not match the image release-stage label.\n' >&2
            exit 1
          }
          reported_version="$(docker run --rm "${image_tag}" --version)"
          [[ "${reported_version}" == "Orbit ${version}" ]] || {
            printf 'Container version command did not report the embedded version.\n' >&2
            exit 1
          }
          {
            printf 'id=%s\n' "${image_id}"
            printf 'tag=%s\n' "${image_tag}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"
          printf 'ORBIT_IMAGE=%s\n' "${image_tag}" >> "${GITHUB_ENV}"

      - name: Install acceptance exemplar
        env:
          ORBIT_ACCEPTANCE_IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/test-install-acceptance.sh --lifecycle --red

      - name: Scan exact local image
        env:
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p .orbit-supply-chain "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --format json \
            --output /workspace/.orbit-supply-chain/image-vulnerabilities.json \
            "${TESTED_IMAGE_TAG}"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --format spdx-json \
            --output /workspace/.orbit-supply-chain/image.spdx.json \
            "${TESTED_IMAGE_TAG}"
          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json \
            > .orbit-supply-chain/trivy-version.json
          node scripts/supply-chain-policy.mjs image \
            --input .orbit-supply-chain/image-vulnerabilities.json \
            --sbom .orbit-supply-chain/image.spdx.json \
            --output .orbit-supply-chain/image-evidence.json \
            --expected-image-id "${TESTED_IMAGE_ID}" \
            --expected-tag "${TESTED_IMAGE_TAG}" \
            --revision "${GITHUB_SHA}"

      - name: Upload exact-image supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-image-${{ env.PUBLICATION_CHANNEL }}
          path: |
            .orbit-supply-chain/image-vulnerabilities.json
            .orbit-supply-chain/image.spdx.json
            .orbit-supply-chain/image-evidence.json
            .orbit-supply-chain/trivy-version.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the deployment asset set without a source tree
        run: |
          # Proves the base compose file describes a deployment truthfully: an
          # operator who fetched only deployment assets has no Dockerfile and no
          # source, so a build declaration there would describe something absent.
          deployment="$(mktemp -d)"
          cp docker-compose.yml docker-compose.mail.yml docker-compose.mail-alias-rotation.yml "${deployment}/"
          cp .env-orbit "${deployment}/"
          mkdir -p "${deployment}/config"
          cp config/tika-config.xml "${deployment}/config/"
          [[ ! -e "${deployment}/Dockerfile" ]] || {
            printf 'The deployment asset set must not contain a Dockerfile.\n' >&2
            exit 1
          }
          docker compose --project-directory "${deployment}" --env-file "${deployment}/.env-orbit" \
            -f "${deployment}/docker-compose.yml" config --quiet
          docker compose --project-directory "${deployment}" --env-file "${deployment}/.env-orbit" \
            -f "${deployment}/docker-compose.yml" -f "${deployment}/docker-compose.mail.yml" config --quiet
          rm -rf "${deployment}"

      - name: Validate Compose configuration
        env:
          ORBIT_VERSION: ${{ steps.version.outputs.version }}
          ORBIT_REVISION: ${{ steps.version.outputs.revision }}
          ORBIT_CHANNEL: ${{ env.PUBLICATION_CHANNEL }}
        run: |
          docker compose --env-file .env-orbit config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.acceptance.yml config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml config --quiet
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.mail-alias-rotation.yml config --quiet
          docker compose --env-file .env-orbit --profile processing --profile ai config --quiet

          # Optional services must be selectable by configuration alone, so
          # that an operator never needs a different compose command. This
          # proves Compose honours COMPOSE_PROFILES from the environment file:
          # without it the optional services are absent, with it they appear.
          selection_env="$(mktemp)"
          cp .env-orbit "${selection_env}"
          docker compose --env-file "${selection_env}" config --format json \
            | jq --exit-status '(.services | has("orbit-ollama") or has("orbit-tika")) | not' > /dev/null
          printf 'COMPOSE_PROFILES=processing,ai\n' >> "${selection_env}"
          docker compose --env-file "${selection_env}" config --format json \
            | jq --exit-status '.services | has("orbit-ollama") and has("orbit-tika")' > /dev/null
          rm -f "${selection_env}"

          processing_config="$(docker compose --env-file .env-orbit \
            --profile processing config --format json)"
          jq --exit-status '
            .networks["orbit-document-processing"].internal == true
            and (.services["orbit-tika"].networks | keys == ["orbit-document-processing"])
            and .services["orbit-tika"].user == "35002:35002"
            and .services["orbit-tika"].read_only == true
            and .services["orbit-tika"].command == ["-c", "/etc/orbit/tika-config.xml"]
            and (.services["orbit-tika"].cap_drop == ["ALL"])
            and (.services["orbit-tika"].configs | any(.source == "orbit-tika-config" and .target == "/etc/orbit/tika-config.xml"))
            and ((.services["orbit-tika"].volumes // []) | length == 0)
            and ((.services["orbit-tika"].secrets // []) | length == 0)
            and (.services["orbit-app"].networks | has("default") and has("orbit-document-processing"))
            and (.services["orbit-db"].networks | has("default") and (has("orbit-document-processing") | not))
            and (.services["orbit-clamav"].networks | keys == ["orbit-document-processing", "orbit-malware-signature-updates"])
            and ((.services["orbit-clamav"].networks | has("default")) | not)
          ' <<< "${processing_config}"

      - name: Detect exact processor validation scope
        id: processor_scope
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
             git diff --quiet HEAD^ HEAD -- \
               config/tika-config.xml \
               docker-compose.yml \
               src/server/document-drafts.ts \
               src/server/documents \
               src/server/item-document-inspection.ts \
               scripts/test-tika-processor.mjs \
               .github/workflows/publish-container.yml; then
            printf 'required=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'required=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify exact hostile-document processor
        if: steps.processor_scope.outputs.required == 'true'
        env:
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker compose --env-file .env-orbit --profile processing pull orbit-tika
          docker compose --env-file .env-orbit --profile processing up --detach orbit-tika
          tika_id="$(docker compose --env-file .env-orbit --profile processing ps --quiet orbit-tika)"
          test -n "${tika_id}"
          tika_user="$(docker inspect --format '{{.Config.User}}' "${tika_id}")"
          tika_read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${tika_id}")"
          tika_network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "${tika_id}")"
          test "${tika_user}" = "35002:35002"
          test "${tika_read_only}" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "${tika_id}")" = '["ALL"]'
          test "$(docker network inspect --format '{{.Internal}}' "${tika_network}")" = "true"
          docker inspect "${tika_id}" | jq --exit-status '
            .[0].Mounts
            | length >= 1
            and any(.Destination == "/etc/orbit/tika-config.xml" and .RW == false)
            and all(.Destination == "/etc/orbit/tika-config.xml" or .Destination == "/tmp")
          '
          docker compose --env-file .env-orbit --profile processing exec -T orbit-tika \
            sh -c 'test -r /etc/orbit/tika-config.xml && test -w /tmp'
          tika_uid="$(docker compose --env-file .env-orbit --profile processing exec -T orbit-tika \
            sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "${tika_uid}" = "35002"
          docker run --rm \
            --network "${tika_network}" \
            --entrypoint node \
            --env TIKA_TEST_URL=http://orbit-tika:9998 \
            --volume "${GITHUB_WORKSPACE}/scripts/test-tika-processor.mjs:/tmp/test-tika-processor.mjs:ro" \
            "${TESTED_IMAGE_TAG}" \
            /tmp/test-tika-processor.mjs

      - name: Build disposable OIDC acceptance provider
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.acceptance.yml build orbit-oidc

      - name: Start application and database
        run: docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml up --detach --no-build --wait --wait-timeout 180

      - name: Verify health endpoint
        run: |
          response="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          jq --exit-status '.status == "ready" and .service == "orbit"' <<< "${response}"

      - name: Verify startup banner and immutable identity
        run: |
          startup_logs="$(docker compose --env-file .env-orbit logs --no-color orbit-app)"
          startup_logs="$(sed -E 's/^[^|]*\| //' <<< "${startup_logs}")"
          banner_line='  ·      ·    ·    ██████╗  ██████╗  ██████╗  ██╗ ████████╗   ·      ·      ·'
          version="${{ steps.image.outputs.version }}"
          release_stage="${PUBLICATION_CHANNEL}"
          revision="${GITHUB_SHA}"
          identity_line="Orbit ${version} | channel=${release_stage} | revision=${revision}"
          banner_count="$(grep --fixed-strings --line-regexp --count "${banner_line}" <<< "${startup_logs}" || true)"
          identity_count="$(grep --fixed-strings --line-regexp --count "${identity_line}" <<< "${startup_logs}" || true)"
          [[ "${banner_count}" -eq 1 ]] || {
            printf 'Expected the Orbit startup banner once, found %s.\n' "${banner_count}" >&2
            exit 1
          }
          [[ "${identity_count}" -eq 1 ]] || {
            printf 'Expected the immutable startup identity once, found %s.\n' "${identity_count}" >&2
            exit 1
          }

      - name: Verify non-root runtime and private secrets
        run: |
          runtime_uid="$(docker compose --env-file .env-orbit exec -T orbit-app \
            sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "${runtime_uid}" = "1001"
          docker compose --env-file .env-orbit exec -T orbit-app sh -c '
            for secret in /run/orbit-secrets/*; do
              test -f "${secret}"
              test "$(stat -c %u "${secret}")" = "1001"
              test "$(stat -c %a "${secret}")" = "400"
            done
          '

      - name: Verify malware scanner detection
        run: bash scripts/test-malware-scanner.sh

      - name: Verify backup and restore round trip
        run: bash scripts/test-backup-restore.sh

      - name: Verify signed-out privacy boundary and favicon
        run: |
          status="$(curl --silent --output /tmp/orbit-workspace.json --write-out '%{http_code}' http://127.0.0.1:3000/api/workspace)"
          test "${status}" = "401"
          curl --fail --silent --show-error --output /tmp/orbit-icon.svg http://127.0.0.1:3000/icon.svg
          grep --quiet '<svg' /tmp/orbit-icon.svg

      - name: Run browser and accessibility checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ORBIT_ACCEPTANCE_OIDC: "true"
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          bash scripts/test-frontend.sh

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show service diagnostics
        if: failure()
        run: |
          export ORBIT_IMAGE="${ORBIT_IMAGE:-orbit-local:000000000000}"
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml ps
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml logs --no-color
          app_container="$(docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml ps --quiet orbit-app)"
          if [[ -n "${app_container}" ]]; then
            docker inspect --format='{{json .State.Health}}' "${app_container}"
          fi

      - name: Stop smoke-test services
        if: always()
        run: |
          export ORBIT_IMAGE="${ORBIT_IMAGE:-orbit-local:000000000000}"
          docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.mail.yml -f docker-compose.acceptance.yml --profile processing down --volumes --remove-orphans

      # Installer evidence must gate publication, and the disposable registry
      # bound to a Compose project named "orbit" must never collide with the
      # smoke stack above, so this runs only after it is fully torn down and
      # only before any GHCR login, push or attestation step.
      - name: Start disposable installer registry
        id: installer_registry
        env:
          TESTED_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          run_attempt="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry_name="orbit-installer-registry-${run_attempt}"
          channel="installer-${run_attempt}"
          printf 'registry_name=%s\n' "${registry_name}" >> "${GITHUB_OUTPUT}"
          printf 'channel=%s\n' "${channel}" >> "${GITHUB_OUTPUT}"

          source_id="$(docker image inspect --format '{{.Id}}' "${TESTED_IMAGE_TAG}")"
          [[ "${source_id}" == "${TESTED_IMAGE_ID}" ]] || {
            printf 'Source image identity %s does not match the tested identity %s.\n' "${source_id}" "${TESTED_IMAGE_ID}" >&2
            exit 1
          }

          # Bound to loopback only: this registry is disposable evidence, never a
          # publication target.
          registry_id="$(
            docker run --detach --name "${registry_name}" --publish 127.0.0.1:5000:5000 \
              registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          )"
          [[ "${registry_id}" =~ ^[0-9a-f]{64}$ ]] || {
            printf 'The disposable registry returned an invalid container identity.\n' >&2
            exit 1
          }
          printf 'registry_id=%s\n' "${registry_id}" >> "${GITHUB_OUTPUT}"

          ready=""
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5000/v2/; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ -n "${ready}" ]] || {
            printf 'The disposable local registry did not become ready.\n' >&2
            exit 1
          }

          # No rebuild: retag and push the exact image already scanned above,
          # then drop the local reference so the installer must resolve it
          # through the registry round trip.
          local_tag="127.0.0.1:5000/${IMAGE_NAME}:${channel}"
          docker tag "${TESTED_IMAGE_TAG}" "${local_tag}"
          docker push "${local_tag}" > /dev/null
          docker rmi "${local_tag}" > /dev/null

      - name: Prepare empty installer target and Git guard
        id: installer_target
        run: |
          install_target="$(mktemp -d "${RUNNER_TEMP}/orbit-installer-target.XXXXXX")"
          printf 'install_target=%s\n' "${install_target}" >> "${GITHUB_OUTPUT}"

          shopt -s nullglob dotglob
          entries=("${install_target}"/*)
          shopt -u nullglob dotglob
          [[ "${#entries[@]}" -eq 0 ]] || {
            printf 'Installer target %s is not empty.\n' "${install_target}" >&2
            exit 1
          }
          for marker in .git Dockerfile src package.json package-lock.json pnpm-lock.yaml yarn.lock; do
            [[ ! -e "${install_target}/${marker}" ]] || {
              printf 'Installer target unexpectedly contains %s before installation.\n' "${marker}" >&2
              exit 1
            }
          done

          # A guard executable proves the installer never shells out to git: it
          # only records that it was invoked and fails, so a real git call would
          # both leave evidence and abort the run.
          git_guard_dir="$(mktemp -d "${RUNNER_TEMP}/orbit-installer-git-guard.XXXXXX")"
          git_marker="${git_guard_dir}/git-was-invoked"
          printf 'git_guard_dir=%s\n' "${git_guard_dir}" >> "${GITHUB_OUTPUT}"
          printf 'git_marker=%s\n' "${git_marker}" >> "${GITHUB_OUTPUT}"
          {
            printf '#!/usr/bin/env bash\n'
            printf 'touch %s\n' "$(printf '%q' "${git_marker}")"
            printf 'exit 1\n'
          } > "${git_guard_dir}/git"
          chmod +x "${git_guard_dir}/git"

      - name: Verify empty target refuses unattended install
        id: installer_refusal
        working-directory: ${{ steps.installer_target.outputs.install_target }}
        env:
          ORBIT_REGISTRY: 127.0.0.1:5000
          ORBIT_REPOSITORY: ${{ env.IMAGE_NAME }}
          ORBIT_CHANNEL: ${{ steps.installer_registry.outputs.channel }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
          GIT_MARKER: ${{ steps.installer_target.outputs.git_marker }}
        run: |
          refusal_output="${RUNNER_TEMP}/orbit-installer-refusal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          printf 'refusal_output=%s\n' "${refusal_output}" >> "${GITHUB_OUTPUT}"
          set +e
          exec < /dev/null
          [[ ! -t 0 ]] || {
            printf 'The refusal check must not have a TTY on standard input.\n' >&2
            exit 1
          }
          PATH="${GIT_GUARD_DIR}:${PATH}" bash "${GITHUB_WORKSPACE}/scripts/install.sh" > "${refusal_output}" 2>&1
          installer_status=$?
          set -e
          [[ "${installer_status}" -ne 0 ]] || {
            printf 'An empty non-interactive target unexpectedly accepted installation.\n' >&2
            exit 1
          }
          grep --fixed-strings --line-regexp --quiet \
            'Orbit installer: configuration fields requiring attention: APP_URL OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_CALLBACK_URL.' \
            "${refusal_output}" || {
            printf 'The empty-target refusal did not report the fixed required fields.\n' >&2
            exit 1
          }
          grep --fixed-strings --line-regexp --quiet \
            'Orbit installer: Required configuration fields require attention; refusing to start Compose.' \
            "${refusal_output}" || {
            printf 'The empty-target refusal did not report the fixed Compose refusal.\n' >&2
            exit 1
          }
          if docker inspect orbit > /dev/null 2>&1; then
            printf 'The empty-target refusal started an Orbit application container.\n' >&2
            exit 1
          fi
          [[ ! -e "${GIT_MARKER}" ]] || {
            printf 'The empty-target refusal invoked git.\n' >&2
            exit 1
          }
          shopt -s nullglob dotglob
          entries=(*)
          shopt -u nullglob dotglob
          [[ "${#entries[@]}" -eq 0 ]] || {
            printf 'The empty-target refusal did not restore the target to empty.\n' >&2
            exit 1
          }

      - name: Pre-provision unattended installer target
        env:
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
        run: |
          install_target="${INSTALL_TARGET}"
          env_file="${install_target}/.env-orbit"
          secrets_directory="${install_target}/.orbit-secrets"
          [[ -d "${install_target}" && ! -L "${install_target}" ]] || {
            printf 'The installer target is missing or unsafe before provisioning.\n' >&2
            exit 1
          }
          shopt -s nullglob dotglob
          entries=("${install_target}"/*)
          shopt -u nullglob dotglob
          [[ "${#entries[@]}" -eq 0 ]] || {
            printf 'The installer target was not restored to empty before provisioning.\n' >&2
            exit 1
          }

          cp -- "${GITHUB_WORKSPACE}/.env-orbit.example" "${env_file}"
          chmod 600 "${env_file}"
          sed -i \
            -e 's|^APP_URL=.*$|APP_URL=https://orbit.install-test.invalid|' \
            -e 's|^OIDC_ISSUER=.*$|OIDC_ISSUER=https://accounts.google.com|' \
            -e 's|^OIDC_CLIENT_ID=.*$|OIDC_CLIENT_ID=orbit-install-test-client|' \
            -e 's|^OIDC_CLIENT_SECRET=.*$|OIDC_CLIENT_SECRET=|' \
            -e 's|^# OIDC_CLIENT_SECRET_FILE=.*$|OIDC_CLIENT_SECRET_FILE=/run/orbit-secrets/orbit-oidc-client-secret|' \
            -e 's|^OIDC_CALLBACK_URL=.*$|OIDC_CALLBACK_URL=https://orbit.install-test.invalid/api/auth/callback|' \
            "${env_file}"

          for expected_line in \
            'ORBIT_CONFIG_SCHEMA_VERSION=1' \
            'APP_URL=https://orbit.install-test.invalid' \
            'OIDC_ISSUER=https://accounts.google.com' \
            'OIDC_CLIENT_ID=orbit-install-test-client' \
            'OIDC_CLIENT_SECRET=' \
            'OIDC_CLIENT_SECRET_FILE=/run/orbit-secrets/orbit-oidc-client-secret' \
            'OIDC_CALLBACK_URL=https://orbit.install-test.invalid/api/auth/callback'; do
            grep --fixed-strings --line-regexp --quiet "${expected_line}" "${env_file}" || {
              printf 'The pre-provisioned environment file is missing a required bootstrap field.\n' >&2
              exit 1
            }
          done

          umask 077
          mkdir -- "${secrets_directory}"
          chmod 700 "${secrets_directory}"
          openssl rand -hex 32 > "${secrets_directory}/oidc-client-secret"
          chmod 600 "${secrets_directory}/oidc-client-secret"

          [[ -f "${env_file}" && ! -L "${env_file}" ]] || {
            printf 'The pre-provisioned environment file is not a regular non-symlink file.\n' >&2
            exit 1
          }
          [[ "$(stat -c '%a' -- "${env_file}")" == 600 ]] || {
            printf 'The pre-provisioned environment file is not mode 0600.\n' >&2
            exit 1
          }
          [[ -d "${secrets_directory}" && ! -L "${secrets_directory}" ]] || {
            printf 'The pre-provisioned secrets directory is not a real non-symlink directory.\n' >&2
            exit 1
          }
          [[ "$(stat -c '%a' -- "${secrets_directory}")" == 700 ]] || {
            printf 'The pre-provisioned secrets directory is not mode 0700.\n' >&2
            exit 1
          }
          secret_file="${secrets_directory}/oidc-client-secret"
          [[ -f "${secret_file}" && ! -L "${secret_file}" && -s "${secret_file}" ]] || {
            printf 'The pre-provisioned OIDC client secret file is missing or empty.\n' >&2
            exit 1
          }
          [[ "$(stat -c '%a' -- "${secret_file}")" == 600 ]] || {
            printf 'The pre-provisioned OIDC client secret file is not mode 0600.\n' >&2
            exit 1
          }

          shopt -s nullglob dotglob
          entries=("${install_target}"/*)
          shopt -u nullglob dotglob
          [[ "${#entries[@]}" -eq 2 ]] || {
            printf 'The pre-provisioned target does not contain exactly .env-orbit and .orbit-secrets.\n' >&2
            exit 1
          }
          for marker in .git Dockerfile src package.json package-lock.json pnpm-lock.yaml yarn.lock; do
            [[ ! -e "${install_target}/${marker}" ]] || {
              printf 'The pre-provisioned target unexpectedly contains %s.\n' "${marker}" >&2
              exit 1
            }
          done

      - name: Run installer against the pre-provisioned disposable registry
        working-directory: ${{ steps.installer_target.outputs.install_target }}
        env:
          ORBIT_REGISTRY: 127.0.0.1:5000
          ORBIT_REPOSITORY: ${{ env.IMAGE_NAME }}
          ORBIT_CHANNEL: ${{ steps.installer_registry.outputs.channel }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
        run: |
          exec < /dev/null
          [[ ! -t 0 ]] || {
            printf 'The installer run must not have a TTY on standard input.\n' >&2
            exit 1
          }
          PATH="${GIT_GUARD_DIR}:${PATH}" bash "${GITHUB_WORKSPACE}/scripts/install.sh"

      - name: Verify exact-image installer evidence
        env:
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
          GIT_MARKER: ${{ steps.installer_target.outputs.git_marker }}
        run: |
          [[ ! -e "${GIT_MARKER}" ]] || {
            printf 'The installer invoked git.\n' >&2
            exit 1
          }

          env_file="${INSTALL_TARGET}/.env-orbit"
          [[ -f "${env_file}" && ! -L "${env_file}" ]] || {
            printf '%s is not a regular, non-symlink file.\n' "${env_file}" >&2
            exit 1
          }

          mapfile -t image_lines < <(grep -- '^ORBIT_IMAGE=' "${env_file}")
          [[ "${#image_lines[@]}" -eq 1 ]] || {
            printf 'Expected exactly one ORBIT_IMAGE assignment in %s, found %s.\n' "${env_file}" "${#image_lines[@]}" >&2
            exit 1
          }

          expected_prefix="ORBIT_IMAGE=127.0.0.1:5000/${IMAGE_NAME}@sha256:"
          image_line="${image_lines[0]}"
          [[ "${image_line}" == "${expected_prefix}"* ]] || {
            printf '%s is not a digest-pinned disposable-registry reference.\n' "${image_line}" >&2
            exit 1
          }
          digest="${image_line#"${expected_prefix}"}"
          [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || {
            printf '%s does not carry a lowercase sha256 digest.\n' "${image_line}" >&2
            exit 1
          }

          resolved_reference="${image_line#ORBIT_IMAGE=}"
          resolved_id="$(docker image inspect --format '{{.Id}}' "${resolved_reference}")"
          [[ "${resolved_id}" == "${TESTED_IMAGE_ID}" ]] || {
            printf 'Digest-resolved image configuration %s does not match the tested image %s.\n' "${resolved_id}" "${TESTED_IMAGE_ID}" >&2
            exit 1
          }

          running_id="$(docker inspect --format '{{.Image}}' orbit)"
          [[ "${running_id}" == "${TESTED_IMAGE_ID}" ]] || {
            printf 'Running orbit container image %s does not match the tested image %s.\n' "${running_id}" "${TESTED_IMAGE_ID}" >&2
            exit 1
          }

          revision_label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${resolved_reference}")"
          [[ "${revision_label}" == "${GITHUB_SHA}" ]] || {
            printf 'Installed image revision %s does not match %s.\n' "${revision_label}" "${GITHUB_SHA}" >&2
            exit 1
          }

          cmp --silent "${INSTALL_TARGET}/docker-compose.yml" "${GITHUB_WORKSPACE}/docker-compose.yml" || {
            printf 'Fetched docker-compose.yml does not match the checkout.\n' >&2
            exit 1
          }
          cmp --silent "${INSTALL_TARGET}/scripts/configure.sh" "${GITHUB_WORKSPACE}/scripts/configure.sh" || {
            printf 'Fetched scripts/configure.sh does not match the checkout.\n' >&2
            exit 1
          }

          for marker in .git Dockerfile src package.json package-lock.json pnpm-lock.yaml yarn.lock; do
            [[ ! -e "${INSTALL_TARGET}/${marker}" ]] || {
              printf 'Installer target unexpectedly contains %s after installation.\n' "${marker}" >&2
              exit 1
            }
          done

          ready=""
          for _ in $(seq 1 60); do
            if response="$(curl --silent --fail http://127.0.0.1:3000/api/health)" &&
              jq --exit-status '.status == "ready" and .service == "orbit"' <<< "${response}" > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ -n "${ready}" ]] || {
            printf 'Orbit did not reach the ready health state through the installer deployment.\n' >&2
            exit 1
          }

      - name: Clean up installer validation resources
        if: always()
        env:
          REGISTRY_NAME: ${{ steps.installer_registry.outputs.registry_name }}
          REGISTRY_ID: ${{ steps.installer_registry.outputs.registry_id }}
          INSTALL_TARGET: ${{ steps.installer_target.outputs.install_target }}
          GIT_GUARD_DIR: ${{ steps.installer_target.outputs.git_guard_dir }}
          REFUSAL_OUTPUT: ${{ steps.installer_refusal.outputs.refusal_output }}
        run: |
          if [[ -n "${INSTALL_TARGET:-}" && "${INSTALL_TARGET}" == "${RUNNER_TEMP}"/orbit-installer-target.* && -d "${INSTALL_TARGET}" && ! -L "${INSTALL_TARGET}" ]]; then
            if [[ -f "${INSTALL_TARGET}/docker-compose.yml" && -f "${INSTALL_TARGET}/.env-orbit" ]]; then
              (cd "${INSTALL_TARGET}" && docker compose --env-file .env-orbit -f docker-compose.yml down --volumes --remove-orphans) || true
            fi
            rm -rf -- "${INSTALL_TARGET}"
          fi

          if [[ -n "${GIT_GUARD_DIR:-}" && "${GIT_GUARD_DIR}" == "${RUNNER_TEMP}"/orbit-installer-git-guard.* && -d "${GIT_GUARD_DIR}" && ! -L "${GIT_GUARD_DIR}" ]]; then
            rm -rf -- "${GIT_GUARD_DIR}"
          fi

          if [[ -n "${REFUSAL_OUTPUT:-}" && "${REFUSAL_OUTPUT}" == "${RUNNER_TEMP}"/orbit-installer-refusal-* ]]; then
            rm -f -- "${REFUSAL_OUTPUT}"
          fi

          if [[ -n "${REGISTRY_NAME:-}" && "${REGISTRY_ID:-}" =~ ^[0-9a-f]{64}$ ]]; then
            current_registry_id="$(docker inspect --format '{{.Id}}' "${REGISTRY_NAME}" 2> /dev/null || true)"
            if [[ "${current_registry_id}" == "${REGISTRY_ID}" ]]; then
              docker rm --force "${REGISTRY_ID}" > /dev/null 2>&1 || true
            fi
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact tested image
        id: publish
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TESTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          docker push "${IMAGE_TAG}"
          published_digest="$(
            docker buildx imagetools inspect "${IMAGE_TAG}" |
              awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          )"
          [[ "${published_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Registry did not return a valid immutable image digest.\n' >&2
            exit 1
          }
          repository="${IMAGE_TAG%:*}"
          docker pull "${repository}@${published_digest}"
          published_image_id="$(
            docker image inspect --format '{{.Id}}' "${repository}@${published_digest}"
          )"
          [[ "${published_image_id}" == "${TESTED_IMAGE_ID}" ]] || {
            printf 'Published image identity %s does not match tested identity %s.\n' \
              "${published_image_id}" "${TESTED_IMAGE_ID}" >&2
            exit 1
          }
          {
            printf 'digest=%s\n' "${published_digest}"
            printf 'id=%s\n' "${published_image_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: .orbit-supply-chain/image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify published image attestations
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format json \
            > .orbit-supply-chain/provenance-verification.json
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > .orbit-supply-chain/sbom-verification.json

      - name: Upload attestation verification evidence
        if: ${{ !cancelled() && env.PUBLICATION_CHANNEL != 'ci' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: orbit-supply-chain-attestation
          path: |
            .orbit-supply-chain/provenance-verification.json
            .orbit-supply-chain/sbom-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record published image
        if: ${{ success() && env.PUBLICATION_CHANNEL != 'ci' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          TESTED_IMAGE_ID: ${{ steps.publish.outputs.id }}
        run: |
          {
            printf '## Orbit preview image\n\n'
            printf -- '- Tag: `%s`\n' "${IMAGE_TAG}"
            printf -- '- Version: `%s`\n' "${{ steps.image.outputs.version }}"
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Tested image ID: `%s`\n' "${TESTED_IMAGE_ID}"
            printf -- '- Source revision: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Source branch: `%s`\n' "${GITHUB_REF_NAME}"
            printf -- '- Supply-chain evidence: dependency/secret policy, exact-image vulnerability report, SPDX SBOM, and verified provenance/SBOM attestations\n'
            printf '\nDeploy this immutable digest for engineering or release acceptance. It is not stable until protected promotion succeeds.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  verify_preview:
    name: Verify tested preview for stable merge
    needs:
      - fast
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Check out proposed stable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview identity and source
        id: preview
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          channel=preview
          if [[ "${SOURCE_BRANCH}" == hotfix/* ]]; then
            channel=hotfix
          elif [[ "${SOURCE_BRANCH}" != "preview" ]]; then
            printf 'Stable pull requests must come from preview or a hotfix branch.\n' >&2
            exit 1
          fi

          expected_version="$(node scripts/calculate-version.mjs --channel "${channel}")"
          image="${REGISTRY}/${IMAGE_NAME,,}"
          digest="$(
            docker buildx imagetools inspect "${image}:preview" |
              awk '$1 == "Digest:" && $2 ~ /^sha256:[0-9a-f]{64}$/ { print $2; exit }'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'The preview tag did not resolve to an immutable digest.\n' >&2
            exit 1
          }
          docker pull "${image}@${digest}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${digest}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}@${digest}")"
          release_stage="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.release-stage" }}' "${image}@${digest}")"
          source_branch="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.orbit.source-branch" }}' "${image}@${digest}")"
          embedded_version="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/VERSION)"
          embedded_revision="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/REVISION)"
          embedded_channel="$(docker run --rm --entrypoint cat "${image}@${digest}" /opt/orbit/CHANNEL)"
          reported_version="$(docker run --rm "${image}@${digest}" --version)"

          [[ "${version}" == "${expected_version}" && "${embedded_version}" == "${version}" ]] || {
            printf 'Preview version does not match the calculated release train.\n' >&2
            exit 1
          }
          [[ "${revision}" == "${embedded_revision}" ]] || {
            printf 'Preview revision label and embedded identity differ.\n' >&2
            exit 1
          }
          [[ "${embedded_channel}" == "${release_stage}" ]] || {
            printf 'Preview channel label and embedded identity differ.\n' >&2
            exit 1
          }
          [[ "${reported_version}" == "Orbit ${version}" ]] || {
            printf 'Preview --version output does not match its embedded identity.\n' >&2
            exit 1
          }

          ORBIT_PROMOTION_PHASE=merge \
          ORBIT_PREVIEW_DIGEST="${digest}" \
          ORBIT_STABLE_VERSION="${version}" \
          ORBIT_PREVIEW_STAGE="${release_stage}" \
          ORBIT_PREVIEW_REVISION="${revision}" \
          ORBIT_PREVIEW_SOURCE_BRANCH="${source_branch}" \
          ORBIT_EXPECTED_PREVIEW_REVISION="${EXPECTED_REVISION}" \
            node scripts/stable-promotion-policy.mjs
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify preview attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.preview.outputs.digest }}
        run: |
          image_reference="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          gh attestation verify "${image_reference}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh attestation verify "${image_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 >/dev/null

      - name: Record stable merge evidence
        run: |
          {
            printf '## Orbit preview verified for stable merge\n\n'
            printf -- '- Version: `%s`\n' "${{ steps.preview.outputs.version }}"
            printf -- '- Digest: `%s`\n' "${{ steps.preview.outputs.digest }}"
            printf -- '- Source revision: `%s`\n' "${{ github.event.pull_request.head.sha }}"
            printf '\nNo container rebuild occurred.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_preview:
    name: Validate and publish preview image
    needs:
      - fast
      - supply_chain_source
      - integration
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/preview' ||
          startsWith(github.ref, 'refs/heads/hotfix/')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLICATION_CHANNEL: preview
    steps: *container_validation_steps
