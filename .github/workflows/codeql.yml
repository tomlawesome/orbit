name: CodeQL

# Read this before assuming the triggers below are what actually runs (#948).
# On 2026-09-16 the GitHub API reported this file as `disabled_manually` and
# `dynamic/github-code-scanning/codeql` -- GitHub's *default* code-scanning
# setup -- as the thing doing the analysing. The two are mutually exclusive:
# switching default setup on in Settings > Code security disables the
# committed workflow, and only the owner can switch it back.
#
# That matters because the two scan different code. This file scans every push
# to `dev`, `preview` and `hotfix/**`; default setup scans the default branch
# and pull requests against it. The default branch here is `main`, frozen at
# v1.2.0 until v1.3.0 promotes (#547), and GitLab has been where changes are
# reviewed since #801, so there are no GitHub pull requests either. CodeQL on
# the mirror is therefore analysing v1.2.0 and nothing newer.
#
# Deciding which of the two to keep is the owner's, and it is a repository
# setting rather than a change to this file, so nothing here can fix it.
#
# Resolved 2026-09-20: the owner re-enabled this workflow (state went back to
# `active`; API `updated_at` 2026-09-20T21:06:41+01:00). Confirmed running:
# four pushes to `dev` on 2026-09-22 each triggered both matrix jobs and both
# completed successfully (#1037). Leave the trigger list alone -- `dev` was
# already correct, the workflow just needed the owner's switch flipped.

on:
  push:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"
  schedule:
    - cron: "37 2 * * 6"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel only a superseded pull-request commit. A push must never cancel the
  # validation of an earlier merge: the delivery model requires trusted evidence
  # for that exact merge SHA, and a cancelled run leaves it permanently without.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
