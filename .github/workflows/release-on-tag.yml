name: Release the mirrored stable tag

# The release decision itself is made on GitLab (#821): the manual
# `promote_stable` job there validates the version, checks the tested
# preview digest and creates the annotated `vX.Y.Z` tag. GitLab's push
# mirror carries that tag here within minutes, and this workflow's only job
# is to turn it into a GitHub Release so the public Releases page keeps
# working. GitHub does no judging of its own -- it never refuses a tag or
# recomputes anything for the image.
#
# ADR-0031 #9: the same signed launcher and release manifest are attached
# here, to the permanent stable release -- the exact bytes GitLab already
# tested and signed for this commit. There is no rolling `preview`
# prerelease to also carry them: the owner removed that (21a, #1107),
# so publish-from-gitlab.yml only copies the tested image digest to GHCR
# and never touches a release. Nothing is rebuilt: a tag only exists
# because `promote_stable` already validated the preview digest, and
# the tagged commit is the one `promote_stable` found tested (#1640), so this
# commit's own GitLab pipeline is the one that tested it.
#
# A pre-release-shaped tag (`vX.Y.Z-<prerelease>`, e.g. a throwaway
# `vX.Y.Z-e2e.N` tag used to prove the launcher/signature path end to end,
# #1121) is published as a GitHub pre-release and never marked Latest --
# scripts/ci/classify-release-tag.sh decides which shape a given tag is.
#
# That pipeline is a *push* pipeline for either `preview` or a `hotfix/*`
# branch (scripts/ci/gitlab-await-tested-image.sh only accepts those). The
# tag's message records which, in a `Tested on: <branch>` line that
# `promote_stable` writes (#1640), and "Find the branch GitLab tested this
# commit on" below reads it. Tags made before that line existed fall back to
# checking which mirrored branch's history contains the tagged commit,
# preferring `preview`.
#
# Secrets: the same read-only GitLab project access token
# publish-from-gitlab.yml uses (GITLAB_READ_TOKEN_NAME, GITLAB_READ_TOKEN),
# for reading pipeline/job data and downloading artifacts. Nothing here can
# write to GitLab.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GITLAB_API_URL: https://gitlab.tomlawson.io/api/v4
  GITLAB_PROJECT_ID: "49"
  GITLAB_REGISTRY: registry.tomlawson.io

jobs:
  release:
    name: Create GitHub release from mirrored tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit and its preview/hotfix branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # A stable vX.Y.Z tag becomes the release exactly as it always has (gh
      # release create defaults to marking it Latest). A pre-release-shaped
      # tag -- a throwaway vX.Y.Z-e2e.N proving the launcher/signature path,
      # #1121 -- is published as a GitHub pre-release and explicitly kept off
      # Latest, so scripts/get-orbit.sh's default ORBIT_CHANNEL=latest can
      # never resolve to it.
      - name: Create the release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            printf 'Release %s already exists; nothing to do.\n' "${TAG}"
          else
            kind="$(bash scripts/ci/classify-release-tag.sh "${TAG}")"
            if [[ "${kind}" == "prerelease" ]]; then
              gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
                --prerelease --latest=false
            else
              gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
            fi
          fi

      # The tagged commit is the one `promote_stable` found tested: `main`'s
      # head, or the commit behind its merge commit (#1640). The tag's own
      # message names the branch it was tested on. For older tags, which
      # carry no such line, the commit alone cannot say which branch tested
      # it, so the branches are searched, preferring `preview` (ADR-0031's
      # reading of #821); a hotfix promotion is the only case where more
      # than one candidate could contain the commit.
      - name: Find the branch GitLab tested this commit on
        id: source
        env:
          TAG_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # The tag message says where GitLab tested the commit (#1640). A
          # tag without the line is an older one; search the branches then.
          # Only an annotated tag carries a message of its own; a lightweight
          # tag's %(contents) would be the commit message, which is not ours.
          ref="$(git for-each-ref "refs/tags/${TAG}" --format='%(objecttype) %(contents)' |
            sed -nE -e '1{s#^tag ##;t;q}' -e 's#^Tested on: (preview|hotfix/[A-Za-z0-9._/-]+)$#\1#p;T;q')"
          if [[ -n "${ref}" ]]; then
            printf 'Testing branch for %s from the tag: %s\n' "${TAG_COMMIT}" "${ref}"
            printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Fallback for tags made before #1640: whichever mirrored branch
          # contains the commit, preferring preview.
          candidates="$(git for-each-ref --format='%(refname:short)' --contains "${TAG_COMMIT}" \
            refs/remotes/origin/preview 'refs/remotes/origin/hotfix/*')"
          if grep -qx 'origin/preview' <<< "${candidates}"; then
            ref=preview
          else
            ref="$(head -n1 <<< "${candidates}" | sed 's#^origin/##')"
          fi
          [[ -n "${ref}" ]] || {
            printf '::error::no mirrored preview or hotfix/* branch contains %s; cannot tell GitLab which pipeline tested this release.\n' "${TAG_COMMIT}" >&2
            exit 1
          }
          printf 'Testing branch for %s: %s\n' "${TAG_COMMIT}" "${ref}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      # Same script, same evidence shape as publish-from-gitlab.yml -- this
      # is the promoted commit's own tested pipeline, not a fresh push, so a
      # short wait budget is enough: `promote_stable` only creates the tag
      # after that pipeline already succeeded.
      - name: Fetch the tested launcher, manifest and .sig from GitLab
        id: evidence
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_REF: ${{ steps.source.outputs.ref }}
          ORBIT_FETCH_LAUNCHER_ASSETS: "1"
          ORBIT_WAIT_MINUTES: "10"
        run: bash scripts/ci/gitlab-await-tested-image.sh

      - name: Verify the release manifest's signature
        run: |
          bash scripts/ci/verify-release-manifest.sh \
            "${{ steps.evidence.outputs.release_manifest }}" \
            "${{ steps.evidence.outputs.release_manifest_sig }}"

      # install.sh and get-orbit.sh come from this checkout, not a second
      # GitLab download: the checkout above is the exact tagged commit, and
      # git's content addressing means that commit SHA can only ever mean
      # the same file bytes on either host -- this check proves that rather
      # than assuming it.
      - name: Check the launcher assets against the manifest
        run: |
          bash scripts/ci/verify-manifest-assets.sh \
            "${{ steps.evidence.outputs.release_manifest }}" \
            "orbit-launcher_linux_amd64.tar.gz=${{ steps.evidence.outputs.launcher_amd64_archive }}" \
            "orbit-launcher_linux_arm64.tar.gz=${{ steps.evidence.outputs.launcher_arm64_archive }}" \
            "install.sh=scripts/install.sh" \
            "get-orbit.sh=scripts/get-orbit.sh"

      - name: Attach the launcher and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MANIFEST: ${{ steps.evidence.outputs.release_manifest }}
          MANIFEST_SIG: ${{ steps.evidence.outputs.release_manifest_sig }}
          AMD64_ARCHIVE: ${{ steps.evidence.outputs.launcher_amd64_archive }}
          ARM64_ARCHIVE: ${{ steps.evidence.outputs.launcher_arm64_archive }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "${MANIFEST}" "${MANIFEST_SIG}" "${AMD64_ARCHIVE}" "${ARM64_ARCHIVE}" \
            scripts/install.sh scripts/get-orbit.sh
