name: Release the mirrored stable tag

# The release decision itself is made on GitLab (#821): the manual
# `promote_stable` job there validates the version, checks the tested
# preview digest and creates the annotated `vX.Y.Z` tag. GitLab's push
# mirror carries that tag here within minutes, and this workflow's only job
# is to turn it into a GitHub Release so the public Releases page keeps
# working. GitHub does no judging of its own -- it recomputes nothing for
# the image, and its only refusal is of a tag that is not a stable vX.Y.Z.
#
# ADR-0031 #9: the same signed launcher and release manifest are attached
# here, to the permanent stable release -- the exact bytes GitLab already
# tested and signed for this commit. There is no rolling `preview`
# prerelease to also carry them: the owner removed that (21a, #1107),
# so publish-from-gitlab.yml only copies the tested image digest to GHCR
# and never touches a release. Nothing is rebuilt: a tag only exists
# because `promote_stable` already validated the preview digest, and
# the tagged commit is the one `promote_stable` found tested (#1640), so this
# commit's own GitLab pipeline is the one that tested it.
#
# Only a stable `vX.Y.Z` tag is released. A pre-release-shaped tag
# (`vX.Y.Z-<prerelease>`) is refused before anything is published: the
# signed manifest only ever names `vX.Y.Z`, so such a tag could never get
# its files (#1848 D-F4; the throwaway e2e rehearsal of #1121 is dropped).
# scripts/ci/classify-release-tag.sh decides which shape a tag is.
#
# Verify, then publish: the release is created as a draft only after every
# check below has passed, the files are attached to the draft, and only then
# is it published. A refusal at any step leaves no half-made public release,
# and a re-run finishes the same draft.
#
# That pipeline is a *push* pipeline for either `preview` or a `hotfix/*`
# branch (only those hand off to GitHub, and the handoff's evidence must name
# the branch). The tag's message records which, in a `Tested on: <branch>` line that
# `promote_stable` writes (#1640), and "Find the branch GitLab tested this
# commit on" below reads it. Tags made before that line existed fall back to
# checking which mirrored branch's history contains the tagged commit,
# preferring `preview`.
#
# The launcher archives, the manifest and its .sig come from GitLab's handoff
# for that commit: the published release handoff-<commit> that GitLab's
# handoff_to_github job filled in the separate public handoff repository,
# <owner>/orbit-handoff (#1824). GitHub never connects to GitLab and never
# writes to the handoff repository. The release is only the carrier; the
# checks below (the manifest's signature and the
# archives' hashes in it) are what the files are trusted on, as before.
#
# Secrets: none beyond the built-in token. `contents: write` creates this
# repository's release; the handoff repository is public, so reading it needs
# no write access there.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release from mirrored tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit and its preview/hotfix branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Refuse a tag that is not a stable vX.Y.Z
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          kind="$(bash scripts/ci/classify-release-tag.sh "${TAG}" || true)"
          [[ "${kind}" == "stable" ]] || {
            printf '::error::%s is not a stable vX.Y.Z tag; only stable tags are released (#1848).\n' "${TAG}" >&2
            exit 1
          }

      # The tagged commit is the one `promote_stable` found tested: `main`'s
      # head, or the commit behind its merge commit (#1640). The tag's own
      # message names the branch it was tested on. For older tags, which
      # carry no such line, the commit alone cannot say which branch tested
      # it, so the branches are searched, preferring `preview` (ADR-0031's
      # reading of #821); a hotfix promotion is the only case where more
      # than one candidate could contain the commit.
      - name: Find the branch GitLab tested this commit on
        id: source
        env:
          TAG_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # The tag message says where GitLab tested the commit (#1640). A
          # tag without the line is an older one; search the branches then.
          # Only an annotated tag carries a message of its own; a lightweight
          # tag's %(contents) would be the commit message, which is not ours.
          ref="$(git for-each-ref "refs/tags/${TAG}" --format='%(objecttype) %(contents)' |
            sed -nE -e '1{s#^tag ##;t;q}' -e 's#^Tested on: (preview|hotfix/[A-Za-z0-9._/-]+)$#\1#p;T;q')"
          if [[ -n "${ref}" ]]; then
            printf 'Testing branch for %s from the tag: %s\n' "${TAG_COMMIT}" "${ref}"
            printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Fallback for tags made before #1640: whichever mirrored branch
          # contains the commit, preferring preview.
          candidates="$(git for-each-ref --format='%(refname:short)' --contains "${TAG_COMMIT}" \
            refs/remotes/origin/preview 'refs/remotes/origin/hotfix/*')"
          if grep -qx 'origin/preview' <<< "${candidates}"; then
            ref=preview
          else
            ref="$(head -n1 <<< "${candidates}" | sed 's#^origin/##')"
          fi
          [[ -n "${ref}" ]] || {
            printf '::error::no mirrored preview or hotfix/* branch contains %s; cannot tell which tested branch the handoff evidence must name.\n' "${TAG_COMMIT}" >&2
            exit 1
          }
          printf 'Testing branch for %s: %s\n' "${TAG_COMMIT}" "${ref}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      # Same script, same evidence checks as publish-from-gitlab.yml -- this
      # is the promoted commit's own handoff, made when its preview or hotfix
      # pipeline passed, so a short wait budget is enough: `promote_stable`
      # only creates the tag after that pipeline already succeeded.
      - name: Fetch the tested launcher, manifest and .sig from GitLab's handoff
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HANDOFF_REPO: ${{ github.repository_owner }}/orbit-handoff
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_REF: ${{ steps.source.outputs.ref }}
          ORBIT_FETCH_LAUNCHER_ASSETS: "1"
          ORBIT_WAIT_MINUTES: "10"
        run: bash scripts/ci/github-await-handoff.sh

      - name: Verify the release manifest's signature
        run: |
          bash scripts/ci/verify-release-manifest.sh \
            "${{ steps.evidence.outputs.release_manifest }}" \
            "${{ steps.evidence.outputs.release_manifest_sig }}"

      # The handoff is found by commit, but the signed manifest inside it must
      # also be for this tag: its commit the tagged commit and its version the
      # tag name. Otherwise an older genuine manifest and launcher could be
      # attached to a new release (#1824). promote_stable names the tag after
      # the image's version, which is the manifest's version.
      - name: Refuse a manifest for another commit or version
        env:
          MANIFEST: ${{ steps.evidence.outputs.release_manifest }}
          WANT_COMMIT: ${{ github.sha }}
          WANT_VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          read -r commit version < <(node -e '
            const doc = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const text = (v) => (typeof v === "string" && /^[A-Za-z0-9.+-]+$/u.test(v) ? v : "-");
            process.stdout.write(`${text(doc.commit)} ${text(doc.version)}\n`);
          ' -- "${MANIFEST}")
          [[ "${commit}" == "${WANT_COMMIT}" ]] || {
            printf '::error::the signed manifest is for commit %s, not the tagged commit %s; refusing\n' "${commit}" "${WANT_COMMIT}" >&2
            exit 1
          }
          [[ "${version}" == "${WANT_VERSION}" ]] || {
            printf '::error::the signed manifest is for version %s, not the tag %s; refusing\n' "${version}" "${WANT_VERSION}" >&2
            exit 1
          }
          printf 'The manifest is for %s at %s.\n' "${version}" "${commit}"

      # install.sh and get-orbit.sh come from this checkout, not the handoff: the checkout above is the exact tagged commit, and
      # git's content addressing means that commit SHA can only ever mean
      # the same file bytes on either host -- this check proves that rather
      # than assuming it.
      - name: Check the launcher assets against the manifest
        run: |
          bash scripts/ci/verify-manifest-assets.sh \
            "${{ steps.evidence.outputs.release_manifest }}" \
            "orbit-launcher_linux_amd64.tar.gz=${{ steps.evidence.outputs.launcher_amd64_archive }}" \
            "orbit-launcher_linux_arm64.tar.gz=${{ steps.evidence.outputs.launcher_arm64_archive }}" \
            "install.sh=scripts/install.sh" \
            "get-orbit.sh=scripts/get-orbit.sh"

      # Created as a draft, after every check above, so nothing is public
      # until the files are attached. Publishing it below marks it Latest by
      # GitHub's default, as the old non-draft create did. The existence
      # check lists every release, drafts included, so a re-run after a
      # failed upload finishes the same draft rather than making a second.
      - name: Create the release as a draft if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[].tag_name")"
          if grep -qxF "${TAG}" <<< "${tags}"; then
            printf 'Release %s already exists; not creating it again.\n' "${TAG}"
          else
            # The body is the version's CHANGELOG.md section (#1704). If the
            # script fails the step fails: no release without notes.
            previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' |
              awk -v tag="${TAG}" '$0 == tag { found = 1; next } found { print; exit }' || true)"
            if [[ -n "${previous}" ]]; then
              node scripts/release-notes.mjs "${TAG}" --previous "${previous}" \
                --repo "${GITHUB_REPOSITORY}" > "${RUNNER_TEMP}/release-notes.md"
            else
              node scripts/release-notes.mjs "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
            fi
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Attach the launcher and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MANIFEST: ${{ steps.evidence.outputs.release_manifest }}
          MANIFEST_SIG: ${{ steps.evidence.outputs.release_manifest_sig }}
          AMD64_ARCHIVE: ${{ steps.evidence.outputs.launcher_amd64_archive }}
          ARM64_ARCHIVE: ${{ steps.evidence.outputs.launcher_arm64_archive }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "${MANIFEST}" "${MANIFEST_SIG}" "${AMD64_ARCHIVE}" "${ARM64_ARCHIVE}" \
            scripts/install.sh scripts/get-orbit.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
