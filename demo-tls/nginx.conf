events {}
http {
  server {
    listen 3080;
    return 301 https://$host:3443$request_uri;
  }
  server {
    listen 3443 ssl;
    ssl_certificate /etc/demo/demo.crt;
    ssl_certificate_key /etc/demo/demo.key;
    # A browser that asks this port in plain HTTP (an address typed without
    # https://, or an old saved copy of the app) gets nginx's bare 400. Send it
    # to the HTTPS address instead (497 is nginx's "HTTP sent to HTTPS port").
    error_page 497 =301 https://$host:3443$request_uri;
    # Orbit takes documents up to its upload size limit: 50 MiB by default,
    # and an administrator can raise it to 100 MiB in Administration (#1285);
    # an archive import takes a whole household, up to the default 5 GiB
    # quota plus a little (#1390), and the Dockerfile's BODY_SIZE_LIMIT is
    # Infinity, so Orbit's own per-route limits are the gate. nginx's own
    # default (1m) refused a 1.5 MB PDF with a 413, so this covers the
    # largest archive at the default quota, 5200m, as docs/installing.md
    # advises (#1507).
    client_max_body_size 5200m;
    location / {
      resolver 127.0.0.11 valid=10s;
      set $upstream http://orbit-app:3000;
      proxy_pass $upstream;
      proxy_set_header Host $host:3443;
      proxy_http_version 1.1;
    }
  }
}
