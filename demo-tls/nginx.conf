events {}
http {
  server {
    listen 3080;
    return 301 https://$host:3443$request_uri;
  }
  server {
    listen 3443 ssl;
    ssl_certificate /etc/demo/demo.crt;
    ssl_certificate_key /etc/demo/demo.key;
    # Orbit takes documents up to its upload size limit: 50 MiB by default,
    # and an administrator can raise it to 100 MiB in Administration (#1285).
    # nginx's own default (1m) refused a 1.5 MB PDF with a 413, so this
    # covers every limit Orbit can be set to.
    client_max_body_size 101m;
    location / {
      resolver 127.0.0.11 valid=10s;
      set $upstream http://orbit:3000;
      proxy_pass $upstream;
      proxy_set_header Host $host:3443;
      proxy_http_version 1.1;
    }
  }
}
