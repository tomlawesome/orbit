events {}
http {
  server {
    listen 3080;
    return 301 https://192.168.11.30:3443$request_uri;
  }
  server {
    listen 3443 ssl;
    ssl_certificate /etc/demo/demo.crt;
    ssl_certificate_key /etc/demo/demo.key;
    location / {
      resolver 127.0.0.11 valid=10s;
      set $upstream http://orbit:3000;
      proxy_pass $upstream;
      proxy_set_header Host $host:3443;
      proxy_http_version 1.1;
    }
  }
}
