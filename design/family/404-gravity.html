<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — gravity well</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="family.css">
<style>
body{background:#04070f}
/* the sky falls in (#790, ported from +error.svelte/notfound.css): three
   <canvas> copies of a band of stars, each spiralling in toward the hole and
   handing over to the next. Frozen state only — the gate screenshots with
   animations disabled, so this mockup goes straight to the settled/live
   picture rather than reproducing the still-SVG handover the product opens
   with. */
.infall{position:fixed;inset:0;overflow:hidden;pointer-events:none;container-type:size}
.fall{--k:max(.0625cqw,.1cqh);--band:calc(2200 * var(--k));
      position:absolute;width:var(--band);height:var(--band);
      left:calc(50% - var(--band) / 2);top:calc(50% - 50 * var(--k) - var(--band) / 2);
      transform:scale(var(--s0));
      animation:infall var(--T) linear infinite;animation-delay:calc(var(--i) * var(--T) / -3)}
.fall-far{--T:160s}
.fall-near{--T:80s}
.infall:not(.live) .fall{visibility:hidden;animation:none}
@keyframes infall{
  0%{transform:rotate(0deg) scale(2);opacity:0}
  6%{opacity:1}
  12.5%{transform:rotate(-6.25deg) scale(1.542)}
  25%{transform:rotate(-12.5deg) scale(1.189)}
  37.5%{transform:rotate(-18.75deg) scale(.917)}
  50%{transform:rotate(-25deg) scale(.707)}
  62.5%{transform:rotate(-31.25deg) scale(.545)}
  75%{transform:rotate(-37.5deg) scale(.42)}
  84%{opacity:1}
  87.5%{transform:rotate(-43.75deg) scale(.324)}
  100%{transform:rotate(-50deg) scale(.25);opacity:0}}

/* the well never sits still */
.disc-precess{transform-origin:800px 450px;animation:precess 56s ease-in-out infinite alternate}
@keyframes precess{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
.disc-glow{animation:dbreathe 9s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes dbreathe{from{opacity:.65}to{opacity:1}}
.photon{animation:pflick 6.5s ease-in-out infinite alternate}
@keyframes pflick{from{opacity:.8}to{opacity:1}}
.photon-hot{animation:pflick2 4.2s ease-in-out infinite alternate}
@keyframes pflick2{from{opacity:.7}to{opacity:1}}
.lensed{animation:lens 12s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes lens{from{opacity:.7}to{opacity:.95}}
.smear{animation:smear 8s ease-in-out infinite alternate}
@keyframes smear{from{opacity:.55}to{opacity:.85}}

.line-a{position:fixed;left:0;right:0;bottom:17vh;text-align:center;z-index:3;
        font:500 14px var(--display);letter-spacing:.14em;color:var(--ink-mid)}
.line-b{position:fixed;left:0;right:0;bottom:12.5vh;text-align:center;z-index:3;
        font:11px var(--mono);letter-spacing:.14em}
.line-b a{color:var(--accent);text-decoration:none}
.line-b a:hover{text-decoration:underline}
.grain{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.5;mix-blend-mode:overlay}
</style></head><body>

<div class="infall live" aria-hidden="true">
  <canvas class="fall fall-far" style="--i:0;--s0:2"></canvas>
  <canvas class="fall fall-far" style="--i:1;--s0:1"></canvas>
  <canvas class="fall fall-far" style="--i:2;--s0:.5"></canvas>
  <canvas class="fall fall-near" style="--i:0;--s0:2"></canvas>
  <canvas class="fall fall-near" style="--i:1;--s0:1"></canvas>
  <canvas class="fall fall-near" style="--i:2;--s0:.5"></canvas>
</div>

<div style="position:fixed;inset:0;z-index:1"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">
  <defs>
    <!-- doppler: the approaching side of the disc burns white, the receding side dims -->
    <linearGradient id="doppler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff7e4"/>
      <stop offset="28%" stop-color="#ffd489" stop-opacity=".9"/>
      <stop offset="62%" stop-color="#e2772b" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#6e2a14" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="doppler-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffedc4" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#e2772b" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#5a2010" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="wellglow" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#f0a35a" stop-opacity=".16"/>
      <stop offset="65%" stop-color="#c25a24" stop-opacity=".07"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamg" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd489" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffd489" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyphg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ecdd"/>
      <stop offset="100%" stop-color="#b8ac8e"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b16" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="hotrough" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ambient warmth of the well -->
  <circle class="disc-glow" cx="800" cy="450" r="520" fill="url(#wellglow)"/>

  <g class="disc-precess">
    <!-- lensed starlight: stars behind the hole smeared into tangential arcs -->
    <g id="lensarcs" class="lensed" fill="none"></g>

    <!-- the far side of the disc, lensed into an arch OVER the hole (and a fainter one under) -->
    <g class="lensed">
      <path d="M 649 460 A 152 152 0 1 1 951 460" fill="none" stroke="url(#doppler)"
            stroke-width="17" stroke-linecap="round" filter="url(#b3)" opacity=".9"/>
      <path d="M 655 452 A 150 150 0 1 1 945 452" fill="none" stroke="#fff3d6"
            stroke-width="4" stroke-linecap="round" filter="url(#b1)" opacity=".75"/>
      <path d="M 668 508 A 140 140 0 0 0 932 508" fill="none" stroke="url(#doppler)"
            stroke-width="9" stroke-linecap="round" filter="url(#b3)" opacity=".5"/>
    </g>

    <!-- disc haze behind everything -->
    <ellipse cx="800" cy="452" rx="430" ry="96" fill="url(#doppler-soft)" filter="url(#b16)" opacity=".6"/>

    <!-- event horizon -->
    <circle cx="800" cy="450" r="112" fill="#000000"/>
    <!-- photon ring -->
    <circle class="photon" cx="800" cy="450" r="119" fill="none" stroke="#ff9a4a" stroke-width="7" opacity=".4" filter="url(#b6)"/>
    <circle class="photon" cx="800" cy="450" r="118" fill="none" stroke="#ffce8a" stroke-width="2.6" filter="url(#b1)"/>
    <circle class="photon-hot" cx="800" cy="450" r="117" fill="none" stroke="#fffaf0" stroke-width="1.1"/>

    <!-- the near side of the disc, crossing IN FRONT below the hole -->
    <g class="smear">
      <path d="M 452 452 A 348 62 0 0 0 1148 452" fill="none" stroke="url(#doppler-soft)"
            stroke-width="34" filter="url(#b6)"/>
    </g>
    <path d="M 452 452 A 348 62 0 0 0 1148 452" fill="none" stroke="url(#doppler)"
          stroke-width="13" filter="url(#hotrough)"/>
    <path d="M 470 458 A 346 58 0 0 0 1130 458" fill="none" stroke="#fff3d6"
          stroke-width="2.6" filter="url(#b1)" opacity=".8"/>
  </g>

  <!-- the outer 4: caught, but still itself -->
  <text x="505" y="512" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
        font-weight="600" font-size="168" fill="url(#glyphg)"
        transform="rotate(-5 505 460)">4</text>

  <!-- the inner 4: mid-spaghettification, shearing toward the horizon -->
  <g>
    <!-- the glyph itself, stretched and tilted into the fall -->
    <g transform="translate(1092 460) rotate(8) skewX(-14) scale(1.24,.9)">
      <text x="0" y="52" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-weight="600" font-size="168" fill="#e8dcbc" opacity=".3" filter="url(#b6)"
            transform="scale(1.35,1)">4</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Space Grotesk',sans-serif"
            font-weight="600" font-size="168" fill="url(#glyphg)">4</text>
    </g>
    <!-- the tidal stream: its substance drawn off into the photon ring -->
    <path class="smear" d="M 1030 448 C 985 442, 950 442, 916 446 L 916 470 C 950 468, 985 470, 1030 480 Z"
          fill="url(#streamg)" filter="url(#b3)"/>
    <path d="M 1026 456 C 978 450, 946 452, 918 456" fill="none" stroke="#ffe9bd"
          stroke-width="1.4" opacity=".55" filter="url(#b1)"/>
  </g>

  <!-- debris: fragments of the lost page spiralling in, stretching as they go -->
  <g fill="#cdd6ee" font-family="'JetBrains Mono',monospace" font-size="15">
    <g opacity=".8">
      <animateMotion dur="13s" repeatCount="indefinite" rotate="auto"
        path="M 1420 170 C 1180 210, 1010 280, 940 360 C 900 406, 872 430, 850 442"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;2.4 .5;3.6 .25" keyTimes="0;.72;.94;1" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.8;.7;0" keyTimes="0;.8;.96;1" dur="13s" repeatCount="indefinite"/>
      <text>/</text>
    </g>
    <g opacity=".7">
      <animateMotion dur="17s" begin="-6s" repeatCount="indefinite" rotate="auto"
        path="M 150 780 C 380 740, 560 660, 660 560 C 716 506, 748 478, 766 464"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;2.6 .45;3.8 .2" keyTimes="0;.74;.94;1" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;.7;.6;0" keyTimes="0;.8;.96;1" dur="17s" repeatCount="indefinite"/>
      <text>~</text>
    </g>
    <g opacity=".6">
      <animateMotion dur="21s" begin="-13s" repeatCount="indefinite" rotate="auto"
        path="M 1500 820 C 1260 800, 1060 720, 960 610 C 906 550, 872 500, 852 470"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;2.2 .5;3.4 .25" keyTimes="0;.75;.95;1" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;.6;.5;0" keyTimes="0;.82;.97;1" dur="21s" repeatCount="indefinite"/>
      <text>.html</text>
    </g>
  </g>
</svg></div>

<div class="line-a">This page fell into a gravity well.</div>
<div class="line-b"><a href="#">plot a course home &rarr;</a></div>

<svg class="grain" width="100%" height="100%"><filter id="gr">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>

<div class="vignette" style="background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.5) 100%)"></div>
<div class="foot">the black hole is the 0 &middot; the near 4 is further gone &middot; nothing escapes, except you &mdash; home is a click away</div>

<script>
/* #790: the falling sky, inlined verbatim from web/src/routes/gravity-well.js
   (same seed, same maths) so this mockup's sky is pixel-identical to the
   product's. No module system here, so createSky/paintCopy/renewCopy are
   copied in rather than imported — keep them in sync by hand if
   gravity-well.js changes. */
function createSky() {
  const rng = (s => () => (s = (s * 48271) % 2147483647) / 2147483647)(4040404);
  const NS = "http://www.w3.org/2000/svg";

  const band = (n, place) => {
    let made = 0;
    while (made < n) {
      const r = 450 * Math.exp(rng() * Math.log(1100 / 450));
      const w = r < 560 ? (r - 450) / 110 : r > 900 ? (1100 - r) / 200 : 1;
      if (rng() > w) continue;
      const a = rng() * Math.PI * 2;
      place(r * Math.cos(a), r * Math.sin(a));
      made++;
    }
  };
  const farBand = () => {
    const stars = [];
    band(150, (x, y) => {
      stars.push({ x, y, r: 0.35 + rng() * 0.65, o: 0.1 + rng() * 0.28 });
      if (rng() < 0.14) rng();
    });
    return stars;
  };
  const nearBand = () => {
    const stars = [];
    band(36, (x, y) => {
      const r = 0.9 + rng() * 0.9;
      stars.push({ x, y, r, o: 0.4 + rng() * 0.4 });
      if (rng() < 0.28) rng();
    });
    return stars;
  };
  const queued = { far: [farBand(), farBand(), farBand()], near: [nearBand(), nearBand(), nearBand()] };

  return {
    first: { far: [...queued.far], near: [...queued.near] },
    far: () => queued.far.shift() ?? farBand(),
    near: () => queued.near.shift() ?? nearBand(),
    mountArcs() {
      // lensed starlight: tangential smears ringing the hole
      const arcs = document.getElementById("lensarcs");
      for (let i = 0; arcs && i < 46; i++) {
        const rad = 138 + rng() * 150;
        const a0 = rng() * Math.PI * 2;
        const sweep = (0.25 + rng() * 0.7) * (60 / rad);
        const a1 = a0 + sweep;
        const x0 = 800 + rad * Math.cos(a0), y0 = 450 + rad * Math.sin(a0);
        const x1 = 800 + rad * Math.cos(a1), y1 = 450 + rad * Math.sin(a1);
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${rad.toFixed(1)} ${rad.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`);
        p.setAttribute("stroke", "#cdd6ee");
        p.setAttribute("stroke-width", (0.7 + rng() * 0.9).toFixed(2));
        p.setAttribute("stroke-linecap", "round");
        // tighter to the hole = brighter, more smeared
        p.setAttribute("opacity", (0.24 * (170 / rad) ** 1.6).toFixed(2));
        if (rng() < 0.35) p.setAttribute("filter", "url(#b1)");
        arcs.appendChild(p);
      }
    },
  };
}

const showing = new WeakMap();

function renewCopy(canvas, bands, side) {
  showing.delete(canvas);
  paintCopy(canvas, bands, side);
}

function paintCopy(c, bands, side) {
  const near = c.classList.contains("fall-near");
  let stars = showing.get(c);
  if (!stars) showing.set(c, (stars = near ? bands.near() : bands.far()));
  c.width = side;
  c.height = side;
  const ctx = c.getContext("2d");
  ctx.setTransform(side / 2200, 0, 0, side / 2200, side / 2, side / 2);
  for (const s of stars) {
    if (near) {
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.6);
      glow.addColorStop(0, "rgba(232,237,255,.45)");
      glow.addColorStop(1, "rgba(232,237,255,0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 3.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = s.o;
    ctx.fillStyle = near ? "#e8edff" : "#dbe2f5";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* This mockup skips the still-SVG handover +error.svelte opens with (the
   fidelity gate screenshots after settle, when the product is already past
   it) and goes straight to the live, painted sky. */
const sky = createSky();
sky.mountArcs();

const infall = document.querySelector(".infall");
let side = 0;
function paint() {
  const rect = infall.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  side = Math.min(2048, Math.max(1, Math.round(2200 * Math.max(rect.width / 1600, rect.height / 1000) * dpr)));
  const copies = [...infall.querySelectorAll("canvas.fall")];
  copies.sort((a, b) => Number(a.style.getPropertyValue("--i") === "0") - Number(b.style.getPropertyValue("--i") === "0"));
  for (const c of copies) paintCopy(c, sky, side);
}
paint();
window.addEventListener("resize", paint);
infall.addEventListener("animationiteration", (e) => {
  if (e.animationName === "infall" && e.target instanceof HTMLCanvasElement) renewCopy(e.target, sky, side);
});
</script>
</body></html>
