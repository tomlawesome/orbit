const shortDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB",
  { day: "2-digit", month: "short", timeZone: "UTC" });
const money = (minor) => new Intl.NumberFormat("en-GB",
  { style: "currency", currency: "GBP" }).format(minor / 100);
const every = (m) => m === 12 ? "every year" : m === 1 ? "every month" : `every ${m} months`;
const remindOf = (days) => days.map((d) => `${d}d`).join(" and ") + " before";

/* chart.js bandOf(), and home.css's T-minus column tones. The manifest reads
   time in four colours; the belt says the same thing in the same four, on the
   rock's rim and its pip, so the sooner end of the band burns and the later
   end cools. */
function bandOf(days) {
  if (days < 0) return "over";
  if (days <= 30) return "soon";
  if (days <= 90) return "up";
  return "ok";
}
const BAND_VAR = { over:"var(--overdue)", soon:"var(--warm)",
                   up:"var(--upcoming)", ok:"var(--ok)" };

const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* A Lehmer stream. Two of them: one fixed seed for the members' silhouettes
   and their jumble (so a rock is the same rock, in the same place, every
   load — fixture truth), and one that runs for ever for the ambient band,
   never rewound, which is exactly why the band can never repeat itself. */
const rngFrom = (s) => () => (s = (s * 48271) % 2147483647) / 2147483647;
const bandRng = rngFrom(19170812);

/* ==================================================================== *
 * The ambient band's population — v2's, unchanged.
 *
 * Bodies are scattered in three dimensions of the ring, not along a line:
 *   phi   where round the belt
 *   rho   A · (1 ± .19), triangular — dense at the ring radius, frayed out
 *   h     ±.066·A out of the ring plane, triangular
 * and each carries its own size, tone and silhouette. Sizes are cubed so
 * the population is overwhelmingly dust with a scattering of real rubble:
 * that ratio, not the count, is what makes a belt look like a belt.
 *
 * Drift: leftward along the ring for ever. Inner bodies run faster than
 * outer ones (Keplerian shear, softened to a ±15% spread so the band shears
 * rather than smears), and near bodies faster than far ones. A body that
 * leaves the left edge does not come back: it is REBUILT from the running
 * stream at the far end with fresh radius, height, size and shape. The
 * band you are shown one minute is not the band you were shown before.
 *
 * WHERE IT IS SOWN — the correction. The bed used to be sown across the
 * screen window and nothing else: [PHI_R − M, PHI_L + M], the arc the sky
 * shows AT REST. But the ambient bodies ride the roll like everything else
 * in the field, so centring the sooner end carried the whole populated
 * stretch off to the left and left bare ring behind it — a belt that ran
 * out. The bed is now sown across THE WHOLE ARC THE CAMERA CAN EVER REACH:
 * the screen window, plus the roll span the seats themselves produce
 * (sooner-most seat to later-most seat, measured off the built manifest, not
 * guessed at), so every roll looks out on ground that was already sown.
 *
 * A body is held in BAND COORDINATES — where it sits when the belt is rolled
 * to its sooner end — because that is the one frame the roll cannot move.
 * Its own arc is [PHI_R − M − REACH·rate, PHI_L + M]: a fast body has to
 * start further out to still be in the sky at the later end, and because
 * every rate class is sown uniformly across its own arc, the density the
 * screen sees is the same at every roll.
 *
 * These are inert decor and nothing else. They are also the reason a
 * household with three items still has a belt (owner, confirmed): the real
 * members stand proud of an ambient bed that is always there.
 * ==================================================================== */
let rubble = [];

/* The screen window's own overhang, either side, in radians of ring: a body
   is alive a little past the edge so nothing is seen to pop. */
const BAND_MARGIN = 0.16;
/* The roll's reach, off the seats. ROLL_BASE is the sooner-most seat (the
   roll at the sooner end); ROLL_REACH is the angle from there to the
   later-most, documents included, since a paper can be centred too. */
let ROLL_BASE = 0, ROLL_REACH = 0;

function rollRange() {
  ROLL_BASE = 0; ROLL_REACH = 0;
  if (!bodies.length) return;
  let lo = bodies[0].off, hi = bodies[0].off;
  for (const b of bodies) { if (b.off < lo) lo = b.off; if (b.off > hi) hi = b.off; }
  ROLL_BASE = lo; ROLL_REACH = hi - lo;
}

/* u is where along this body's OWN sown arc it lands, 0 at the far end the
   band feeds from and 1 at the edge it retires over. Respawn passes 0. */
function spawn(rk, u) {
  const r = bandRng;
  /* A belt has a core and a fray, not an even slab: radius and height come
     off a peaked distribution, and one body in seven is a stray thrown well
     outside it. That is what stops the population reading as a rectangle of
     confetti and lets the sweep of the ring still be seen through it. */
  const stray = r() < 0.14 ? 1.75 : 1;
  rk.rho = A * (1 + ((r() + r() + r() - 1.5) / 1.5) * RADIAL * stray);
  rk.h = A * ((r() + r() + r() - 1.5) / 1.5) * HFRAC * stray;
  const g = r();
  rk.size = 0.42 + g * g * g * 7.6;
  rk.tone = r() < 0.17 ? 1 : 0;               /* 1 = accent-lit, 0 = ink   */
  rk.alpha = (0.2 + r() * 0.55) / (stray > 1 ? 1.5 : 1);
  rk.rate = Math.pow(A / rk.rho, 0.9) * (0.94 + (rk.h / (A * HFRAC)) * 0.12);
  rk.poly = null;
  if (rk.size > 2.3) {                        /* big enough to have a shape */
    const n = 7, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + r() * 0.5;
      const rr = 0.72 + r() * 0.5;
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.9]);
    }
    rk.poly = pts;
  }
  /* Sown across the arc THIS body can ever be seen on, then stored as the
     ring angle it was BORN at, so the running drift and the belt's roll both
     apply to it at its own rate for the rest of its life. */
  const lo = PHI_R - BAND_MARGIN - ROLL_REACH * rk.rate;
  const hi = PHI_L + BAND_MARGIN;
  rk.phi = lo + u * (hi - lo) - (drift + ROLL_BASE) * rk.rate;
  return rk;
}

function buildBand() {
  rollRange();
  /* Density per arc-length is the constant, not the count: the sky's own
     window keeps exactly the population it had, and the ground the roll adds
     is sown at the same rate. */
  const win = PHI_L - PHI_R + BAND_MARGIN * 2;
  const n = Math.round(((bodies.length ? 2100 : 880) / win) * (win + ROLL_REACH));
  rubble = [];
  for (let i = 0; i < n; i++) rubble.push(spawn({}, bandRng()));
}

/* ==================================================================== *
 * THE ORDER OF THE BELT — direction A: PAPERS, in date order of their item.
 *
 * `bodies` is the flat seat list, one per paper, sorted by `off` — the
 * angular distance along the band from the first paper. Offsets are v4's
 * running sum of gaps, each a function of the days between the two papers'
 * items, so a cluster in the calendar is a cluster in the band; two papers of
 * the same item sit the minimum gap apart, side by side. Nothing ever falls
 * below MIN_GAP, so no two captions can touch.
 *
 * The belt rolls by `roll`; seat i sits at PHI_APEX − warp(off[i] − roll).
 * The berth is held at the wide one always: the seated paper is a card at
 * the apex, every time, so its neighbours always stand clear of it.
 * ==================================================================== */
let household = "lawson", bodies = [], selected = 0, prevSel = 0;
let roll = 0, rollFrom = 0, rollTo = 0, rollT0 = -1, drift = 0, swapTimer = null;
let query = "", matches = new Set(), itemHits = [];
const BERTH_PAPER = BERTH_WIDE;
const SWEEP_PAPER = 66;          /* the clearing a paper sweeps in the band */
/* a paper at rest: round 6's sheet at small size (desk; phone in paperSize) */
const paperSize = () => matchMedia("(max-width: 700px)").matches ? { w: 44, h: 58 } : { w: 56, h: 72 };

/* A caption in the band is an identifier, not the record: a long filename is
   elided in the middle so its extension survives, because ".pdf" is half of
   what tells you what the thing is. The card carries the whole name. */
function shortName(s) {
  return s.length <= 26 ? s : s.slice(0, 14) + "…" + s.slice(-9);
}

function buildBodies() {
  bodies = [];
  if (household !== "lawson") { selected = prevSel = 0; return; }
  let acc = 0, prevDue = null;
  MANIFEST.forEach((it, i) => {
    for (const d of it.docs ?? []) {
      if (prevDue) {
        const gapDays = daysTo(it.due) - daysTo(prevDue);
        const t = 1 - Math.exp(-Math.max(0, gapDays) / GAP_EFOLD);
        acc += (MIN_GAP + (MAX_GAP - MIN_GAP) * t) * GAP_SCALE;
      }
      prevDue = it.due;
      bodies.push({
        kind: "doc", id: d.id, doc: d, item: it, itemIdx: i, off: acc,
        label: shortName(d.name), sub: shortName(it.title),
        sweep: SWEEP_PAPER,
      });
    }
  });
  bodies.sort((a, b) => a.off - b.off);

  bodies.forEach((b, i) => {
    const j = rngFrom(1013 + i * 7919);       /* this paper's own jumble */
    /* The throw, in units: along-band, radial, out-of-plane — v4's, at the
       full weight an item rock had, so the papers scatter as the rocks did. */
    b.jp = (j() * 2 - 1) * J_PHI;
    b.jr = (j() * 2 - 1) * J_RHO;
    b.jh = (j() * 2 - 1) * J_H;
    b.tilt = (j() * 2 - 1) * 7;               /* a sheet lies how it lies */
  });

  /* The default arrival: Service history, the MOT's three-page paper, seated
     at the apex with its neighbours in time around it. */
  selected = prevSel = Math.max(0, bodies.findIndex((b) => b.id === "d-mot-history"));
  roll = rollFrom = rollTo = bodies[selected]?.off ?? 0;
  berthNow = berthFrom = berthTo = berthFit();
}

/* ON A PHONE the card is most of the sky's width, and the wide berth would
   roll the neighbours right off it. There the berth is solved instead, so the
   next paper either way stands just past the card with its sheet's edge in
   the screen: enough to say the belt goes on, and which way to swipe. */
function berthFit() {
  if (!matchMedia("(max-width: 700px)").matches) return BERTH_PAPER;
  const u = MIN_GAP * GAP_SCALE, want = W / 2 - 4;
  let lo = 0, hi = 0.6;
  for (let k = 0; k < 30; k++) {
    const b = (lo + hi) / 2;
    const x = project(PHI_APEX - (u + b * Math.tanh(u / BERTH_K)), A, 0).x - W / 2;
    if (x < want) lo = b; else hi = b;
  }
  return (lo + hi) / 2;
}

/* Where a body actually is at this instant: its seat, plus its jumble, with
   the jumble eased to nothing as it comes into the apex so the card seats on
   the pin exactly. */
function seatAt(i) {
  const u = bodies[i].off - roll;
  const phi0 = PHI_APEX - warp(u);
  const f = clamp01(Math.abs(phi0 - PHI_APEX) / (MIN_GAP * GAP_SCALE * J_FADE));
  const s = f * f * (3 - 2 * f);               /* smoothstep; 0 at the apex */
  const b = bodies[i];
  return {
    phi: phi0 + b.jp * MIN_GAP * GAP_SCALE * s,
    rho: A * (1 + b.jr * s),
    h: A * b.jh * s,
  };
}
const seatPoint = (i) => { const s = seatAt(i); return project(s.phi, s.rho, s.h); };

/* ==================================================================== *
 * The members' pen. DIRECTION A: a paper is a small page — round 6's cream
 * top sheet with the page itself on it, the tilted second sheet under it —
 * and nothing in the band is rock any more except the rubble. The honest
 * states show on the sheet: scanning, removed, undrawable.
 * ==================================================================== */
function drawPaper(g, b) {
  const { w, h } = paperSize(), d = b.doc, st = docState(d);
  const paper = el("g", { class: "paper" });
  paper.appendChild(el("rect", { class: "pp-under", x: -w / 2, y: -h / 2, width: w, height: h, rx: 2.5,
    transform: "rotate(-4) translate(-3 2)" }));
  const top = el("g", { filter: "url(#papershade)" });
  top.appendChild(el("rect", { class: "pp-top", x: -w / 2, y: -h / 2, width: w, height: h, rx: 2.5 }));
  paper.appendChild(top);
  const m = 3.5;                                  /* the sheet's margin, round 6's 9px at this size */
  if (canShow(d)) {
    paper.appendChild(el("rect", { x: -w / 2 + m, y: -h / 2 + m, width: w - 2 * m, height: h - 2 * m, fill: "#fff" }));
    const img = el("image", { x: -w / 2 + m, y: -h / 2 + m, width: w - 2 * m, height: h - 2 * m,
      preserveAspectRatio: "xMidYMin meet" });
    img.setAttribute("href", pageSrc(d, 1));
    paper.appendChild(img);
  } else {
    /* no page to show: the plate's ruled lines, at paper size */
    for (let k = 0; k < 6; k++)
      paper.appendChild(el("rect", { class: "pp-line", x: -w / 2 + 8, y: -h / 2 + 10 + k * (h - 26) / 6,
        width: (w - 16) * (k === 0 ? 0.62 : k % 3 === 2 ? 0.78 : 1), height: 1.2 }));
    if (st === "scanning") {
      const sw = el("rect", { class: "pp-sweep", x: -w / 2 + 3, y: -h / 2 + 4, width: w - 6, height: 1.6, rx: .8 });
      sw.style.setProperty("--sweep-y", (h - 9) + "px");
      paper.appendChild(sw);
    } else if (st === "available") {
      const t = el("text", { class: "pp-word", y: h / 2 - 7 });
      t.textContent = "PDF";
      paper.appendChild(t);
    }
  }
  g.appendChild(paper);
  if (st !== "available") g.classList.add(st === "scanning" ? "scanning" : "removed");
}

function buildSeats() {
  const seats = document.getElementById("seats"), caps = document.getElementById("caps");
  seats.textContent = ""; caps.textContent = "";
  const { w, h } = paperSize();

  bodies.forEach((b, i) => {
    const seat = el("g", { class: "seat" });
    const hit = el("g", { class: "hit", role: "button", tabindex: "0" });
    hit.setAttribute("aria-label", `${b.doc.name}, ${docSpoken(b.doc)}, attached to ${b.item.title}`);
    hit.appendChild(el("rect", { x: -w / 2 - 14, y: -h / 2 - 14, width: w + 28, height: h + 28, fill: "transparent" }));
    hit.appendChild(el("rect", { class: "fring", x: -w / 2 - 9, y: -h / 2 - 9, width: w + 18, height: h + 18, rx: 6,
      stroke: "var(--accent)", "stroke-width": "1.4", "stroke-dasharray": "3 3" }));
    drawPaper(hit, b);
    hit.appendChild(el("rect", { class: "rim", x: -w / 2 - 7, y: -h / 2 - 7, width: w + 14, height: h + 14, rx: 5,
      stroke: "var(--accent)", "stroke-width": "1", opacity: "0" }));
    hit.addEventListener("click", () => centre(i));
    hit.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); centre(i); }
    });
    seat.appendChild(hit); seats.appendChild(seat);

    /* Two lines ride upright beneath the paper — the band's tangent tilts
       the sheet, never the words: the paper's name, then its item. */
    const cap = el("g", { class: "capseat" });
    const name = el("text", { class: "cap-name", y: (h / 2 + 22).toFixed(0) });
    name.textContent = b.label;
    const sub = el("text", { class: "cap-item", y: (h / 2 + 37.5).toFixed(0) });
    sub.textContent = b.sub;
    cap.append(name, sub); caps.appendChild(cap);
  });
}

/* The two end-caps: which way time runs. Quiet, riding the band where it
   leaves the frame, held above its upper edge (#1010, owner 2026-09-16): the
   far corners they used to keep belong to the shared chrome now, and above
   the band is the one side a jumbled body never reaches -- rocks sit in the
   band, their labels hang below it. */
function buildEnds() {
  const ends = document.getElementById("ends");
  ends.textContent = "";
  if (!bodies.length) return;
  const half = (A * RADIAL * COS_I * 2 + A * HFRAC * SIN_I * 2) / 2;
  const clear = half + 25 + 6 + 14;   /* rock r ≤ 25, its ring, breathing room */
  const cs = getComputedStyle(document.documentElement);
  const inS = parseFloat(cs.getPropertyValue("--endcap-inset-start")) || 0;
  const inE = parseFloat(cs.getPropertyValue("--endcap-inset-end")) || 0;
  for (const [x, dir, anchor, text] of
       [[28 + inS, +1, "start", "← sooner"], [W - 28 - inE, -1, "end", "later →"]]) {
    const y = project(phiAtX(x, dir), A, 0).y - clear;
    const t = el("text", { class: "endcap", x, y: y.toFixed(0), "text-anchor": anchor });
    t.textContent = text;
    ends.appendChild(t);
  }
}

/* How solid a body is at this instant of the roll. The paper at the apex is
   NOT drawn: it is the card. Its sheet fades back in as it leaves, and the
   arriving one fades out as the card blooms — v4's "the card rides in the
   belt", now for papers. */
function bodyOpacity(i, p) {
  if (i === selected) return 1 - clamp01((p - 0.32) / 0.34);
  if (i === prevSel) return clamp01((p - 0.1) / 0.42);
  return 1;
}

function paintMembers(p) {
  const seats = document.getElementById("seats").children;
  const caps = document.getElementById("caps").children;
  bodies.forEach((b, i) => {
    const s = seatAt(i);
    const a = project(s.phi, s.rho, s.h), q = project(s.phi + 0.03, s.rho, s.h);
    const ang = Math.atan2(a.y - q.y, a.x - q.x) / RAD;
    /* Rolled round the back of the ring: not on this sky at all. */
    const away = s.phi > PHI_L + 0.2 || s.phi < PHI_R - 0.2;
    /* The search dims, it does not hide: the belt keeps its shape so you can
       see WHERE IN TIME the paper you asked for sits. */
    const lit = !query || matches.has(i);
    let o = bodyOpacity(i, p) * (lit ? 1 : 0.26);
    if (away) o = 0;
    /* a sheet follows the band's lean by half, plus how it happens to lie */
    seats[i].setAttribute("transform",
      `translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${(ang * 0.5 + b.tilt).toFixed(2)})`);
    seats[i].setAttribute("opacity", o.toFixed(3));
    /* The paper at the apex is the card: neither clickable nor tabbable
       while it is being the card, nor is one rolled off the sky. */
    const gone = o < 0.5;
    seats[i].style.pointerEvents = gone ? "none" : "";
    const hit = seats[i].firstChild;
    hit.setAttribute("tabindex", gone ? "-1" : "0");
    hit.setAttribute("aria-hidden", gone ? "true" : "false");
    /* A lit hit wears its rim while the search is open, so matches read as
       matches even before you reach for them. */
    hit.querySelector(".rim").setAttribute("opacity", query && lit ? ".85" : "0");
    caps[i].setAttribute("transform", `translate(${a.x.toFixed(1)},${a.y.toFixed(1)})`);
    /* A caption is words, and half a word is noise: a caption the screen's
       edge would cut is not shown — its sheet still is, leaving the sky. Nor is
       one that would run under the seated card's glass. */
    const hw = Math.max(b.label.length * 6.95, b.sub.length * 6.35) / 2 + 4;
    const cy = a.y + paperSize().h / 2 + 8;
    const cut = (a.x - hw < 0 || a.x + hw > W) ||
      (cardRect && i !== selected && a.x + hw > cardRect.l && a.x - hw < cardRect.r && cy + 34 > cardRect.t && cy < cardRect.b);
    caps[i].setAttribute("opacity", (cut ? 0 : o).toFixed(3));
  });
}

/* ==================================================================== *
 * Painting the band. v2's, unchanged.
 * ==================================================================== */
const bandC = document.getElementById("band"), foreC = document.getElementById("fore");
const bctx = bandC.getContext("2d"), fctx = foreC.getContext("2d");
const hazeCanvas = document.createElement("canvas"), hctx = hazeCanvas.getContext("2d");
let TONE = ["#737e9e", "#d8b45a", "#243259"], hazePts = [], cardRect = null;

let GAIN = 1;
function readTones() {
  const cs = getComputedStyle(document.documentElement);
  TONE = [cs.getPropertyValue("--rubble").trim() || cs.getPropertyValue("--chart-ink").trim(),
          cs.getPropertyValue("--accent").trim(),
          cs.getPropertyValue("--chart-line").trim()];
  /* Dark ink on a printed sky needs more weight than lit stone on a night
     sky to carry the same amount of belt: the packs say how much. */
  GAIN = parseFloat(cs.getPropertyValue("--rubble-gain")) || 1;
}

function sizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const [c, ctx] of [[bandC, bctx], [foreC, fctx]]) {
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + "px"; c.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function buildHaze() {
  hazePts = [];
  for (let k = 0; k <= 80; k++)
    hazePts.push(project(PHI_R + ((PHI_L - PHI_R) * k) / 80, A, 0));
  /* The glow never changes between resizes, and it is by far the most
     expensive thing on the plate, so it is rasterised once and blitted. */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  hazeCanvas.width = Math.round(W * dpr); hazeCanvas.height = Math.round(H * dpr);
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hctx.clearRect(0, 0, W, H);
  paintHaze(hctx);
}

/* The band's body: a broad, soft glow along the ring, fading out at the
   edges of the sky rather than stopping. No hairline track — v1's wire is
   exactly what the owner said a belt is not, and a hard-edged glow is only
   a fatter wire, so the glow is laid down as eighteen near-transparent
   passes of falling width. The profile that builds up has no edge at all;
   the band simply stops being there. */
function paintHaze(ctx) {
  /* Still a gradient, and deliberately: the fade has come out of it (see THE
     EDGE FADE below) but the paint path must not change. Skia carries a
     gradient's premultiplied source at more precision than a flat colour, and
     eighteen passes at globalAlpha 0.0135 are exactly where that shows —
     handing the same colour over as a plain string thins the whole band from
     54/255 to 37/255. So the stops stay; only their alphas go to one. */
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  for (const o of [0, 0.17, 0.83, 1]) grad.addColorStop(o, tint(TONE[2], 1));
  ctx.strokeStyle = grad;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const thick = A * RADIAL * COS_I * 2 + A * HFRAC * SIN_I * 2;
  const passes = 18;
  for (let k = 0; k < passes; k++) {
    const t = k / (passes - 1);
    ctx.globalAlpha = 0.0135;
    ctx.lineWidth = thick * (0.78 - 0.7 * t * t);
    ctx.beginPath();
    hazePts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  fadeEdges(ctx);
}

/* ---- THE EDGE FADE ---------------------------------------------------
   Owner, 2026-08-16: "Why is there still this discoloured box in either
   side? I asked for the discolouration to be removed. Though, you could try
   instead fading the edge to nothing instead.. that might work well."

   The fade to nothing was always meant to be there, but it lived INSIDE the
   stroke, as an alpha ramp on the stroke's own gradient — and that is what
   drew the box. Each of the eighteen passes goes down at globalAlpha
   0.0135, so inside the ramp a pass carries 0.0135 x g, and an 8-bit canvas
   cannot hold a number that small: below g = 0.145 every pass rounds to
   nothing at all, and just above it every pass rounds to exactly 1/255. So
   the wash switched on at a dead-straight vertical line and then sat at a
   flat 18/255 for the next fifty-odd pixels before the next quantisation
   step could land — a rectangular slab of even tone with a hard edge onto
   pure sky. Measured on both flanks at every viewport: at 1280 wide, alpha
   0 out to x=31, 8 at x=32, then 18 flat from x=34 to x=87.

   So the fade comes out of the stroke and is applied ONCE, to the finished
   wash, as a destination-out mask. The passes now accumulate at full weight
   everywhere, which leaves the middle of the band bit-for-bit what it was,
   and the mask then scales an alpha of ~50 instead of one of ~1: it has
   fifty steps to spend on the ramp instead of two, so it reads as a fade
   rather than a slab. It runs on a smoothstep, so even the first step is
   sub-quantum, and it reaches solid a little INSIDE every bound of the
   canvas — the glow is already nothing before there is any edge for it to
   stop at. All four sides, because a short sky clips the wash top and
   bottom exactly the way a narrow one clips it left and right.

   The rubble is NOT masked. The bodies go on drifting out past the glow and
   off the world on their own longer fade (fadeIn, below), which is what
   makes the belt leave the sky instead of ending. */
const EDGE_IN = 0.012;      /* the wash is already nothing this far in    */
const EDGE_X = 0.17;        /* ...and at full weight by here. v2's figure */
const EDGE_Y = 0.10;        /* the sky is shorter than it is wide         */
const EDGE_STOPS = 24;      /* enough to read as a curve, not a polyline  */

function fadeEdges(ctx) {
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  for (const [across, fade] of [[true, EDGE_X], [false, EDGE_Y]]) {
    const g = across ? ctx.createLinearGradient(0, 0, W, 0)
                     : ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,1)");
    for (let i = 0; i <= EDGE_STOPS; i++) {
      const u = i / EDGE_STOPS;
      const o = EDGE_IN + (fade - EDGE_IN) * u;
      const e = (1 - u * u * (3 - 2 * u)).toFixed(4);   /* 1 - smoothstep */
      g.addColorStop(o, `rgba(0,0,0,${e})`);
      g.addColorStop(1 - o, `rgba(0,0,0,${e})`);
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function tint(col, a) {
  if (col.startsWith("rgba")) return col.replace(/[\d.]+\)$/, a + ")");
  if (col.startsWith("rgb")) return col.replace("rgb(", "rgba(").replace(")", `,${a})`);
  const h = col.replace("#", "");
  const n = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const v = parseInt(n, 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
}

function paintBand() {
  bctx.clearRect(0, 0, W, H); fctx.clearRect(0, 0, W, H);
  bctx.drawImage(hazeCanvas, 0, 0, W, H);

  /* Every member's swept neighbourhood — fourteen of them now, a chain of
     clearings down the band — plus the card's own footprint, because the
     card is a body in the band too and nothing sits on top of it. A paper
     still folded inside its item has swept nothing. */
  const clears = [];
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    const c = seatPoint(i);
    if (c.x > -SWEEP && c.x < W + SWEEP) clears.push([c, b.sweep]);
  }
  const hMax = A * HFRAC;
  const foreCut = hMax * 0.58;   /* above this, a body passes in FRONT */
  const fadeIn = 0.14 * W;   /* the belt leaves the sky, it does not stop */

  for (const rk of rubble) {
    /* Retirement is judged in BAND coordinates — at the sooner end of the
       roll, the one frame the belt cannot move — so a body is only ever
       rebuilt when it has left the arc for good, not merely when the current
       roll has carried it off this particular screen. It re-enters at the
       far end of the widened arc, freshly made: never a loop. */
    const band = rk.phi + (drift + ROLL_BASE) * rk.rate;
    if (band > PHI_L + BAND_MARGIN) { spawn(rk, 0); continue; }
    const phi = band + (roll - ROLL_BASE) * rk.rate;
    /* Sown far wider than one sky, so most of the bed is over the horizon at
       any one roll: cost it out before projecting it. */
    if (phi < PHI_R - BAND_MARGIN || phi > PHI_L + BAND_MARGIN) continue;
    const p = project(phi, rk.rho, rk.h);
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) continue;

    /* depth: the arc's ends lean toward you, and height above the plane
       brings a body forward. Near bodies are bigger, brighter, quicker. */
    const dn = clamp01(0.5 + (p.d / (A * 0.62)) * 0.9);
    let a = rk.alpha * (0.55 + dn * 0.75) * GAIN;
    const s = rk.size * (0.78 + dn * 0.5);

    a *= Math.min(1, p.x / fadeIn) * Math.min(1, (W - p.x) / fadeIn);
    for (const [c, sw] of clears) {
      if (Math.abs(p.x - c.x) > sw || Math.abs(p.y - c.y) > sw) continue;
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < sw) a *= clamp01((d - sw * 0.45) / (sw * 0.55));
    }
    if (a <= 0.012) continue;

    /* Bodies riding high above the ring plane pass in FRONT of the card:
       the card is IN the belt, so some of the belt is between it and you.
       Dimmed, and dimmed again over the card, so it never fights the text. */
    const front = rk.h > foreCut && rk.size < 5.6;
    const ctx = front ? fctx : bctx;
    if (front) {
      a *= 0.8;
      if (cardRect && p.x > cardRect.l && p.x < cardRect.r && p.y > cardRect.t && p.y < cardRect.b)
        a *= 0.85;
    }
    ctx.globalAlpha = Math.min(a, 0.95);
    ctx.fillStyle = TONE[rk.tone];
    if (rk.poly) {
      ctx.beginPath();
      rk.poly.forEach(([px, py], i) =>
        i ? ctx.lineTo(p.x + px * s, p.y + py * s) : ctx.moveTo(p.x + px * s, p.y + py * s));
      ctx.closePath(); ctx.fill();
      if (s > 4) {           /* a lit edge on the biggest rubble only */
        ctx.globalAlpha = Math.min(a * 0.5, 0.4);
        ctx.strokeStyle = TONE[1]; ctx.lineWidth = 0.7; ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 6.2832); ctx.fill();
    }
  }
  bctx.globalAlpha = 1; fctx.globalAlpha = 1;
}

/* ==================================================================== *
 * The roll — one motion, 420ms, v2's choreography exactly:
 *
 *   0ms    the belt starts turning. The card, which IS the apex body,
 *          leaves with it: it slides along the band in the direction of
 *          travel (dipping as the band dips away from the apex), shrinking
 *          toward body size and fading — collapsing back into its rock. The
 *          outgoing item's papers fold back into it over the first 170ms.
 *   ~190ms the rock it collapsed into has faded up at the seat the card
 *          slid toward; the card's content swaps out of sight.
 *   190ms  the arriving body's rock is gone and the new card blooms out of
 *          it, riding IN from the opposite side along the band. The berth
 *          has been widening the whole way if the arriving item has papers.
 *   ~240ms the arriving item's papers unfold into the berth beside it.
 *   420ms  the belt settles; the card is seated at the apex — the arriving
 *          body's jumble having eased out to nothing on the way in, so it
 *          lands on the pin and not near it.
 *
 * Under reduced motion the same thing happens with no tween: the belt is
 * simply already turned, the card is simply already the new one, and the
 * papers are simply already out.
 * ==================================================================== */
const bez = (p1x, p1y, p2x, p2y) => (t) => {
  let lo = 0, hi = 1, u = t;
  const bx = (u) => 3 * (1 - u) * (1 - u) * u * p1x + 3 * (1 - u) * u * u * p2x + u * u * u;
  for (let i = 0; i < 22; i++) { const x = bx(u); if (x < t) lo = u; else hi = u; u = (lo + hi) / 2; }
  return 3 * (1 - u) * (1 - u) * u * p1y + 3 * (1 - u) * u * u * p2y + u * u * u;
};
const ease = bez(0.32, 0.72, 0.26, 1);

function centre(i) {
  if (i < 0 || i >= bodies.length || i === selected) return;
  if (rdOpen) closeReader(false);
  const dir = Math.sign(bodies[i].off - bodies[selected].off) || 1;
  prevSel = selected; selected = i;
  rollFrom = roll; rollTo = bodies[selected].off; rollT0 = performance.now();
  sceneName = null;
  syncDemos();

  const wrap = document.getElementById("cardwrap");
  clearTimeout(swapTimer);
  if (reduced()) {
    roll = rollTo; rollT0 = -1;
    renderCard(); paintMembers(1); measureCard(); paintBand();
    return;
  }
  /* The card leaves the apex the way the belt leaves it: along the band. */
  const outDx = dir > 0 ? -300 : 300, outDy = dir > 0 ? DIP_L : DIP_R;
  wrap.classList.remove("rollin", "rollpre");
  wrap.classList.add("rollout");
  wrap.style.setProperty("--cdx", outDx + "px");
  wrap.style.setProperty("--cdy", outDy.toFixed(1) + "px");
  wrap.style.setProperty("--csc", "0.5");
  swapTimer = setTimeout(() => {
    renderCard();
    wrap.classList.remove("rollout");
    wrap.classList.add("rollpre");
    wrap.style.setProperty("--cdx", (dir > 0 ? 300 : -300) + "px");
    wrap.style.setProperty("--cdy", (dir > 0 ? DIP_R : DIP_L).toFixed(1) + "px");
    void wrap.offsetWidth;                       /* commit the pre-state */
    wrap.classList.remove("rollpre");
    wrap.classList.add("rollin");
    wrap.style.removeProperty("opacity");
    wrap.style.setProperty("--cdx", "0px");
    wrap.style.setProperty("--cdy", "0px");
    wrap.style.setProperty("--csc", "1");
    setTimeout(measureCard, 240);
  }, 190);
}
function centreById(id) {
  const i = bodies.findIndex((b) => b.id === id);
  if (i >= 0) centre(i);
}

/* Arriving from elsewhere — a document row's `open on the belt →` in home's
   drawer (direction B), a link in a reminder. There is no navigation to
   play: the page is simply already showing that paper seated at the apex,
   with its neighbours in time around it. Same code path a fresh load takes;
   the demo button only proves it. */
function arriveAt(id, opts = {}) {
  const i = bodies.findIndex((b) => b.id === id);
  if (i < 0) return;
  if (rdOpen) closeReader(false);
  clearTimeout(swapTimer);
  selected = prevSel = i; rollT0 = -1;
  roll = rollFrom = rollTo = bodies[i].off;
  const wrap = document.getElementById("cardwrap");
  wrap.classList.remove("rollout", "rollin", "rollpre");
  wrap.style.removeProperty("opacity");
  wrap.style.setProperty("--cdx", "0px"); wrap.style.setProperty("--cdy", "0px");
  wrap.style.setProperty("--csc", "1");
  renderCard(opts); syncDemos(); paintMembers(1); measureCard(); paintBand();
}

/* ==================================================================== *
 * What the apex displays — DIRECTION A: the seated paper, as round 6's
 * preview card, unchanged: the page nearly edge to edge, `1 of 3` with an
 * arrow only where there is a page that way, the honest states held still.
 * Pressing the page opens the reader. Under the card, one link to the item
 * on home, and nothing else about the item: no fields, no edit, snooze,
 * complete, attach or retire — those live in home's drawer now.
 * ==================================================================== */
function renderCard(opts = {}) {
  const wrap = document.getElementById("cardwrap");
  clearTimeout(landTimer);
  if (!bodies.length) {
    /* The empty household. The band is still a belt — ambient rock and dust,
       thinner, because nothing here has swept anything yet. */
    sheetDoc = null; sheetIdx = -1; rc = null;
    wrap.innerHTML = `
      <article class="glass item-card">
        <h2>No papers in orbit yet</h2>
        <div class="sub">Lawson Home · nothing attached</div>
        <div class="note">the belt holds your household's papers, each riding where its item
          comes due — sooner to the left, later to the right — and the one you are looking at
          sits at the apex as its page. attach a document to an item on home and it takes
          its seat here.</div>
      </article>
      <a class="back openitem" href="../../home.html" aria-label="Open home">open home →</a>`;
    fitPreview();
    return;
  }
  const b = bodies[selected];
  sheetDoc = b.doc; sheetIdx = selected;
  sheetPage = opts.page ?? 1; armed = false;
  holdFocus = !!opts.hold; wantReader = opts.reader ?? null;
  wrap.innerHTML = `
    <aside class="glass readcard" id="readcard" role="group" tabindex="-1"></aside>
    <a class="back openitem" href="../../home.html#${b.item.id}" aria-label="Open ${b.item.title} on home">open the item →</a>`;
  rc = wrap.querySelector(".readcard");
  const d = b.doc;
  if (!canShow(d)) { paintSheet("still"); return; }
  /* a page already drawn once lands at once; a new one focuses first, as
     round 6's preview does, for no less than a beat */
  if (!holdFocus && landed.has(pageSrc(d, sheetPage))) {
    paintSheet("snap");
    if (wantReader) { const z = wantReader; wantReader = null; openReader(z); }
    return;
  }
  paintSheet("focus");
  if (!holdFocus) landPage();
}

/* The card hangs at the apex as the item card did (34% down its height) and
   must stay clear of the search above and the rail below: the page takes
   whatever height that leaves, in its own proportions, and the card's width
   follows the page. */
function fitPreview() {
  const wrap = document.getElementById("cardwrap");
  const phone = matchMedia("(max-width: 700px)").matches;
  const maxW = Math.min(480, W - (phone ? 64 : 56));   /* a phone keeps its edges for the neighbours */
  const img = rc?.querySelector(".sheet img");
  if (!rc || !rc.classList.contains("snap") || !img) {
    wrap.style.width = Math.min(maxW, 380) + "px";
    return;
  }
  if (!img.complete || !img.naturalWidth) { img.addEventListener("load", fitPreview, { once: true }); return; }
  const topM = phone ? 122 : 78, botM = phone ? 58 : 66;
  const hMax = Math.min((APEX_Y - topM) / 0.34, (H - botM - APEX_Y) / 0.66);
  const aspect = img.naturalHeight / img.naturalWidth;
  const box = rc.querySelector(".pagebox");
  wrap.style.width = maxW + "px";
  box.style.setProperty("--page-h", "120px");
  const chrome = wrap.offsetHeight - img.offsetHeight;          /* everything that is not the page */
  const sheet = rc.querySelector(".sheet");
  const side = (rc.offsetWidth - box.clientWidth) + (sheet.offsetWidth - img.offsetWidth);   /* card padding and border, sheet padding */
  let pageH = Math.floor(hMax - chrome);
  let pageW = pageH / aspect;
  if (pageW + side > maxW) { pageW = maxW - side; pageH = Math.floor(pageW * aspect); }
  box.style.setProperty("--page-h", Math.max(120, pageH) + "px");
  wrap.style.width = Math.max(240, Math.ceil(pageW + side)) + "px";
}

function measureCard() {
  const r = document.getElementById("cardwrap").getBoundingClientRect();
  cardRect = { l: r.left, r: r.right, t: r.top, b: r.bottom };
}

/* ==================================================================== *
 * THE SEARCH BOX — home's, shared (#1304). One field, one palette, one
 * matcher. A paper matches on its name, its item's title, section and
 * provider; an item matches on title, section, kind and provider. A paper
 * row seats that paper on the belt; an item row goes to that item's drawer
 * on home. The belt still dims what does not match rather than hiding it.
 * ==================================================================== */
function paperHay(b) {
  return [b.doc.name, b.item.title, b.item.section, b.item.provider ?? "", "document"].join(" ").toLowerCase();
}
function itemHay(it) {
  return [it.title, it.section, it.kind, it.provider ?? ""].join(" ").toLowerCase();
}
function runSearch(q) {
  query = q.trim().toLowerCase();
  matches = new Set(); itemHits = [];
  if (query && bodies.length) {
    bodies.forEach((b, i) => { if (paperHay(b).includes(query)) matches.add(i); });
    for (const it of MANIFEST) if (itemHay(it).includes(query)) itemHits.push(it);
  }
  renderPalette();
  paintMembers(rollT0 < 0 ? 1 : 0);
}
/* the nearest paper hit ALONG THE BELT: the belt turns the shortest way */
function nearestMatch() {
  let best = -1, bestD = Infinity;
  for (const i of matches) {
    const d = Math.abs(bodies[i].off - bodies[selected].off);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}
function renderPalette() {
  const pal = document.getElementById("palette");
  pal.textContent = "";
  if (!query) { pal.classList.remove("open"); return; }
  const row = (html, go) => {
    const r = document.createElement("div");
    r.innerHTML = html;
    r.addEventListener("mousedown", (e) => e.preventDefault());
    r.addEventListener("click", go);
    pal.appendChild(r);
  };
  const papers = [...matches].sort((a, b) => Math.abs(bodies[a].off - bodies[selected].off) - Math.abs(bodies[b].off - bodies[selected].off));
  for (const i of papers.slice(0, 5))
    row(`<b>${bodies[i].doc.name}</b> <small>· ${bodies[i].item.title}</small>`, () => { exploreEl.blur(); arriveOrRoll(i); });
  for (const it of itemHits.slice(0, 3))
    row(`<b>${it.title}</b> <small>· on home</small>`, () => toast(`would open ${it.title} on home`));
  if (!papers.length && !itemHits.length) row(`nothing by that name`, () => {});
  pal.classList.toggle("open", document.activeElement === exploreEl);
}
/* home.html's, with one guard: an empty field has nothing to list */
function openPalette(open) {
  document.getElementById("palette").classList.toggle("open", open && !!query);
}
function arriveOrRoll(i) { if (i === selected) return; centre(i); }
let toastTimer = 0;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2400);
}

function syncDemos() {
  const ends = { "c-first": bodies[0]?.id, "c-docs": "d-mot-history", "c-last": bodies[bodies.length - 1]?.id };
  for (const [btn, id] of Object.entries(ends)) {
    const b = document.getElementById(btn);
    b.setAttribute("aria-pressed", String(!!id && bodies[selected]?.id === id && !sceneName));
    b.disabled = !bodies.some((x) => x.id === id);
    b.style.opacity = b.disabled ? ".38" : "1";
  }
  for (const [name, sc] of Object.entries(SCENES)) {
    const b = document.getElementById("d-" + name);
    if (!b) continue;
    b.setAttribute("aria-pressed", String(sceneName === name));
    b.disabled = !bodies.some((x) => x.id === sc.id);
    b.style.opacity = b.disabled ? ".38" : "1";
  }
}

/* ==================================================================== *
 * The loop. The rubble drifts; the members do not — they are the
 * instrument, held at their seats the way §14 holds the dial's
 * constellations still because there they mean something. Everything else in
 * this sky is scenery, and scenery moves.
 * ==================================================================== */
let last = 0, lastPaint = 0;
function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.08) : 0;
  last = now;
  const rolling = rollT0 >= 0;
  if (rolling) {
    const p = clamp01((now - rollT0) / GLIDE);
    const e = ease(p);
    roll = rollFrom + (rollTo - rollFrom) * e;
    berthNow = berthFrom + (berthTo - berthFrom) * e;
    paintMembers(p);
    if (p >= 1) rollT0 = -1;
  }
  drift += DRIFT * dt;
  /* The roll gets every frame it can have. The idle drift is fifteen pixels
     a second and does not: repainting a full-width plate under the card's
     backdrop blur sixty times a second to move it a quarter of a pixel is
     work nobody can see. */
  if (rolling || now - lastPaint > 30) { paintBand(); lastPaint = now; }
  requestAnimationFrame(frame);
}

function layout() {
  const wasSel = bodies[selected]?.id;
  computeGeometry();
  buildBodies();                    /* GAP_SCALE may have moved with W */
  if (wasSel) {
    const i = bodies.findIndex((b) => b.id === wasSel);
    if (i >= 0) selected = prevSel = i;
  }
  buildSeats();
  sizeCanvas(); readTones(); buildHaze(); buildBand();
  if (rollT0 < 0) roll = rollFrom = rollTo = bodies[selected]?.off ?? 0;
  document.getElementById("members").setAttribute("viewBox", `0 0 ${W} ${H}`);
  buildEnds();
  const wrap = document.getElementById("cardwrap");
  wrap.style.top = APEX_Y + "px";
  /* the card is only re-made when what it should show has changed; a
     resize simply refits the page it already holds */
  if (!wrap.firstElementChild || sheetDoc !== (bodies[selected]?.doc ?? null)) renderCard();
  else fitPreview();
  runSearch(exploreEl.value); syncDemos();
  paintMembers(rollT0 < 0 ? 1 : 0);
  measureCard(); paintBand();
}

function setHousehold(which) {
  household = which;
  document.getElementById("b-full").setAttribute("aria-pressed", String(which === "lawson"));
  document.getElementById("b-empty").setAttribute("aria-pressed", String(which === "empty"));
  exploreEl.value = "";
  query = ""; matches = new Set(); itemHits = [];
  if (rdOpen) closeReader(false);
  sceneName = null;
  const wrap = document.getElementById("cardwrap");
  wrap.classList.remove("rollout", "rollin", "rollpre");
  wrap.style.removeProperty("opacity");
  wrap.style.setProperty("--cdx", "0px"); wrap.style.setProperty("--cdy", "0px");
  wrap.style.setProperty("--csc", "1");
  bodies = []; sheetDoc = null; wrap.textContent = "";
  buildBodies(); layout();
}
function setSwatch(name, btn) {
  document.documentElement.setAttribute("data-theme", name);
  for (const b of btn.parentElement.querySelectorAll(".sw"))
    b.setAttribute("aria-pressed", String(b === btn));
  requestAnimationFrame(() => { readTones(); buildHaze(); paintBand(); });
}
/* ---- keyboard --------------------------------------------------------
   ← and → walk the belt from paper to paper in date order, which is its
   whole grammar. The seated paper's pages turn with PageUp and PageDown
   (and its own arrows); inside the reader ← and → turn pages, as round 6's
   reader does. Inside the search field the arrows belong to the caret;
   there, enter seats the nearest paper hit and escape gives the belt back. */
function stepBy(d) {
  const next = selected + d;
  if (next >= 0 && next < bodies.length) centre(next);
}
const exploreEl = document.getElementById("explore");
exploreEl.addEventListener("input", (e) => runSearch(e.target.value));
exploreEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const i = nearestMatch();
    if (i >= 0) { exploreEl.blur(); arriveOrRoll(i); }
    else if (itemHits.length) toast(`would open ${itemHits[0].title} on home`);
  }
  if (e.key === "Escape") {
    e.preventDefault();
    if (exploreEl.value) { exploreEl.value = ""; runSearch(""); } else exploreEl.blur();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target === exploreEl || rdOpen) return;     /* the reader has the keys (below) */
  if (e.key === "ArrowLeft") { e.preventDefault(); stepBy(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); stepBy(1); }
  if (sheetDoc && (e.key === "PageUp" || e.key === "PageDown")) {
    e.preventDefault(); turnTo(sheetPage + (e.key === "PageDown" ? 1 : -1));
  }
  if (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key === "k")) {
    e.preventDefault(); exploreEl.focus(); exploreEl.select();
  }
});
window.addEventListener("resize", layout);

/* The item screen's own sky: the shared generator's seed and layers. */
(function stars() {
  const far = document.getElementById("fartile"), near = document.getElementById("neartile");
  const rng = rngFrom(17170812);
  for (const [tile, n, rMin, rSpan, oMin, oSpan] of
       [[far, 95, 0.4, 0.5, 0.12, 0.23], [near, 46, 0.8, 0.7, 0.3, 0.4]]) {
    for (let i = 0; i < n; i++) {
      tile.appendChild(el("circle", {
        cx: (rng() * 1600).toFixed(1), cy: (rng() * 1000).toFixed(1),
        r: (rMin + rng() * rSpan).toFixed(2),
        opacity: (oMin + rng() * oSpan).toFixed(2),
      }));
    }
  }
})();

/* ==================================================================== *
 * ROUND 6 (#1059, #1054), carried: the preview and the reader. What
 * direction A changes is only where the preview lives — at the apex, as
 * the seated paper — so the lanes, the side-of-the-paper logic and the
 * dead-space close are gone with the item card they sat beside.
 * ==================================================================== */
const PAGES = "../../document-card/round-1/pages/";   /* the round-1 renders, reused */
const A4_W = 794;                            /* an A4 page at 96 dpi, CSS px: "100%" */
const docState = (d) => d.state ?? "available";
const canShow = (d) => docState(d) === "available" && !!d.pages && (!!d.file || !!d.gen) && d.render !== "failed";
const pageSrc = (d, n) => d.gen ? genPages(d)[n - 1] : `${PAGES}${d.file}-${n}.png`;
const landed = new Set();                    /* page images already drawn once */

/* the five new papers' pages, drawn once and kept (see GEN_SPEC) */
const GEN = {};
function genPages(d) {
  if (GEN[d.id]) return GEN[d.id];
  const g = GEN_SPEC[d.gen], out = [];
  const W0 = 847, H0 = 1197, L = 81, R = 766, sans = "Helvetica, Arial, sans-serif";
  g.pages.forEach((P, k) => {
    const c = document.createElement("canvas"); c.width = W0; c.height = H0;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W0, H0);
    let y;
    if (k === 0) {
      x.fillStyle = g.band; x.fillRect(0, 0, W0, 120);
      x.fillStyle = "#fff"; x.font = `600 23px ${sans}`; x.letterSpacing = "0.5px";
      x.fillText(g.title, L, 62);
      x.font = `12px ${sans}`; x.globalAlpha = .82; x.letterSpacing = "0.6px";
      x.fillText(g.sub, L, 85); x.globalAlpha = 1;
      y = 152;
      if (g.stamp) {
        const [word, col, line] = g.stamp;
        x.strokeStyle = col; x.lineWidth = 2.5; x.strokeRect(L, y, 150, 56);
        x.fillStyle = col; x.font = `600 25px ${sans}`; x.letterSpacing = "5px";
        x.textAlign = "center"; x.fillText(word, L + 75, y + 37); x.textAlign = "left";
        x.fillStyle = "#555"; x.font = `11px ${sans}`; x.letterSpacing = "0px";
        x.fillText(line, L + 174, y + 24);
        y += 90;
      } else y += 8;
    } else {
      x.fillStyle = g.band; x.font = `600 14px ${sans}`; x.letterSpacing = "0.5px";
      x.fillText(`${g.title} — continued`, L, 76);
      x.fillStyle = "#d6d6d6"; x.fillRect(L, 92, R - L, 1);
      y = 126;
    }
    /* the table: two columns, label left in the band's colour, value right */
    x.letterSpacing = "0px";
    const half = Math.ceil(P.kv.length / 2), colW = (R - L - 40) / 2;
    P.kv.forEach(([lab, val], n) => {
      const col = n < half ? 0 : 1, row = n < half ? n : n - half;
      const cx = L + col * (colW + 40), cy = y + row * 39;
      x.fillStyle = g.band; x.font = `600 11.5px ${sans}`; x.fillText(lab, cx, cy + 16);
      x.fillStyle = "#222"; x.font = `11.5px ${sans}`; x.textAlign = "right";
      x.fillText(val, cx + colW, cy + 16); x.textAlign = "left";
      x.fillStyle = "#d6d6d6"; x.fillRect(cx, cy + 34, colW, 1);
    });
    y += half * 39 + 36;
    for (const [head, lines] of P.sections) {
      x.fillStyle = g.band; x.font = `600 12px ${sans}`; x.letterSpacing = "2.4px";
      x.fillText(head.toUpperCase(), L, y); x.letterSpacing = "0px";
      y += 24;
      x.fillStyle = "#333"; x.font = `11px ${sans}`;
      for (const ln of lines) { x.fillText("•", L + 6, y); x.fillText(ln, L + 20, y); y += 18; }
      y += 22;
    }
    x.fillStyle = "#d6d6d6"; x.fillRect(L, 1115, R - L, 1);
    x.fillStyle = "#8a8a8a"; x.font = `9.5px ${sans}`;
    x.fillText(`${g.foot} · page ${k + 1} of ${g.pages.length}`, L, 1137);
    out.push(c.toDataURL("image/png"));
  });
  return (GEN[d.id] = out);
}

function docSpoken(d) {
  const st = docState(d);
  if (st === "scanning") return "still being scanned";
  if (st === "pending_deletion") return `removed, kept until ${d.gone}`;
  if (!canShow(d)) return `${d.size}, Orbit could not draw a page of it`;
  return `${d.size}, ${d.pages === 1 ? "one page" : d.pages + " pages"}`;
}
const PLATE_LABEL = { scanning: "still scanning", pending_deletion: "being removed" };

/* The scenes the round has to prove, reachable from the rail and from
   ?scene= for the captures. */
const SCENES = {
  rest: { id: "d-mot-history" },
  focusing: { id: "d-mot-history", hold: true },
  scanning: { id: "d-carins-renewal" },
  removed: { id: "d-tyres-invoice" },
  undrawable: { id: "d-homeins-schedule" },
  reading: { id: "d-mot-history", reader: "fit" },
  zoom: { id: "d-mot-history", page: 2, reader: 1.5 },
  search: { id: "d-mot-history", query: "mot" },
};
let sceneName = null;
function showScene(name) {
  const sc = SCENES[name];
  if (!sc || !bodies.some((b) => b.id === sc.id)) return;
  exploreEl.value = ""; runSearch("");
  if (rdOpen) closeReader(false);
  arriveAt(sc.id, { page: sc.page ?? 1, hold: !!sc.hold, reader: sc.reader });
  sceneName = name;
  if (sc.query) {
    exploreEl.value = sc.query; exploreEl.focus(); runSearch(sc.query);
    document.getElementById("palette").classList.add("open");
  }
  syncDemos();
}

/* ---- the seated paper ------------------------------------------------ */
let sheetDoc = null, sheetIdx = -1, sheetPage = 1;
let landTimer = 0, armTimer = 0, armed = false, holdFocus = false, wantReader = null;
let rc = null;                               /* the preview card, re-made with each seat */

/* create-v3's walk: the line breathes until the page has actually landed —
   the image is loaded — and for no less than a beat, so it never flickers. */
function landPage() {
  clearTimeout(landTimer);
  const d = sheetDoc, src = pageSrc(d, sheetPage);
  const img = new Image();
  let loaded = false, beat = false;
  const go = () => {
    if (!(loaded && beat && sheetDoc === d && !holdFocus)) return;
    landed.add(src);
    paintSheet("snap");
    if (wantReader) { const z = wantReader; wantReader = null; openReader(z); }
  };
  img.onload = () => { loaded = true; go(); };
  img.src = src;
  landTimer = setTimeout(() => { beat = true; go(); }, reduced() ? 0 : 900);
}

/* THE PREVIEW'S FOOT. A page number, and an arrow each way only when there
   is a page that way. The honest states put their one word here instead:
   restore for a removed file, download for one Orbit could not draw,
   nothing while scanning (the line above says so). Everything else
   — file, size, zoom, remove — lives on the reader's bar. ← and → walk the
   belt now, so the preview's own arrows answer to PageUp and PageDown. */
function pager(d) {
  const n = d.pages ?? 0;
  const back = sheetPage > 1, fwd = sheetPage < n;
  return `<div class="pager">
      <button class="pg${back ? "" : " none"}" onclick="turnTo(sheetPage-1)" aria-label="Previous page" title="PageUp" ${back ? "" : "tabindex=-1 aria-hidden=true"}>←</button>
      <span class="pgn" aria-live="polite">${sheetPage} of ${n}</span>
      <button class="pg${fwd ? "" : " none"}" onclick="turnTo(sheetPage+1)" aria-label="Next page" title="PageDown" ${fwd ? "" : "tabindex=-1 aria-hidden=true"}>→</button>
    </div>`;
}
function previewFoot(d, mode) {
  const st = docState(d);
  /* the focus line above already says what is happening; the foot holds
     only what can be done about it */
  if (st === "scanning") return `<div class="pager"></div>`;
  if (st === "pending_deletion")
    return `<div class="pager"><button type="button" class="quiet" onclick="restoreDoc('${d.id}')" aria-label="Restore ${d.name}">restore</button></div>`;
  if (!canShow(d))
    return `<div class="pager"><a class="quiet" href="#" onclick="return false" aria-label="Download ${d.name}">download</a></div>`;
  if (mode !== "snap") return `<div class="pager"><span class="pgn">…</span></div>`;
  return pager(d);
}
/* THE READER'S BAR: pages at the head, zoom in the middle, the quiet words
   at the tail — download, and the two-press remove (#1054). */
function readerBar(d) {
  const z = rdZoom, v = rdZoomVal();
  /* the item card's own action pills (owner, round 6: louder now they have
     moved here from the preview) — download in the accent, remove in the
     overdue tone as the card's retire is; armed, remove fills */
  const words = armed
    ? `<button type="button" class="rm armed" style="--act:var(--overdue)" onclick="armRemove()" aria-label="Remove ${d.name}: press again to confirm">tap again to remove</button>`
    : `<a href="#" style="--act:var(--accent)" onclick="return false" aria-label="Download ${d.name}">download</a>
       <button type="button" class="rm" style="--act:var(--overdue)" onclick="armRemove()" aria-label="Remove ${d.name}">remove</button>`;
  return `<span class="pgn" aria-live="polite">${sheetPage} of ${d.pages}</span>
      <span class="words acts">${words}</span>`;
}
function readerZoom() {
  const z = rdZoom, v = rdZoomVal();
  return `<span class="zoom" role="group" aria-label="Zoom">
        <button class="quiet" onclick="setZoom('fit')" aria-pressed="${z === "fit"}" title="0">fit</button>
        <button class="quiet" onclick="setZoom(zoomStep(-1))" aria-label="Smaller" title="− or ctrl+wheel" ${z === "fit" ? "disabled" : ""}>−</button>
        <span class="pct" aria-live="polite">${Math.round(v * 100)}%</span>
        <button class="quiet" onclick="setZoom(zoomStep(1))" aria-label="Larger" title="+ or ctrl+wheel" ${v >= 4 ? "disabled" : ""}>+</button>
      </span>`;
}
/* the arrows either side of the page: shown only where there is a page that way */
function paintArrows() {
  const n = sheetDoc?.pages ?? 0;
  document.getElementById("rd-prev").classList.toggle("none", !(sheetPage > 1));
  document.getElementById("rd-next").classList.toggle("none", !(sheetPage < n));
}
const RETICLE = `<svg class="reticle" viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="43" fill="none" stroke="var(--chart-line)" stroke-width="1" stroke-dasharray="3 7" opacity=".8"/>
          <g class="sweep">
            <line x1="48" y1="5" x2="48" y2="14" stroke="var(--accent)" stroke-width="1.2" opacity=".8"/>
            <line x1="48" y1="82" x2="48" y2="91" stroke="var(--accent)" stroke-width="1.2" opacity=".35"/>
          </g>
          <g class="pull" fill="none" stroke="var(--accent)" stroke-width="1.1" opacity=".7">
            <path d="M 26 18 H 18 V 26"/><path d="M 70 18 H 78 V 26"/>
            <path d="M 26 78 H 18 V 70"/><path d="M 70 78 H 78 V 70"/>
          </g>
          <circle cx="48" cy="48" r="16" fill="none" stroke="var(--chart-line)" stroke-width="1" opacity=".9"/>
          <circle cx="48" cy="48" r="1.8" fill="var(--accent)"/>
        </svg>`;
/* the focus block: create-v3's while the page is on its way; the three
   honest states say their line once, reticle at rest */
function focusBlock(d, mode) {
  const st = docState(d);
  if (mode === "focus")
    return `<div class="focus">${RETICLE}
        <div class="focusline">Focusing on the anomaly</div>
        <div class="why">orbit is drawing page ${sheetPage} of the file it holds<br>nothing is changed, and nothing is assumed</div>
      </div>`;
  if (st === "scanning")
    return `<div class="focus"><div class="plate scanning" aria-hidden="true">${PLATE_LABEL[st]}</div>
        <div class="focusline">Still scanning this file</div>
        <div class="why">the page and the download come once it scans clean<br>nothing is assumed</div>
      </div>`;
  if (st === "pending_deletion")
    return `<div class="focus"><div class="plate removed" aria-hidden="true">${PLATE_LABEL[st]}</div>
        <div class="focusline">Removed ${d.removed}</div>
        <div class="why">orbit keeps it for 30 days, then it is gone for good<br>restore puts it back exactly as it was</div>
      </div>`;
  return `<div class="focus"><div class="plate" aria-hidden="true">PDF</div>
        <div class="focusline">Orbit could not draw a picture of this document.</div>
        <div class="why">the file is fine — scanned clean, and yours to download<br>orbit just could not turn it into a page to read here</div>
      </div>`;
}
function paintSheet(mode) {
  const d = sheetDoc, st = docState(d), it = bodies[sheetIdx]?.item?.title ?? "";
  rc.classList.remove("snap", "still", "refused", "scanning", "removed");
  if (mode === "snap") rc.classList.add("snap");
  if (mode === "still") rc.classList.add("still", st === "scanning" ? "scanning" : st === "pending_deletion" ? "removed" : "refused");
  rc.setAttribute("aria-label", (mode === "snap" ? `${d.name}, page ${sheetPage} of ${d.pages}` : d.name) + `, attached to ${it}`);
  rc.innerHTML =
    `<div class="pagebox" id="pagebox">
      ${focusBlock(d, mode)}
      <div class="topsheet"><button type="button" class="sheet" onclick="openReader()" aria-label="Read ${d.name}: open page ${sheetPage} large">
        <img src="${canShow(d) ? pageSrc(d, sheetPage) : ""}" alt="Page ${sheetPage} of ${d.name}"></button></div>
    </div>` +
    previewFoot(d, mode);
  fitPreview();
  measureCard();
}
/* THE READER'S ZOOM. fit: the page as large as the window allows in its
   own proportions; its percentage is that width over an A4 page at 96 dpi.
   Past fit: the image at A4 times the zoom, the stage scrolling both ways.
   Below fit is not offered. The preview has no zoom: it is always fit. */
const rd = document.getElementById("reader"), rdStage = document.getElementById("rdstage");
let rdOpen = false, rdZoom = "fit";
function rdImg() { return rd.querySelector(".rd-sheet img"); }
function fitVal() {
  const img = rdImg();
  if (!img?.naturalWidth) return 1;
  const h = parseFloat(rd.style.getPropertyValue("--rd-h")) || 0, w = parseFloat(rd.style.getPropertyValue("--rd-w")) || 0;
  const aspect = img.naturalHeight / img.naturalWidth;
  const fitW = Math.min(w || Infinity, (h || Infinity) / aspect);
  return Math.max(0.05, (isFinite(fitW) ? fitW : img.naturalWidth) / A4_W);
}
function rdZoomVal() { return rdZoom === "fit" ? fitVal() : rdZoom; }
function zoomStep(dir) {
  const steps = [0.75, 1, 1.25, 1.5, 2, 3, 4];
  const v = rdZoomVal(), f = fitVal();
  if (dir > 0) return steps.find((x) => x > v + 0.01) ?? v;
  const down = [...steps].reverse().find((x) => x < v - 0.01);
  return (down === undefined || down <= f + 0.01) ? "fit" : down;
}
function setZoom(z) {
  rdZoom = z;
  sizeReader();
  paintBar();
}
function sizeReader() {
  const img = rdImg();
  if (!img || !rdOpen) return;
  rd.classList.toggle("zoomed", rdZoom !== "fit");
  const room = rdStage.getBoundingClientRect();
  rd.style.setProperty("--rd-h", Math.max(120, Math.floor(room.height) - 18) + "px");
  rd.style.setProperty("--rd-w", Math.max(120, Math.floor(room.width) - 18) + "px");
  if (rdZoom === "fit") { img.style.width = ""; return; }
  img.style.width = Math.round(A4_W * rdZoom) + "px";
}
function paintBar() {
  if (!sheetDoc) return;
  document.getElementById("rdbar").innerHTML = readerBar(sheetDoc);
  document.getElementById("rdzoom").innerHTML = readerZoom();
  paintArrows();
}
function paintReader() {
  const d = sheetDoc, img = rdImg();
  img.src = pageSrc(d, sheetPage); img.alt = `Page ${sheetPage} of ${d.name}`;
  document.getElementById("rd-title").innerHTML = `<b>${d.name}</b> · attached to ${bodies[sheetIdx]?.item?.title ?? ""} · page ${sheetPage} of ${d.pages}`;
  rd.setAttribute("aria-label", `Reading ${d.name}, page ${sheetPage} of ${d.pages}`);
  paintBar();                      /* the bar first: its height is part of the room the page is fitted to */
  if (img.complete && img.naturalWidth) { sizeReader(); paintBar(); }
  else img.addEventListener("load", () => { sizeReader(); paintBar(); }, { once: true });
  rdStage.scrollTo({ top: 0, left: 0 });
}
/* opening the reader: the preview's page, large, over the belt */
function openReader(zoom) {
  if (!sheetDoc || !canShow(sheetDoc)) return;
  rdOpen = true; rdZoom = zoom ?? "fit"; armed = false;
  rd.hidden = false;
  paintReader();
  requestAnimationFrame(() => rd.classList.add("open"));
  bindPinch();
  rd.focus();
  syncDemos();
}
function closeReader(refocus) {
  if (!rdOpen) return;
  rdOpen = false; armed = false; clearTimeout(armTimer);
  rd.classList.remove("open", "zoomed");
  setTimeout(() => { if (!rdOpen) rd.hidden = true; }, reduced() ? 0 : 360);
  if (refocus && sheetDoc) rc.querySelector("button.sheet")?.focus();
  syncDemos();
}
/* a press on the dim outside the page closes the reader; the page itself,
   its bar and its head do not */
rdStage.addEventListener("pointerdown", (e) => { if (e.target === rdStage) closeReader(true); });
/* turning a page: the preview shows it, and the reader too if it is open */
function turnTo(n) {
  if (!sheetDoc || !sheetDoc.pages || !rc) return;
  sheetPage = Math.max(1, Math.min(sheetDoc.pages, n));
  const img = rc.querySelector(".sheet img");
  if (img) {
    img.src = pageSrc(sheetDoc, sheetPage); img.alt = `Page ${sheetPage} of ${sheetDoc.name}`;
    img.parentElement.setAttribute("aria-label", `Read ${sheetDoc.name}: open page ${sheetPage} large`);
    landed.add(img.src);
  }
  rc.setAttribute("aria-label", `${sheetDoc.name}, page ${sheetPage} of ${sheetDoc.pages}, attached to ${bodies[sheetIdx]?.item?.title ?? ""}`);
  const foot = rc.querySelector(".pager"); if (foot && rc.classList.contains("snap")) foot.outerHTML = pager(sheetDoc);
  if (rdOpen) paintReader();
}
/* #1054: remove arms on the first press and acts on the second, as the
   household page's own remove does; the row's wording says which press
   this is. The mockup stands in for POST /api/documents/<id>/delete. The
   paper stays seated, now in its removed state. */
function armRemove() {
  if (!armed) {
    armed = true;
    repaintFoot();
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { armed = false; if (sheetDoc) repaintFoot(); }, 4000);
    return;
  }
  const d = sheetDoc;
  d.state = "pending_deletion"; d.removed = "13 August 2026"; d.gone = "12 September 2026";
  armed = false; closeReader(false); layout(); renderCard();
}
function repaintFoot() { paintBar(); }
function restoreDoc(id) {
  /* the mockup's stand-in for POST /api/documents/<id>/restore: the document
     is available again, its page and download back with it */
  for (const it of MANIFEST) for (const d of it.docs ?? []) if (d.id === id) {
    delete d.state; delete d.removed; delete d.gone;
    if (!d.file && !d.gen) { d.file = "service-invoice"; d.pages = 1; }   /* the story's stand-in render */
  }
  layout(); renderCard();
}
/* pinch on touch: two pointers in the page box scale the zoom about the
   page; ctrl+wheel does the same with a mouse */
let pinch = null;
function bindPinch() {
  const box = rdStage;
  if (box.dataset.pinch) return;
  box.dataset.pinch = "1";
  const pts = new Map();
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  box.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch") return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) pinch = { d0: dist(), z0: rdZoomVal() };
  });
  box.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) {
      e.preventDefault();
      const z = Math.min(4, Math.max(fitVal(), pinch.z0 * dist() / pinch.d0));
      const f = fitVal();
      rdZoom = z <= f + 0.01 ? "fit" : Math.round(z * 20) / 20;
      sizeReader();
      const pct = rd.querySelector(".rd-top .pct"); if (pct) pct.textContent = Math.round(Math.max(f, z) * 100) + "%";
    }
  }, { passive: false });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) { if (pinch) setZoom(rdZoom); pinch = null; } };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoomStep(e.deltaY < 0 ? 1 : -1));
  }, { passive: false });
}

/* CLOSING the reader: Esc, its close word, or a press on the dim outside
   the page (above). The preview itself has nothing to close — it is the
   seated paper; walking away from it is the way out. */
document.addEventListener("keydown", (e) => {
  if (!rdOpen || !sheetDoc) return;
  const k = e.key;
  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  if (k === "Escape") { stop(); closeReader(true); }
  else if (k === "ArrowLeft" || k === "PageUp") { stop(); turnTo(sheetPage - 1); }
  else if (k === "ArrowRight" || k === "PageDown") { stop(); turnTo(sheetPage + 1); }
  else if (k === "Home") { stop(); turnTo(1); }
  else if (k === "End") { stop(); turnTo(sheetDoc.pages ?? 1); }
  else if (k === "+" || k === "=") { stop(); setZoom(zoomStep(1)); }
  else if (k === "-" || k === "_") { stop(); setZoom(zoomStep(-1)); }
  else if (k === "0") { stop(); setZoom("fit"); }
}, true);
window.addEventListener("resize", () => { if (rdOpen) { sizeReader(); paintBar(); } });

computeGeometry();
buildBodies();
layout();
if (!reduced()) requestAnimationFrame(frame);
(function fromUrl() {
  const q = new URLSearchParams(location.search);
  const pack = q.get("theme");
  const sw = pack && document.querySelector(`.sw[data-pack="${pack}"]`);
  if (sw) setSwatch(pack, sw);
  if (q.get("scene") in SCENES) showScene(q.get("scene"));
})();
</script>
</body></html>
