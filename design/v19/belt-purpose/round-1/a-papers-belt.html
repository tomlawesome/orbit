<!doctype html>
<!--
  Orbit — what the belt is for, round 1 (#1304), direction A: the papers belt.
  Brief: README.md in this folder. Base: ../../document-card/round-6/h-preview-and-reader.html
  (the ratified belt, preview card and reader, §18), changed only as direction A says:
  the band holds PAPERS, not items; the seated paper at the apex IS round 6's preview
  card; under it one link, `open the item →`; the search box is home's #explore.

  Scenes (?scene=…, also on the rail):
    rest        a paper seated — Service history, 3 pages (the default arrival)
    focusing    the moment before the page lands (round 6's focus block)
    scanning    a paper still in the scanner (renewal-notice.pdf)
    removed     a paper being removed, restore only (tyre-invoice-2025.pdf)
    undrawable  a file Orbit could not draw, download only (policy-schedule.pdf)
    reading     the reader open over the belt, page 1 at fit
    zoom        the reader at page 2, 150%
    search      the shared search box open: two paper hits and one item hit ("mot")
  Packs: ?theme=starchart|afterdark|clouds|dawn|retrograde.
  Phone: there is no phone scene. The phone layout is the viewport under 700px
  (the rail, the search and the end-caps restack under 680px; the reader under
  700px), exactly as round 6; capture it at 390x844.
-->
<html lang="en" data-theme="afterdark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — what the belt is for, round 1, direction A: the papers belt (#1304)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  /*
   * WHAT THE BELT IS FOR — round 1 (#1304), direction A: the papers belt.
   * Round 6's ratified belt (document-card/round-6/h-preview-and-reader.html)
   * carried forward: its sky, band, rubble, roll, packs, reader and rail are
   * verbatim. What changes is what rides the band — every PAPER in the
   * household, in date order of the item it belongs to, and no item at all —
   * and what sits at the apex: the seated paper, as round 6's preview card.
   * Item management lives in home's drawer (direction B); the belt says
   * `open the item →` and nothing else about the item.
   */
  :root{
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
    --display:'Space Grotesk',var(--ui);
  }
  /* The five packs web/src/lib/theme.js lists, verbatim from
     web/src/lib/packs.css (comments stripped), plus the belt's own two
     tokens per pack from web/src/routes/item/[[id]]/belt.css. */
  [data-theme=starchart]{
    --bg:#060b1c; --panel:rgba(13,20,44,.55); --panel-raised:rgba(19,28,58,.75);
    --line:#243259; --line-soft:#17203f; --ink:#e9edf8; --ink-mid:#8791b3;
    --ink-faint:#737e9e; --accent:#d8b45a; --ok:#4ade80; --warm:#f0b429; --overdue:#f87171;
    --upcoming:#8fb8ff; --degraded:#fb8b24; --sun:#ffe9c4; --sun-core:#fff6e6; --stars:1;
    --celestial:block; --star-far:#e9edf8; --star-near:#f4f0ff; --chart-line:#243259;
    --chart-line-soft:#17203f; --chart-ink:#737e9e; --ink-quiet:#8b95b6;
    --accent-text:var(--accent); --ok-text:var(--ok); --overdue-text:var(--overdue);
    --degraded-text:var(--degraded); --warm-text:var(--warm);
    --upcoming-text:var(--upcoming); --sec-sage:#8fbf9f; --sec-blue:#8fb8ff;
    --sec-sand:#d8b45a; --sec-plum:#b79ae0; --sec-coral:#f0907a;
    --rubble:#7d88ab; --rubble-gain:1; --paper:#8fb8ff;
  }
  [data-theme=afterdark]{
    --bg:#05070d; --panel:rgba(11,15,26,.6); --panel-raised:rgba(15,21,36,.8);
    --line:#1c2434; --line-soft:#151b28; --ink:#e7e9ee; --ink-mid:#9fa6b2;
    --ink-faint:#717c8e; --accent:#7dd3fc; --ok:#4ade80; --warm:#f0b429; --overdue:#f87171;
    --upcoming:#7dd3fc; --degraded:#fb8b24; --sun:#dbe9ff; --sun-core:#ffffff; --stars:.6;
    --celestial:none; --star-far:#e9edf8; --star-near:#f4f0ff; --chart-line:#1c2434;
    --chart-line-soft:#151b28; --chart-ink:#717c8e; --ink-quiet:#768295;
    --accent-text:var(--accent); --ok-text:var(--ok); --overdue-text:var(--overdue);
    --degraded-text:var(--degraded); --warm-text:var(--warm);
    --upcoming-text:var(--upcoming); --plane-warm:#ffcf94; --plane-cool:#9fb0d6;
    --plane-star:#cfd9ee; --plane-star-warm:#ffdca6; --plane-dust:#01020a;
    --sec-sage:#7fb79a; --sec-blue:#7dd3fc; --sec-sand:#d9bd83; --sec-plum:#a99ae0;
    --sec-coral:#ef9b86;
    --rubble:#78849b; --rubble-gain:1; --paper:#c4b5fd;
  }
  [data-theme=clouds]{
    --sky-1:#b0bed6; --sky-2:#c2cad9; --sky-3:#d7d5cf; --sky-4:#eedfc8; --sky-5:#f8e9d2;
    --bg:#d2d3d4; --panel:rgba(233,239,249,.58); --panel-raised:rgba(241,245,252,.80);
    --line:#a6b2c5; --line-soft:#c0c8d6; --ink:#18202f; --ink-mid:#343d51;
    --ink-faint:#414d62; --accent:#1f7ac2; --ok:#178a4c; --warm:#c06a12; --overdue:#c22a63;
    --upcoming:#1f7ac2; --degraded:#c2570e; --sun:#eda253; --sun-core:#9c4a10; --stars:1;
    --celestial:none; --star-far:var(--ink); --star-near:var(--ink);
    --chart-line:rgba(26,34,51,.45); --chart-line-soft:rgba(26,34,51,.24);
    --chart-ink:#40506e; --p-jade-1:#e8f6ec; --p-jade-2:#95cfab; --p-jade-3:#4f9070;
    --p-amber-1:#fff0d8; --p-amber-2:#f0c076; --p-amber-3:#ad7830; --p-ruby-1:#ffe2e1;
    --p-ruby-2:#ec949c; --p-ruby-3:#a9505f; --p-sky-1:#e6eefc; --p-sky-2:#9dbce6;
    --p-sky-3:#5b80b8; --ink-quiet:var(--ink-faint); --accent-text:#134a72;
    --ok-text:#0d4e30; --overdue-text:color-mix(in srgb, var(--overdue) 70%, black 30%);
    --degraded-text:color-mix(in srgb, var(--degraded) 60%, black 40%);
    --warm-text:color-mix(in srgb, var(--warm) 70%, black 30%);
    --upcoming-text:var(--accent-text); --sec-sage:#2f7d55; --sec-blue:#1f7ac2;
    --sec-sand:#8f6c00; --sec-plum:#71499a; --sec-coral:#bd4f36;
    --rubble:#3d4a70; --rubble-gain:1.55; --paper:#2b6cb0;
  }
  [data-theme=dawn]{
    --sky-1:#b0bed6; --sky-2:#c2cad9; --sky-3:#d7d5cf; --sky-4:#eedfc8; --sky-5:#f8e9d2;
    --bg:#d2d3d4; --panel:rgba(233,239,249,.58); --panel-raised:rgba(241,245,252,.80);
    --line:#a6b2c5; --line-soft:#c0c8d6; --ink:#18202f; --ink-mid:#343d51;
    --ink-faint:#414d62; --accent:#1f7ac2; --ok:#178a4c; --warm:#c06a12; --overdue:#c22a63;
    --upcoming:#1f7ac2; --degraded:#c2570e; --sun:#eda253; --sun-core:#9c4a10; --stars:1;
    --celestial:none; --star-far:var(--ink); --star-near:var(--ink);
    --chart-line:rgba(26,34,51,.45); --chart-line-soft:rgba(26,34,51,.24);
    --chart-ink:#40506e; --p-jade-1:#e8f6ec; --p-jade-2:#95cfab; --p-jade-3:#4f9070;
    --p-amber-1:#fff0d8; --p-amber-2:#f0c076; --p-amber-3:#ad7830; --p-ruby-1:#ffe2e1;
    --p-ruby-2:#ec949c; --p-ruby-3:#a9505f; --p-sky-1:#e6eefc; --p-sky-2:#9dbce6;
    --p-sky-3:#5b80b8; --night-far:#dbe3f6; --night-near:#f4f7ff; --n-accent:#a9cdf2;
    --n-ink:#eef2fb; --n-line:#96a9c9; --ink-quiet:var(--ink-faint); --accent-text:#134a72;
    --ok-text:#0d4e30; --overdue-text:color-mix(in srgb, var(--overdue) 70%, black 30%);
    --degraded-text:color-mix(in srgb, var(--degraded) 60%, black 40%);
    --warm-text:color-mix(in srgb, var(--warm) 70%, black 30%);
    --upcoming-text:var(--accent-text); --sec-sage:#2f7d55; --sec-blue:#1f7ac2;
    --sec-sand:#8f6c00; --sec-plum:#71499a; --sec-coral:#bd4f36;
    --rubble:#3a4966; --rubble-gain:1.5; --paper:#6d28d9;
  }
  [data-theme=retrograde]{
    --bg:#080a14; --panel:rgba(12,20,30,.62); --panel-raised:rgba(16,26,38,.86);
    --line:#1d4a5a; --line-soft:#12303c; --ink:#eef6ff; --ink-mid:#a9d8e6;
    --ink-faint:#6f9fb1; --accent:#ff4fd8; --ok:#3ef2a0; --warm:#ffd23f; --overdue:#ff3864;
    --upcoming:#2de2e6; --degraded:#ff9f1c; --sun:#ff4fd8; --sun-core:#fff0fb; --stars:1;
    --celestial:block; --star-far:#9fd6e6; --star-near:#ffffff; --chart-line:#2a7f96;
    --chart-line-soft:#164b5c; --chart-ink:#6f9fb1;
    --bloom:color-mix(in srgb,var(--accent) 45%,transparent); --p-jade-1:#c4ffe4;
    --p-jade-2:#3ef2a0; --p-jade-3:#0e7a55; --p-amber-1:#fff3b0; --p-amber-2:#ffd23f;
    --p-amber-3:#8a6b00; --p-ruby-1:#ffb3c4; --p-ruby-2:#ff3864; --p-ruby-3:#8a0f2e;
    --p-sky-1:#b6fbff; --p-sky-2:#2de2e6; --p-sky-3:#0d6b78; --ink-quiet:#74a4b4;
    --accent-text:var(--accent); --ok-text:var(--ok); --overdue-text:var(--overdue);
    --degraded-text:var(--degraded); --warm-text:var(--warm);
    --upcoming-text:var(--upcoming); --sec-sage:#3ef2a0; --sec-blue:#2de2e6;
    --sec-sand:#ffd23f; --sec-plum:#ff4fd8; --sec-coral:#ff9f1c;
    --rubble:#6ea6b8; --rubble-gain:1; --paper:#2de2e6;
  }

  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  /* The belt is a stage, not a document: the band is pinned to the viewport
     so its apex can BE the screen centre, and the card is hung on that
     point. The card scrolls inside itself if a viewport is too short for it
     rather than sliding the belt off the top of the sky. */
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.55;
       transition:background .4s,color .4s;overflow:hidden}

  /* family.css / item.css: the sky is fixed and drifts (POL-11); the item
     screen has no descent of its own and none is invented here. */
  .sky{position:fixed;inset:0;pointer-events:none;opacity:var(--stars);
       transition:opacity .4s;z-index:0}
  .sky svg{position:absolute;inset:0;width:100%;height:100%}
  .sky .far{animation:drift 400s linear infinite}
  .sky .near{animation:drift 195s linear infinite}
  @keyframes drift{to{transform:translateX(-1600px)}}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
            background:radial-gradient(ellipse at 50% 34%, transparent 55%, rgba(0,0,0,.28) 100%)}
  [data-theme=clouds] .vignette,[data-theme=dawn] .vignette{background:none}

  /* ---- the band ------------------------------------------------------
     Two canvases sandwich the card, because the card is IN the band:
     everything at or behind the ring plane paints under it (and blurs
     through its glass), the nearest few per cent of the population paints
     over it. The members ride an SVG between them so they keep real hit
     targets, labels and focus rings. */
  #band,#fore{position:fixed;inset:0;pointer-events:none}
  #band{z-index:2}
  #fore{z-index:5}
  #members{position:fixed;inset:0;z-index:3;overflow:visible}
  .hit{pointer-events:auto;cursor:pointer}
  .hit .fring{opacity:0}
  .hit:focus-visible{outline:none}
  .hit:focus-visible .fring{opacity:1}
  .hit:hover .rim{opacity:.9}
  .rim{transition:opacity .25s ease}
  .cap-name{font:11.5px var(--mono);fill:var(--ink-mid);text-anchor:middle}
  .cap-t{font:10px var(--mono);letter-spacing:.06em;text-anchor:middle;
         font-variant-numeric:tabular-nums}
  /* The two end-caps: the band's compass. Which way is time? They ride the
     band where it leaves the frame, held above its upper edge (#1010): the
     far corners they used to keep went to the shared chrome, and above the
     band is the one side of it a jumbled body never reaches -- rocks sit in
     the band, their labels hang below it. */
  .endcap{font:9.5px var(--mono);letter-spacing:.2em;fill:var(--ink-faint);
          text-transform:uppercase}

  /* ---- the card, seated at the apex ----------------------------------
     item.css's glass card, unchanged in its parts, hung so that the band's
     highest point crosses it a third of the way down: the band's thickness
     (~430px at the apex) and the card's height are of an order, which is
     what makes it read as riding IN the belt rather than floating above it.
     The 16px backdrop blur is doing real work here — the rubble streaming
     behind the card is visible through it, smeared. */
  .cardwrap{position:fixed;left:50%;z-index:4;width:min(480px,calc(100vw - 56px));
    --cdx:0px; --cdy:0px; --csc:1;
    transform:translate(calc(-50% + var(--cdx)),calc(-34% + var(--cdy))) scale(var(--csc));
    transform-origin:50% 34%;}
  .cardwrap.rollout{opacity:0;
    transition:transform 190ms cubic-bezier(.55,0,.85,.4),opacity 165ms linear}
  .cardwrap.rollpre{transition:none;opacity:0}
  .cardwrap.rollin{transition:transform 230ms cubic-bezier(.16,.72,.3,1),opacity 205ms linear}
  .glass{background:var(--panel-raised);backdrop-filter:blur(16px);
         border:1px solid var(--line);border-radius:18px}
  .item-card{padding:22px 26px 20px}
  .item-card h2{font:600 21px var(--display);line-height:1.25}
  .item-card .sub{font:11px var(--mono);color:var(--ink-mid);letter-spacing:.04em;
                  margin:5px 0 16px}
  .kv{display:flex;justify-content:space-between;gap:18px;font:11.5px var(--mono);
      color:var(--ink-mid);padding:6.5px 2px;border-bottom:1px solid var(--line-soft)}
  .kv:last-of-type{border:0}
  .kv b{color:var(--ink);font-weight:500;text-align:right}
  .kv b.clean{color:var(--ok-text)}
  .kv b.over{color:var(--overdue)} .kv b.soon{color:var(--warm)}
  .kv b.up{color:var(--upcoming)} .kv b.ok{color:var(--ok-text)}
  .item-card h4{font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;
                color:var(--ink-faint);margin:16px 0 8px}
  .note{font:10.5px var(--mono);color:var(--ink-faint);margin-top:13px;line-height:1.75}
  .note b{color:var(--paper);font-weight:500}
  .acts{display:flex;flex-wrap:wrap;gap:7px}
  .acts button{font:11px var(--mono);color:var(--act,var(--ink-mid));background:var(--panel);
    border:1px solid color-mix(in srgb, var(--act,var(--ink-mid)) 40%, transparent);
    border-radius:999px;padding:6px 13px;cursor:pointer}
  .acts button:hover{border-color:var(--act,var(--ink))}
  .btn-primary{padding:9px 20px;border-radius:11px;border:0;cursor:pointer;
    font:600 12.5px var(--display);color:var(--bg);background:var(--act,var(--accent))}
  .btn-primary:hover{filter:brightness(1.05)}
  .back{display:inline-block;margin-top:14px;font:11.5px var(--mono);
        color:var(--ink-mid);text-decoration:none;background:none;border:0;
        cursor:pointer;padding:0}
  .back:hover{color:var(--accent-text)}

  /* THE SHARED CHROME (#1010): the way back and the account orb, verbatim
     from the #452 family. The way back is knocked out against the starfield
     with a --bg halo, as on every other sheet. */
  .chrome-back{position:fixed;top:30px;left:26px;z-index:6;font:11px var(--mono);
        letter-spacing:.14em;color:var(--ink-quiet);text-decoration:none;
        text-shadow:0 0 2px var(--bg),0 0 5px var(--bg),0 0 11px var(--bg)}
  .chrome-back:hover{color:var(--accent-text)}
  .orb{position:fixed;top:22px;right:26px;z-index:6;width:40px;height:40px;
       border-radius:50%;border:1px solid var(--line);background:var(--panel);
       backdrop-filter:blur(10px);cursor:pointer;display:grid;place-items:center;
       font:12px var(--mono);color:var(--ink-mid)}
  .orb:hover{border-color:var(--accent)}

  /* The document's honest display, v2's, unchanged. No fabricated page image:
     the plate says what the file is, the rows say what Orbit knows, the
     button hands over the original. #476's page-one render turns this half
     into the page itself. */
  .docview{display:flex;gap:20px;align-items:flex-start}
  .plate{flex:none;width:104px;height:134px;border-radius:8px;position:relative;
         border:1px solid var(--paper);background:var(--panel);
         display:grid;place-items:end center;padding-bottom:8px;
         font:9.5px var(--mono);letter-spacing:.1em;color:var(--paper)}
  .plate::before{content:"";position:absolute;left:14px;right:14px;top:20px;height:1px;
     background:var(--line);
     box-shadow:0 10px 0 var(--line),0 20px 0 var(--line-soft),0 30px 0 var(--line-soft),
                0 40px 0 var(--line-soft),0 50px 0 var(--line-soft)}
  .docbody{flex:1;min-width:0}
  .docbody h3{font:520 14px var(--mono);line-height:1.35;word-break:break-all}
  .docbody .sub{font:10.5px var(--mono);color:var(--ink-mid);letter-spacing:.04em;
                margin:5px 0 12px}
  .getrow{display:flex;align-items:center;gap:18px;margin-top:16px}

  /* ---- the search box -------------------------------------------------
     SHARED SEARCH (#1304, owner): home.html's #explore — its wrapper, its
     input and its POL-9 palette — copied verbatim, rule for rule, below.
     One component in the build; the belt only says where it stands
     (.searchspot, which is placement and nothing else: where the belt's
     own find box stood, top centre, over the sky). */
  .searchspot{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:8;text-align:center}
  /* home.html, verbatim */
  .splash-search input{background:none;border:0;outline:0;
             border-bottom:1px solid var(--line);width:320px;text-align:center;
             font:12.5px var(--mono);color:var(--ink);padding:6px 4px;
             transition:border-color .25s}
  .splash-search input::placeholder{color:var(--ink-faint)}
  .splash-search input:focus{border-color:var(--accent)}
  /* POL-9: command palette on the explore field */
  .palette{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:10px;
           width:340px;background:var(--panel-raised);backdrop-filter:blur(14px);
           border:1px solid var(--line);border-radius:14px;padding:8px;display:none;text-align:left}
  .palette.open{display:block}
  .palette div{font:12.5px var(--mono);color:var(--ink-mid);padding:8px 10px;border-radius:8px}
  .palette div b{color:var(--ink);font-weight:500}
  .palette div:hover{background:var(--panel)}
  .palette .act{color:var(--accent-text)}
  [data-theme=retrograde] .palette .act{text-shadow:0 0 9px var(--bloom)}
  [data-theme=dawn] .palette,[data-theme=clouds] .palette{
    backdrop-filter:blur(14px) saturate(1.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 8px 20px rgba(48,66,98,.07);
    border-top-color:rgba(255,255,255,.85)}
  /* end of home.html's rules. The belt's one addition is behavioural, not
     visual: a paper row seats that paper; an item row goes to home's drawer
     (here, the toast says so). */
  .palette div{cursor:pointer}
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:9;
         font:11px var(--mono);color:var(--ink);background:var(--panel-raised);
         border:1px solid var(--line);border-radius:999px;padding:9px 16px;white-space:nowrap;
         opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}

  /* ---- chrome --------------------------------------------------------- */
  .demos{position:fixed;left:22px;bottom:18px;z-index:7;display:flex;gap:7px;
         align-items:center;flex-wrap:wrap;max-width:calc(100% - 44px)}
  .demos span{font:9.5px var(--mono);letter-spacing:.16em;color:var(--ink-faint)}
  .demos button{font:10.5px var(--mono);color:var(--ink-mid);background:var(--panel);
    border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;
    backdrop-filter:blur(8px)}
  .demos button:hover{border-color:var(--accent);color:var(--ink)}
  .demos button[aria-pressed=true]{color:var(--accent-text);border-color:var(--accent)}
  .demos .sw{width:18px;height:18px;border-radius:50%;padding:0}
  .demos .sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
  .demos i{width:1px;height:16px;background:var(--line);display:inline-block;margin:0 3px}

  footer{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:6;
         text-align:center;font:10.5px var(--mono);color:var(--ink-faint);
         line-height:1.85;max-width:min(1120px,calc(100vw - 80px));pointer-events:none}

  /* ==================================================================== *
   * DIRECTION A. THE PAPERS IN THE BAND. A paper at rest is round 6's
   * preview sheet at small size: the cream top sheet with the page on it,
   * and the tilted second sheet under it, for every file. It rides the band
   * exactly where an item rock rode, scattered by the same jumble, in date
   * order of the item it belongs to. Under it, upright, two lines: its name,
   * then its item in the muted tone. No rock, no ring, no item card.
   * ==================================================================== */
  .cap-item{font:10.5px var(--mono);fill:var(--ink-faint);text-anchor:middle;letter-spacing:.02em}
  .pp-under{fill:#e7e3d8}
  .pp-top{fill:#f6f4ee}
  .pp-line{fill:#cfcabd}
  .pp-word{font:8px var(--mono);letter-spacing:.08em;fill:#8a8577;text-anchor:middle}
  .hit .rim,.hit .fring{fill:none}
  /* the honest states, at rest: scanning wears a dashed outline in the
     paper tone and the scanner's line sweeping it; removed is hollow and
     dashed, on its way out; undrawable is a plain sheet that says PDF */
  .hit.scanning .pp-top{stroke:var(--paper);stroke-width:1.2;stroke-dasharray:3 2.5}
  .hit.scanning .pp-sweep{fill:var(--paper);animation:ppsweep 2.2s ease-in-out infinite alternate}
  @keyframes ppsweep{from{transform:translateY(0)}to{transform:translateY(var(--sweep-y,60px))}}
  .hit.removed .paper{opacity:.42}
  .hit.removed .pp-top{stroke:var(--ink-mid);stroke-width:1.2;stroke-dasharray:4 3}

  /* THE SEATED PAPER. Round 6's preview card, unchanged in its parts (the
     page box, the sheet and its under-sheet, the pager, the focus block and
     the honest states, all carried verbatim below), now hung at the apex as
     the item card was: it IS the body there. Its width follows its page. */
  .readcard{min-width:0;padding:10px 10px 4px;display:grid;
            grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:4px}
  .readcard:focus{outline:none}
  /* the one way to the item: home's drawer. The belt's muted link text. */
  .openitem{display:block;width:max-content;margin:12px auto 0;padding:6px 10px;
            text-shadow:0 0 2px var(--bg),0 0 5px var(--bg),0 0 11px var(--bg)}
  .openitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}

  .rd-head{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;margin:-12px 0 -8px}
  .rd-close{flex:none;font:10.5px var(--mono);letter-spacing:.12em;color:var(--ink-mid);
            background:none;border:0;border-radius:999px;padding:0 10px;height:44px;
            margin-right:-10px;cursor:pointer;text-transform:uppercase}
  .rd-close:hover{color:var(--ink)}

  /* the page box: the reading card's window on the page. FIT MEANS FIT THE
     CARD'S WIDTH: the sheet is exactly as wide as the box and as tall as the
     page is; if that is taller than the card may be, the box scrolls down.
     Past fit the sheet is wider than the box and it scrolls both ways —
     inside the card, never the belt. Below fit is not offered. */
  .pagebox{position:relative;min-height:0;min-width:0;overflow:auto;
           touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:thin}
  .pagebox.zoomed .topsheet,.pagebox.zoomed .sheet{width:max-content}
  .readcard:not(.snap) .pagebox{display:grid;place-items:center;overflow:visible}
  /* create-v3, verbatim: the top sheet, and the sheet under it */
  .readcard .topsheet{display:none}
  .readcard.snap .topsheet{display:block;animation:landed .6s cubic-bezier(.3,.7,.2,1) backwards}
  @keyframes landed{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .sheet{position:relative;background:#f6f4ee;border-radius:5px;padding:9px;
         box-shadow:0 18px 44px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.4) inset}
  /* ROUND 5: the sheet under it is ALWAYS there, whatever the page count —
     create-v3 draws it for every file, and it is what makes the page read
     as a document (owner: "the multipage backdrop that stylised it"). */
  .sheet::before{content:"";position:absolute;inset:0;background:#e7e3d8;border-radius:5px;
                 transform:rotate(-1.1deg) translate(-4px,3px);z-index:-1}
  /* ROUND 5: THE WHOLE PAGE, ALWAYS, IN ITS OWN PROPORTIONS. At fit the
     image is bounded by the room the card has (--page-h, set in script from
     the screen) and never cropped; the sheet shrink-wraps it and the card's
     width follows the sheet (--readw, also set in script). Past fit the
     image is sized explicitly and the box scrolls. */
  .readcard.snap .topsheet{display:flex;justify-content:center}
  .sheet{width:max-content;max-width:100%}
  .sheet img{display:block;border-radius:2px;background:#fff;width:auto;max-width:100%;height:auto;
             max-height:var(--page-h,none)}
  .pagebox.zoomed .sheet img{max-width:none;max-height:none}
  /* ROUND 6: THE PREVIEW IS EXTREMELY BASIC (owner). The page nearly edge
     to edge on top, left and right; under it a page number, and an arrow
     each way only when there is somewhere to go. The page itself is the
     control: pressing it opens the reader over the belt. */
  button.sheet{display:block;border:0;cursor:zoom-in;text-align:left;font:inherit;color:inherit;
               -webkit-appearance:none;appearance:none}
  button.sheet:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  button.sheet:hover img{filter:brightness(1.03)}
  .pager{display:flex;justify-content:center;align-items:center;gap:6px;min-height:44px;
         font:11px var(--mono);color:var(--ink-mid);letter-spacing:.02em}
  .pager .pg{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
             font:14px var(--mono);color:var(--ink-mid);background:none;border:0;border-radius:999px;cursor:pointer}
  .pager .pg:hover{color:var(--ink)}
  .pager .pgn{color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
  .pager .pg.none{visibility:hidden}
  .pager .quiet{display:inline-flex;align-items:center;font:10.5px var(--mono);color:var(--ink-faint);
                background:none;border:0;cursor:pointer;padding:0 8px;height:44px;text-decoration:none;letter-spacing:.02em}
  .pager .quiet:hover{color:var(--ink)}
  .readcard .focus{padding:18px 0 4px}
  .readcard .focus .why{display:none}
  /* STILL SCANNING: a line sweeps the plate top to bottom and back, the
     outline's own colour, lit a little — the scanner at work (owner). */
  .plate.scanning::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:2px;border-radius:1px;
     background:var(--paper);opacity:.95;
     box-shadow:0 0 5px 1px var(--paper),0 0 16px 2px color-mix(in srgb,var(--paper) 45%,transparent);
     animation:scanline 2.2s ease-in-out infinite alternate}
  @keyframes scanline{from{top:6px}to{top:calc(100% - 8px)}}
  /* At fit the box does not clip: the under-sheet leans out past the sheet's
     edge by a few pixels on every side, and a scrolling box cut it off (the
     whole of round 4 lost it this way). The card's own padding is its room. */
  .pagebox:not(.zoomed){overflow:visible}
  .cap{font:10.5px var(--mono);color:var(--ink-mid);line-height:1.8;margin-top:14px;text-align:center}
  .cap b{color:var(--ink);font-weight:400}
  .honest{font:9.5px var(--mono);color:var(--ink-faint);line-height:1.8;margin-top:8px;text-align:center}

  /* create-v3, verbatim: the focus — the reticle, the owner's line breathing */
  .focus{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0 6px;
         align-self:center;max-width:360px;margin:0 auto}
  .readcard.snap .focus{display:none}
  .reticle{width:96px;height:96px;margin-bottom:20px}
  .reticle .sweep{transform-origin:48px 48px;animation:sweep 9s linear infinite}
  .reticle .pull{transform-origin:48px 48px;animation:pull 3.6s ease-in-out infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  @keyframes pull{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(.88);opacity:.5}}
  .focusline{font:600 15.5px var(--display);letter-spacing:.01em;color:var(--ink);
             animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.96}50%{opacity:.42}}
  .focus .why{font:10.5px var(--mono);color:var(--ink-faint);line-height:1.9;margin-top:12px}
  /* the three honest states wear the focus block still, not breathing:
     the reticle at rest, the line said once */
  .readcard.still .reticle .sweep,.readcard.still .reticle .pull,.readcard.still .focusline{animation:none}
  .readcard.refused .focusline{color:var(--degraded)}
  .readcard.still .focus .why{color:var(--ink-mid)}
  .readcard .focus .plate{margin:0 auto 18px;cursor:default}
  .plate.scanning{animation:platebreath 2.6s ease-in-out infinite alternate;letter-spacing:.06em}
  .plate.scanning::before{opacity:.45}
  @keyframes platebreath{from{border-color:color-mix(in srgb,var(--paper) 30%,transparent)}
                         to{border-color:var(--paper)}}
  .plate.removed{border-style:dashed;opacity:.55;letter-spacing:.06em}
  .plate.removed::before{opacity:.5}

  .kb{color:var(--ink-faint)}

  /* ROUND 6: THE READER. Round 1's reading room — "the full page zoom of
     the reading room is great" — as a window over the belt rather than a
     separate page (owner, round 1). The belt stays beneath, dimmed; the
     page as large as the screen allows, zoomable; pages turn on the bar
     beneath, with download and the two-press remove (#1054) at its tail.
     No thumbnail rail (dropped in round 1). Esc, the close word, or a press
     on the dim outside the page closes it, back to the preview. */
  .reader{position:fixed;inset:0;z-index:12;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
          padding:18px 26px 14px;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);
          backdrop-filter:blur(12px);opacity:0;transition:opacity .35s ease}
  .reader.open{opacity:1}
  .reader[hidden]{display:none}
  .reader:focus{outline:none}
  /* head: the title left, the zoom centred, close right (owner, 2026-09-20) */
  .rd-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;min-height:44px;
          font:11px var(--mono);letter-spacing:.06em;color:var(--ink-mid)}
  .rd-top .rd-close{justify-self:end}
  .rd-top b{color:var(--ink);font-weight:400}
  .rd-stage{overflow:auto;display:grid;place-items:center;min-height:0;min-width:0;
            touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:thin;cursor:zoom-out}
  .rd-sheet{background:#f6f4ee;border-radius:5px;padding:9px;margin:auto;width:max-content;cursor:default;
            box-shadow:0 22px 60px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4) inset;
            animation:landed .5s cubic-bezier(.3,.7,.2,1) backwards}
  .rd-sheet img{display:block;border-radius:2px;background:#fff;width:auto;height:auto;
                max-height:var(--rd-h,none);max-width:var(--rd-w,none)}
  .reader.zoomed .rd-sheet img{max-height:none;max-width:none}
  /* foot: the page number centred, download and remove right; the arrows
     stand either side of the page itself, not here */
  .rd-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
          font:11px var(--mono);color:var(--ink-mid);letter-spacing:.02em;min-height:44px}
  .rd-bar .pgn{grid-column:2;color:var(--ink);font-variant-numeric:tabular-nums}
  .rd-bar .words{grid-column:3;justify-self:end}
  .rd-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;
            display:grid;place-items:center;font:20px/1 var(--mono);color:var(--ink-mid);cursor:pointer;
            background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
            transition:color .15s,border-color .15s}
  .rd-arrow:hover{color:var(--ink);border-color:var(--ink-mid)}
  .rd-arrow:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .rd-arrow.prev{left:26px} .rd-arrow.next{right:26px}
  .rd-arrow.none{visibility:hidden}
  .rd-top .zoom{display:flex;align-items:center;gap:0}
  .rd-top .zoom .quiet{min-width:44px;justify-content:center;border-radius:999px}
  .rd-top .zoom .quiet[aria-pressed=true]{color:var(--accent-text)}
  .rd-top .pct{color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
  .rd-bar .words{display:flex;align-items:center;gap:8px}
  .rd-bar .acts a,.rd-bar .acts button{font:11px var(--mono);color:var(--act);background:var(--panel);text-decoration:none;
    border:1px solid color-mix(in srgb,var(--act) 40%,transparent);border-radius:999px;padding:8px 16px;min-height:34px;
    display:inline-flex;align-items:center;cursor:pointer;letter-spacing:.02em}
  .rd-bar .acts a:hover,.rd-bar .acts button:hover{border-color:var(--act)}
  .rd-bar .acts button.armed{background:var(--act);color:var(--bg);border-color:var(--act)}
  .rd-top .quiet,.rd-bar .quiet{display:inline-flex;align-items:center;font:10.5px var(--mono);color:var(--ink-faint);
                 background:none;border:0;cursor:pointer;padding:0 8px;height:44px;text-decoration:none;letter-spacing:.02em}
  .rd-top .quiet:hover,.rd-bar .quiet:hover{color:var(--ink)}
  .rd-top .quiet:disabled{opacity:.3;cursor:default;color:var(--ink-faint)}
  @media (max-width:700px){
    .reader{padding:10px 12px 8px}
    .rd-top{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 10px;letter-spacing:.03em}
    .rd-top #rd-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rd-top .zoom{grid-column:1 / -1;grid-row:2;justify-self:center}
    .rd-top .rd-close{grid-column:2;grid-row:1}
    .rd-bar{grid-template-columns:1fr;justify-items:center;gap:6px}
    .rd-bar .pgn,.rd-bar .words{grid-column:1;justify-self:center}
    .rd-arrow{width:44px;height:44px}
    .rd-arrow.prev{left:8px} .rd-arrow.next{right:8px}
  }

  /* belt.css, verbatim: under 680px the top strip stacks — the chrome keeps
     row one, the field takes a row beneath it, the end-caps are inset past
     the chrome on their own side (read by buildEnds). And the mockup's own
     rail becomes one scrolling row, its footer goes. ON A PHONE the seated
     paper stays the body at the apex: round 6's bottom sheet was a sheet
     beside an item card, and here there is no item card to sit beside. */
  :root{--endcap-inset-start:0px;--endcap-inset-end:0px}
  @media (max-width:680px){
    :root{--endcap-inset-start:99px;--endcap-inset-end:50px}
    .searchspot{top:72px}
    footer{display:none}
    .demos{flex-wrap:nowrap;overflow-x:auto;right:22px;max-width:none;bottom:12px;
           padding-bottom:4px;scrollbar-width:none}
    .demos span,.demos button{white-space:nowrap;flex:none}
    .kb{display:none}
    .toast{bottom:64px}
  }
  @media (prefers-reduced-motion: reduce){
    #band,#fore,#members .seat,#members .cap,#ends{transition:none}
    .readcard.snap .topsheet,.reticle .sweep,.reticle .pull,.focusline,.plate.scanning,.plate.scanning::after,.reader{animation:none;transition:none}
  }

  @media (prefers-reduced-motion: reduce){
    /* The swap is instant rather than animated — the belt still puts the
       pressed paper at the apex, it simply arrives there, the scanner's
       line stands still, and the band's drift holds still. */
    *{animation:none!important}
    .cardwrap{transition:none!important}
  }
</style>
</head>
<body>

<a class="chrome-back" href="../../home.html">← YOUR SKY</a>

    <g class="near" fill="var(--star-near)"><g id="neartile"></g><use href="#neartile" x="1600"/></g>

<!-- the band: everything at or behind the ring plane -->

<!-- DIRECTION A: the members are the household's papers, every one, in date
     order of the item each belongs to. No item rides the band. -->
<svg id="members" aria-label="The papers belt: every document in this household, placed in order of when its item comes due — sooner to the left, later to the right. The paper at the apex of the band is shown as its page.">
  <defs>
    <!-- the sheet's own shadow, round 6's .sheet box-shadow at paper size -->
    <filter id="papershade" x="-40%" y="-40%" width="180%" height="190%">

<!-- shared search: identical markup and CSS to home.html's #explore; one component in the build -->

      <div class="splash-search" style="position:relative">

        </div>

    <button class="rd-close" onclick="closeReader(true)">close<span class="kb"> · esc</span></button></div>

  <button class="rd-arrow next" id="rd-next" onclick="turnTo(sheetPage+1)" aria-label="Next page" title="→ or PageDown">→</button>

</div>

  <button onclick="arriveAt('d-boiler-record')" title="as a document row's `open on the belt →` in home's drawer would: the belt is simply already showing that paper seated">arrive from home</button>

  <button id="d-scanning" onclick="showScene('scanning')" title="arrived today, not yet scanned clean">scanning</button>
  <button id="d-removed" onclick="showScene('removed')" title="removed, kept 30 days, restore only">removed</button>

  <button id="d-zoom" onclick="showScene('zoom')" title="the reader over the belt: page 2 of the service history at 150%">reader 150%</button>

</div>

<footer>orbit · what the belt is for, round 1 (#1304) · direction A — the papers belt</footer>

<script>
/* ==================================================================== *
 * THE GEOMETRY — a ring seen at an angle, not a rainbow. Verbatim v2.
 *
 * The belt is a circle of radius A lying in its own plane. Two rotations
 * put it on screen:
 *   INC   40°  inclination — how far the ring plane is tipped away from us.
 *              This is what turns the circle into a shallow ellipse
 *              (minor/major = cos 40° = .766) and what makes the arc across
 *              the sky a sweep rather than a bow.
 *   NODE −12°  the node roll — the ring's line of nodes is not level with
 *              the horizon. This is the asymmetry: it drops the left flank
 *              and lifts the right, so the two halves of the visible band
 *              fall by different amounts (~300px left, ~240px right at
 *              1600×1000) and foreshorten differently.
 *
 * The apex — the highest point of the projected ellipse, found analytically,
 * not assumed — is then translated to the horizontal centre of the viewport
 * at 35% of its height. Everything else follows from that one pin.
 *
 * Ring angle phi runs anticlockwise; on screen INCREASING PHI MOVES LEFT.
 * Since the manifest runs sooner-left to later-right, a body's angular
 * offset along the belt DECREASES phi: offset 0 is the first item due.
 * ==================================================================== */
const RAD = Math.PI / 180;
const INC = 40 * RAD, NODE = -12 * RAD;
const COS_I = Math.cos(INC), SIN_I = Math.sin(INC);
const COS_N = Math.cos(NODE), SIN_N = Math.sin(NODE);
const A_FRAC = 0.74, A_MIN = 1150;   /* ring radius against the viewport */
const APEX_FRAC = 0.35;              /* where the apex hangs in the sky   */
const R_ITEM = 25;                   /* an item's radius                  */
const R_DOC = 17;                    /* a document's — smaller, on purpose */
const RADIAL = 0.19;                 /* the band's radial half-spread     */
const HFRAC = 0.066;                 /* its out-of-plane half-thickness   */
const SWEEP = 74;                    /* the neighbourhood an item clears  */
const SWEEP_DOC = 52;                /* a document's smaller clearing     */
const DRIFT = 0.0125;                /* rad/s along the ring, leftward    */
const GLIDE = 420;                   /* the roll, unchanged from v1/v2    */

/* ---- the spacing law -------------------------------------------------
   Position along the band is the item's DATE. Consecutive items are set
   apart by an angle that grows with the gap between their due dates, from a
   floor (below which two labels would touch) to a ceiling (beyond which a
   five-month wait would push the next item off the world). The growth is
   e-folded at 45 days: a fortnight apart reads noticeably tighter than a
   season apart, but the whole manifest still fits on one ring. */
const MIN_GAP = 11.5 * RAD;
const MAX_GAP = 17.5 * RAD;
const GAP_EFOLD = 45;                /* days, the gap law's scale         */
/* A document's seat is cut out of the space BETWEEN its item and the next
   one along — 6° of ring, well inside the floor — so putting documents in
   the band can never reorder the manifest or change what "next" means. */
const DOC_OFF = 6.0 * RAD;

/* ---- the card's berth ------------------------------------------------
   The centred body is not a rock, it is a ~400px card, so it has swept a
   wider clearing than its neighbours: angles are pushed away from the apex
   by a smooth ODD function, which stretches the seats flanking the card and
   leaves everything further out merely shifted. warp(0) === 0 exactly, so
   the centred body still lands on the apex pin to the pixel, and because
   warp is smooth and monotonic the roll never jumps and the date order can
   never be disturbed.

   The berth WIDENS when the centred item has papers, because the papers have
   to sit in it: the neighbours stand off from ~295px to ~480px, and the
   documents take the ground they leave, at ~285px — clear of the card's edge
   on one side and of the neighbour's label on the other. It widens across
   the roll itself, so opening an item is a visible act: the belt makes room
   and the papers come out. */
const BERTH_NARROW = 0.075, BERTH_WIDE = 0.28, BERTH_K = 0.16;
let berthNow = BERTH_NARROW, berthFrom = BERTH_NARROW, berthTo = BERTH_NARROW;
const warp = (u) => u + berthNow * Math.tanh(u / BERTH_K);

/* ---- the jumble ------------------------------------------------------
   "They don't form an orderly, linear line, they're jumbled around a
   little" (owner). Each body carries a seeded throw: off the ring radius,
   out of the ring plane, and a little along the band. The along-band throw
   is a tenth of the minimum gap, which cannot reorder anything and cannot
   close two labels to touching; the other two scatter the bodies through the
   band's thickness. All three ease to zero at the apex. */
const J_PHI = 0.10;                  /* × the minimum gap                 */
const J_RHO = 0.100;                 /* × A, off the ring radius          */
const J_H   = 0.038;                 /* × A, out of the ring plane        */
const J_FADE = 0.62;                 /* × the min gap: the settling zone  */

let W = 0, H = 0, A = 0, CX = 0, CY = 0, APEX_Y = 0;
let PHI_APEX = 0, PHI_L = 0, PHI_R = 0, DIP_L = 0, DIP_R = 0, GAP_SCALE = 1;

function project(phi, rho, hh) {
  const s = Math.sin(phi), c = Math.cos(phi);
  const u = rho * c;                          /* along the node line       */
  const v = rho * s * COS_I + hh * SIN_I;     /* screen-up, foreshortened  */
  const d = -rho * s * SIN_I + hh * COS_I;    /* toward the viewer         */
  return { x: CX + u * COS_N - v * SIN_N, y: CY - (u * SIN_N + v * COS_N), d };
}

/* x(phi) falls monotonically across the visible arc, so a walk-and-refine
   is exact enough and cannot be tripped by the ellipse's turning points. */
function phiAtX(targetX, dir) {
  let phi = PHI_APEX, step = 0.02 * dir, last = project(phi, A, 0).x;
  for (let i = 0; i < 400; i++) {
    const next = phi + step, x = project(next, A, 0).x;
    if ((dir < 0 && x >= targetX) || (dir > 0 && x <= targetX)) {
      const t = (targetX - last) / (x - last);
      return phi + step * Math.max(0, Math.min(1, t));
    }
    if ((dir < 0 && x < last) || (dir > 0 && x > last)) return phi; /* turned */
    phi = next; last = x;
  }
  return phi;
}

function computeGeometry() {
  W = window.innerWidth; H = window.innerHeight;
  A = Math.max(A_MIN, W * A_FRAC);
  APEX_Y = Math.round(H * APEX_FRAC);
  /* d/dphi of the projected height, solved: the true apex of the tilted
     ellipse, which is NOT the top of the untilted one. */
  PHI_APEX = Math.atan2(COS_I * COS_N, SIN_N);
  if (PHI_APEX < 0) PHI_APEX += Math.PI * 2;
  CX = 0; CY = 0;
  const p = project(PHI_APEX, A, 0);
  CX = W / 2 - p.x; CY = APEX_Y - p.y;
  PHI_R = phiAtX(W + 200, -1);
  PHI_L = phiAtX(-200, +1);
  /* The gaps are real angles of ring, but a narrow sky cannot hold two of
     them either side of the apex once the card's widest berth is added: on
     one, the belt sits its items closer together rather than rolling them
     off the world. The date law survives the squeeze — every gap scales
     together, so clusters stay clusters. */
  const held = berthNow;
  berthNow = BERTH_WIDE;
  GAP_SCALE = 1;
  for (let k = 0; k < 24; k++) {
    const one = warp(MIN_GAP * GAP_SCALE);
    if (project(PHI_APEX - one, A, 0).x <= W - 86 &&
        project(PHI_APEX + one, A, 0).x >= 86) break;
    GAP_SCALE -= 0.04;
    if (GAP_SCALE < 0.55) { GAP_SCALE = 0.55; break; }
  }
  berthNow = held;
  /* How far the band falls 300px either side of the apex: the card slides
     ALONG the band when it leaves, so it has to know the dip. */
  DIP_L = project(phiAtX(W / 2 - 300, +1), A, 0).y - APEX_Y;
  DIP_R = project(phiAtX(W / 2 + 300, -1), A, 0).y - APEX_Y;
}

/* web/src/lib/format.js, transcribed — one vocabulary for dates and money so

   own today, which is what keeps two loads of this page identical. */
const dayOf = (iso) => Math.round(Date.parse(iso + "T00:00:00Z") / 86400000);
const daysTo = (iso) => dayOf(iso) - dayOf(DESIGN_TODAY);
const tminus = (iso) => { const d = daysTo(iso); return d < 0 ? `T+${-d}d` : `T−${d}d`; };
const longDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB",
