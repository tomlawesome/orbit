<!doctype html>
<html lang="en" data-theme="starchart">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>#1008 · round 2 · C — list</title>
<style>
  :root{--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Space Grotesk',var(--ui)}
  [data-theme=starchart]{--bg:#060b1c;--panel:rgba(13,20,44,.55);--panel-raised:rgba(19,28,58,.75);
    --line:#243259;--line-soft:#17203f;--ink:#e9edf8;--ink-mid:#8791b3;--ink-faint:#737e9e;
    --accent:#d8b45a;--ok-text:#4ade80;--warm:#f0b429;--accent-text:var(--accent)}
  [data-theme=atlas]{--bg:#c9bfa6;--panel:rgba(214,206,186,.78);--panel-raised:#dcd5c3;
    --line:#a89c80;--line-soft:#b8ae95;--ink:#1c2b4a;--ink-mid:#4a5570;--ink-faint:#7b8296;
    --accent:#b4842c;--ok-text:#115531;--warm:#8f6c00;--accent-text:#684808}
  [data-theme=dawn]{--bg:#c3ccdb;--panel:rgba(226,232,241,.82);--panel-raised:#e4eaf3;
    --line:#9daabf;--line-soft:#b2bccd;--ink:#1a2233;--ink-mid:#48546e;--ink-faint:#78849b;
    --accent:#1f7ac2;--ok-text:#0d4e30;--warm:#8f6c00;--accent-text:#134a72}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.55;min-height:100vh;padding:28px 24px 60px}
  .wrap{max-width:620px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:22px;font:10.5px var(--mono);letter-spacing:.14em;
       text-transform:uppercase;color:var(--ink-faint)}
  .bar .tag{margin-right:auto}
  .bar button{font:10.5px var(--mono);letter-spacing:.1em;color:var(--ink-mid);background:none;border:1px solid var(--line);
       border-radius:9px;padding:5px 10px;cursor:pointer}
  .bar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent-text)}
  h2{font:10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px 4px}

  /* the receipt card, design/v19/inbox.html verbatim */
  .receipt{border:1px dashed var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);
           padding:16px 18px;margin-bottom:10px}
  .receipt .head{display:flex;align-items:baseline;gap:12px}
  .receipt .head .dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center;background:none;border:1.6px solid var(--accent)}
  .receipt .head b{flex:1;font-size:14.5px;font-weight:560}
  .receipt .head small{font:10.5px var(--mono);color:var(--ink-faint)}
  .receipt .head small .exp{color:var(--warm)}
  .attach{display:inline-flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink-mid);
          border:1px solid var(--line-soft);border-radius:9px;padding:6px 11px;margin-top:10px}
  .attach .clean{color:var(--ok-text)}
  .receipt .actions{display:flex;gap:8px;margin-top:14px;align-items:center}
  .receipt .actions button{font-size:12.5px;font-family:var(--ui);border-radius:9px;padding:7px 15px;cursor:pointer;
                           border:1px solid var(--line);background:none;color:var(--ink-mid)}
  .receipt .actions button.yes{border-color:var(--accent);color:var(--accent-text)}
  .receipt .actions a{font:11px var(--mono);color:var(--ink-mid);text-decoration:none;margin-left:auto}
  .twotap{font:10.5px var(--mono);color:var(--ink-faint)}


  /* round 2: no boxes. A field is a label and a short list of readings;
     the one in force wears a filled dot, the rest hollow, like the toggle
     that is filled when on. The quote sits after the value in the faint
     tier, one line, cut with an ellipsis. */
  .fields{margin:12px 0 4px}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:2px 12px;align-items:start;padding:8px 2px;border-bottom:1px solid var(--line-soft)}
  .kv > span{font:11.5px var(--mono);color:var(--ink-mid);padding-top:3px}
  .list{display:grid;gap:1px}
  .rd{display:grid;grid-template-columns:12px auto minmax(0,1fr);gap:0 8px;align-items:baseline;
      font:12.5px var(--ui);color:var(--ink-mid);background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;border-radius:6px}
  .rd i{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--ink-faint);align-self:center;justify-self:center}
  .rd[aria-checked=true]{color:var(--ink)}
  .rd[aria-checked=true] i{background:var(--accent);border-color:var(--accent)}
  .rd:hover i{border-color:var(--ink-mid)}
  .rd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rd q{quotes:"\201C" "\201D";font:10.5px var(--mono);color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rd.other{color:var(--ink-faint)}
  .rd.other i{border-style:dashed}
  .rd input{font:12.5px var(--ui);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--accent);padding:0;width:140px;outline:none}
  .rd .none{font:10.5px var(--mono);color:var(--ink-faint)}
</style></head>
<body><div class="wrap">
  <div class="bar"><span class="tag">round 2 · C · list · #1008</span>
    <button aria-pressed="true" onclick="pack(this,'starchart')">starchart</button>
    <button onclick="pack(this,'atlas')">atlas</button>
    <button onclick="pack(this,'dawn')">dawn</button></div>
  <h2>For your review · 2</h2>
  <div id="cards"></div>
</div>
<script>
  // Data story: two receipts caught by the relay. Each field carries what
  // Orbit read, best first, and the document line each reading came from.
  const RECEIPTS = [
    { title: "Home insurance renewal", caught: "11 Aug", burns: 43, attach: "policy-schedule.pdf · 812 KB",
      fields: [
        ["provider", [["Harbour Mutual", "Your insurer: Harbour Mutual"], ["Harbour Mutual Insurance Services Ltd", "Harbour Mutual Insurance Services Ltd, registered in England"], ["Aviva", "Underwritten by Aviva Insurance Limited"]]],
        ["renews", [["03 Oct 2026", "Renewal date: 3 October 2026"], ["03 Oct 2025", "Cover started: 3 October 2025"], ["11 Aug 2026", "Date of this letter: 11 August 2026"]]],
        ["cost", [["£412.30", "Total premium payable: £412.30"], ["£34.36 a month", "or 12 monthly payments of £34.36"]]],
        ["kind", [["renewal", "Your renewal notice"]]],
      ] },
    { title: "Boiler service — Worcester", caught: "09 Aug", burns: 41, attach: "service-invoice-2026.pdf · 310 KB",
      fields: [
        ["provider", [["Northgate Heating", "Northgate Heating Ltd"]]],
        ["next due", [["12 Jul 2027", "Next service due: July 2027"], ["12 Jul 2026", "Service carried out: 12 July 2026"], ["09 Aug 2026", "Invoice date: 9 August 2026"]]],
        ["cost", []],
      ] },
  ];
  const state = RECEIPTS.map((r) => r.fields.map((f) => (f[1].length ? 0 : -1))); // chosen index, -1 = typed
  

  // C: every reading on show, nothing boxed. "type it" is the last line of
  // the list, dashed dot. None: the typing line is the only line and says so.
  function field(ri, fi, label, cands, chosen) {
    const rows = cands.map((c, ci) => `<button class="rd" role="radio" aria-checked="${chosen === ci}" onclick="pick(${ri},${fi},${ci})"><i></i><span>${c[0]}</span><q>${c[1]}</q></button>`).join("");
    const other = chosen === -1
      ? `<span class="rd other" aria-checked="true" data-r="${ri}" data-f="${fi}"><i></i><input placeholder="type it" aria-label="${label}, typed">${cands.length ? "" : `<span class="none">not read — nothing here looked like a ${label}</span>`}</span>`
      : `<button class="rd other" onclick="pick(${ri},${fi},-1)"><i></i><span>type it</span></button>`;
    return `<div class="kv"><span>${label}</span><div class="list" role="radiogroup" aria-label="${label}">${rows}${other}</div></div>`;
  }
  function pick(ri, fi, ci) { state[ri][fi] = ci; render(); if (ci === -1) document.querySelector(`[data-r="${ri}"][data-f="${fi}"] input`)?.focus(); }
  function pack(b, t) { document.documentElement.dataset.theme = t; document.querySelectorAll(".bar button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }
  function render() {
    document.getElementById("cards").innerHTML = RECEIPTS.map((r, ri) => `
      <div class="receipt"><div class="head"><span class="dot"></span><b>${r.title}</b>
        <small>caught ${r.caught} · <span class="exp">burns up in ${r.burns}d</span></small></div>
        <div class="fields">${r.fields.map((f, fi) => field(ri, fi, f[0], f[1], state[ri][fi])).join("")}</div>
        <span class="attach">◆ ${r.attach} · <span class="clean">scanned clean</span></span>
        <div class="actions"><button class="yes">Add to orbit</button><button>Dismiss</button>
          <span class="twotap">— both ask twice</span><a href="#">review &amp; amend →</a></div></div>`).join("");
  }
  render();
</script></body></html>
