<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail family · round 4</title>
<style>
  :root { --bg:#07090f; --ink:#d7dbe4; --mute:#7c8495; --line:#1c2230; --accent:#7fd4ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Georgia, serif; }
  header { position:sticky; top:0; z-index:2; background:rgba(7,9,15,.94); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:normal; margin:0; letter-spacing:.04em; }
  header nav { display:flex; gap:6px 10px; flex-wrap:wrap; font:12px/1 ui-monospace, monospace; }
  header nav a { color:var(--mute); text-decoration:none; }
  header nav a:hover { color:var(--accent); }
  header label { margin-left:auto; font:12px ui-monospace, monospace; color:var(--mute); display:flex; gap:6px; align-items:center; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:28px; padding:24px 16px 60px; }
  section { scroll-margin-top:70px; }
  section h2 { font:12px/1 ui-monospace, monospace; color:var(--mute); margin:0 0 8px; letter-spacing:.08em; text-transform:uppercase; }
  iframe { width:100%; height:1180px; border:1px solid var(--line); border-radius:6px; background:#0a0d16; display:block; }
  @media (max-width:460px) { main { grid-template-columns:1fr; padding:16px 8px; } iframe { height:1400px; } }
</style>
</head>
<body>
<header>
  <h1>Mail family · round 4 · direction L</h1>
  <nav id="nav"></nav>
  <label><input type="checkbox" id="still"> still (what Gmail and Outlook show)</label>
</header>
<main id="main"></main>
<script>
  const mails = [
    ['sending-address-check', 'Check your sending address'],
    ['could-not-match', 'Orbit could not match your message'],
    ['review-available', 'Something to review'],
    ['reminder', 'Reminder'],
    ['reminder-expiry', 'Reminder, expiry'],
    ['sign-in-approval', 'Sign-in approval'],
    ['set-password', 'Set a password'],
    ['reset-password', 'Reset your password'],
    ['key-locked', 'Key locked'],
    ['key-restored', 'Key restored'],
    ['admin-alert-scanner', 'Admin alert, scanner'],
    ['admin-alert-import', 'Admin alert, import'],
  ];
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  const still = document.getElementById('still');
  try { still.checked = localStorage.getItem('mail-round4-still') === '1'; } catch (e) {}
  function render() {
    main.innerHTML = '';
    for (const [slug, title] of mails) {
      const s = document.createElement('section'); s.id = slug;
      s.innerHTML = `<h2>${title}</h2><iframe loading="lazy" src="l-${slug}.html${still.checked ? '?still' : ''}" title="${title}"></iframe>`;
      main.appendChild(s);
    }
  }
  nav.innerHTML = mails.map(([s, t]) => `<a href="#${s}">${t}</a>`).join('');
  still.addEventListener('change', () => { try { localStorage.setItem('mail-round4-still', still.checked ? '1' : '0'); } catch (e) {} render(); });
  render();
</script>
</body>
</html>
