<head>

<title>Orbit</title>
<style>
  html, body { height: 100%; margin: 0; }

    display: flex; align-items: center; justify-content: center;
    background: #060b1c; color: #e9edf8;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 22rem; padding: 2rem; text-align: center; }

  p { margin: 0 0 1.5rem; color: #8b95b6; }
  button {
    font: inherit; color: #060b1c; background: #d8b45a;
    border: 0; border-radius: .5rem; padding: .6rem 1.4rem; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #e9edf8; outline-offset: 3px; }

<main>
  <img src="/icon.svg" alt="" width="72" height="72" />
  <h1>Orbit</h1>

  <button type="button" onclick="location.reload()">try again</button>
