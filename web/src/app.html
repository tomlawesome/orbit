<!doctype html>
<!--
  data-theme is what activates the token packs in home.css — including
  --stars, which drives the starfield's opacity. Without it the packs never
  match, --stars is undefined, and the sky renders invisible. Set here rather
  than on mount so it is correct in the server-rendered HTML, exactly as
  design/v19/home.html sets it on its own root element.
-->
<html lang="en" data-theme="afterdark" data-text-size="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- #763: installability (manifest + theme colour) and the star-chart
         ground colour a browser paints around Orbit before the page itself
         has anything on screen — the tab strip, the splash background. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060b1c" />
    <!--
      The mark: the ring and planet the login and logout screens draw, on the
      star-chart ground (#1009, owner-ratified 2026-09-16; the old tri-colour
      house #780 carried over was the pre-v19 brand). Static because
      adapter-node has no filesystem-convention icon. The SVG serves any
      browser that takes one; the PNGs are for the rest -- rendered from the
      SVG by web/scripts/render-icons.mjs, never drawn separately, so the tab,
      the iOS home screen and the install prompt cannot drift apart again.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Reapply the reader's chosen pack before the first paint, so a refresh
      does not flash after dark at someone who chose dawn. Inline and
      synchronous for that reason: any later and the flash has happened —
      which rules out an import, so this is the one reader of the roster in
      web/src/lib/theme.js (#865) that cannot import it. The array and the
      "afterdark" default on <html> above are a literal copy of THEME_PACKS
      and DEFAULT_THEME, checked against that module by
      tests/unit/v19-theme-roster.test.mjs so the two cannot drift apart
      silently. A stored value naming a theme that is not on the list — a
      removed pack (atlas, first at #865), or anything else — leaves the
      attribute exactly as it already reads: the default, with no flash and
      no error.

      INTERIM. The signed-in user's theme already lives on the server -
      themePreferenceSchema, PUT /api/preferences, and GET /api/auth/session
      returns themeId - but this front end is not yet wired to the API, so the
      choice has nowhere durable to go. When the shell is wired, the session
      becomes the source of truth and this reads as the pre-paint cache of it.
      Fails silently and keeps the default when storage is unavailable, e.g.
      a private window with storage blocked.
    -->
    <script>
      try {
        var t = localStorage.getItem("orbit-theme");
        if (t && ["starchart", "afterdark", "clouds", "dawn", "retrograde"].indexOf(t) !== -1)
          document.documentElement.dataset.theme = t;
      } catch (e) {}
      /* #1180: the text size, the same way. The array and the "comfortable"
         default on <html> are a literal copy of TEXT_SIZES and
         DEFAULT_TEXT_SIZE in web/src/lib/text-size.js, checked by
         tests/unit/text-size.test.mjs. */
      try {
        var s = localStorage.getItem("orbit-text-size");
        if (s && ["standard", "comfortable", "large", "extra-large"].indexOf(s) !== -1)
          document.documentElement.dataset.textSize = s;
      } catch (e) {}
      /* #1700: a launch owed on /home (the one-shot sessionStorage marker of
         $lib/flight/arrival.js) must hide home's desk from the first frame,
         which the server cannot know. <body> does not exist yet while this
         runs; a mutation observer's callback runs before the next paint, so
         `launch-owed` lands on <body> as the parser makes it. The marker is
         read, never taken: home's consumeLaunch() stays its one taker, and
         home lifts the class once it has decided. (/logout's own staging is
         in its prerendered HTML: GOODBYE_STAGED in hooks.server.js.)
         The CSP allows this one inline script by hash (vite.config.js). */
      try {
        if (location.pathname === "/home" && sessionStorage.getItem("orbit-launch") === "departed") {
          new MutationObserver(function (_, o) {
            if (!document.body) return;
            o.disconnect();
            document.body.classList.add("launch-owed");
          }).observe(document.documentElement, { childList: true });
        }
      } catch (e) {}
    </script>
    <!--
      #1700: a launch owed on /home (the pre-paint script above) hides home's two
      surfaces from the first frame, as body.launching does once the page has
      hydrated (home.css), so the dial never paints before the dawn is up. The
      reveal after 4 s is a failsafe in CSS alone: should no script ever run,
      the page still paints.
    -->
    <style>
      body.launch-owed .desk, body.launch-owed .pocket { visibility: hidden; animation: orbit-launch-owed 0s 4s forwards; }
      @keyframes orbit-launch-owed { to { visibility: visible; } }
    </style>
    %sveltekit.head%
  </head>
  <!--
    display:contents keeps this wrapper out of the layout entirely, so the
    mockup's children behave as direct children of <body> — which is what its
    position:fixed and height:100% rules were authored against.
  -->
  <body><div style="display: contents">%sveltekit.body%</div></body>
</html>
