# Retired (#1629). Outgoing mail is now set on Administration -> Mail and its
# password is stored encrypted in the database (ADR-0017). Kept only so an
# older install that still lists this overlay in COMPOSE_FILE keeps starting:
# on its first start Orbit copies the SMTP_* settings into the Mail card once
# and ignores them afterwards. Remove the overlay from COMPOSE_FILE and delete
# .orbit-secrets/smtp-password (docs/administrator-operations.md#outgoing-mail).
services:
  orbit-app:
    environment:
      SMTP_PASSWORD_FILE: /run/orbit-secrets/orbit-smtp-password
    secrets:
      - orbit-smtp-password

secrets:
  orbit-smtp-password:
    file: ./.orbit-secrets/smtp-password
