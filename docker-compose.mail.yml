# Optional mail-provider secret. Keep this overlay out of ordinary deployments
# until SMTP has been configured in .env-orbit and the host file exists with
# private permissions. The mailbox (inbound mail) credential is configured
# from the administration screen and stored encrypted in the database
# (ADR-0017); it is not an environment secret and has no entry here.
services:
  orbit-app:
    environment:
      SMTP_PASSWORD_FILE: /run/orbit-secrets/orbit-smtp-password
    secrets:
      - orbit-smtp-password

secrets:
  orbit-smtp-password:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/smtp-password
