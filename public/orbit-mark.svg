<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="orbit-mark-title">
  <title id="orbit-mark-title">Orbit — everything in your orbit, on track</title>

  <!-- The ratified mark: exactly three flat shapes — the year ring, the planet
       riding it, and the plain filled centre (the household). Nothing else, at
       any size: no gradient, no glow, no 3D, no shadow, no glyph inside the ring.

       Colour is baked in rather than tokenised because every caller renders this
       through next/image, i.e. as an <img>: page CSS cannot reach into an image
       document, currentColor would resolve to its own black, and the active
       theme pack is chosen in-app, so prefers-color-scheme is not a proxy for
       it. These three values are therefore picked to clear 3:1 against every
       pack's page and panel surface at once — star-chart #060b1c and after dark
       #05070d as readily as atlas #efe9db and dawn #eef1f6. They sit midway
       between the ratified dark-surface trio (#8791b3 / #ffe9c4 / #d8b45a) and
       the light-surface one (#5d6a87 / #1c2b4a / #b4842c). Per-pack colour needs
       this geometry inlined into the components instead of loaded as an image. -->

  <circle cx="100" cy="100" r="72" fill="none" stroke="#7b86a6" stroke-width="7" />
  <circle cx="100" cy="100" r="7" fill="#7b86a6" />
  <!-- 163,63.5 is 72.8 from the centre: the planet rides the ring, not beside it. -->
  <circle cx="163" cy="63.5" r="16" fill="#ac8129" />
</svg>
