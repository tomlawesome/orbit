# CI-only overlay (ai/orbit#1022, design ai/agent-infra#14): repoints the
# Docker Hub sidecars at the group dependency proxy so the pipeline's own
# Docker daemon pulls them from GitLab's cache instead of the internet on
# every run. Same digest, same bytes -- only the registry host changes.
#
# Never used outside CI: `${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}` is a
# GitLab CI/CD predefined variable, empty everywhere else, so this file is
# only ever added to a job's own $COMPOSE_FILES (smoke, smoke_local_only),
# never to a local developer's compose invocation and never to the
# user-facing docker-compose.yml those images are pinned in.
#
# The jobs that deploy through install.sh instead (acceptance's installer
# half, repair_journeys, launcher_install_compat) are deliberately not
# pointed at this file: they test the real operator install experience
# against docker-compose.yml exactly as shipped, vendor references included.
services:
  orbit-db:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/postgres:18-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
  orbit-clamav:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/clamav/clamav:1.5.4-debian@sha256:bd1a3d9f7d90b1c1e2703b1e1e86354102e0be296899a3c941374a597f745e6c
  orbit-tika:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/apache/tika:4.1.0-full@sha256:1ae28c75a88fd4c4f583711520923bba44548e8bc3d2fc4671b2a3e24e0d59dd
