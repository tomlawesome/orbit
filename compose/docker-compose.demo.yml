# Demo overlay: makes the disposable acceptance OIDC provider reachable from
# a browser on the owner's LAN (the base acceptance overlay binds it to
# loopback and names it by container, which only other containers can
# resolve). Compose with: base + mail + acceptance + THIS, last.
#
# DEMO_HOST is the LAN address of the machine running the demo, set in the
# environment (`DEMO_HOST=192.0.2.10 docker compose …`), never written here:
# the repository is public and the address is the owner's network.
#
# The provider's certificate is self-signed and regenerated per start — the
# browser will warn once at https://$DEMO_HOST:4444 and must be told to
# proceed, after which the login round-trip works from any LAN device.
#
# The app itself is served https://$DEMO_HOST:3443 via the demo-tls proxy
# (APP_URL's own law requires HTTPS off loopback). Generate its throwaway
# cert before first bring-up (never committed):
#   openssl req -x509 -newkey rsa:2048 -keyout demo-tls/demo.key \
#     -out demo-tls/demo.crt -days 30 -nodes -subj "/CN=$DEMO_HOST" \
#     -addext "subjectAltName=IP:$DEMO_HOST"
#
# docker-compose.yml pins container_name on the app, database, scanner and
# parser, so a second Orbit stack on the same host could not start beside the
# bed (#1158). The bed renames them to its own project's name, as
# compose/docker-compose.local-e2e.yml does (without that overlay's other
# settings). Other services address them by Compose service name, so only
# Docker's global container namespace changes.
services:
  orbit-app:
    container_name: ${COMPOSE_PROJECT_NAME}-app
    environment:
      APP_URL: https://${DEMO_HOST:?set DEMO_HOST to this machine's LAN address}:3443
      ORBIT_AUTH_OIDC: "true"
      OIDC_ISSUER: https://${DEMO_HOST:?set DEMO_HOST to this machine's LAN address}:4444/
      OIDC_CALLBACK_URL: https://${DEMO_HOST:?set DEMO_HOST to this machine's LAN address}:3443/api/auth/callback
    # A4-Q1 (#1151): docker-compose.yml publishes this on
    # ${ORBIT_BIND_ADDRESS:-0.0.0.0}:${ORBIT_PORT:-3000}, and demo-tls below
    # needs host port 3000 on $DEMO_HOST for its own plain-HTTP listener. A
    # 0.0.0.0 bind reserves every address for that port, $DEMO_HOST included,
    # so the two collide with "address already in use" however ORBIT_PORT is
    # set. LAN access to the app goes through demo-tls's :3443 either way
    # (APP_URL's own law requires HTTPS off loopback), so this is rebound to
    # loopback only -- still reachable from the host itself, never from the
    # port demo-tls needs.
    ports: !override
      - "127.0.0.1:${ORBIT_PORT:-3000}:3000"
  orbit-db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
  orbit-clamav:
    container_name: ${COMPOSE_PROJECT_NAME}-clamav
  orbit-tika:
    container_name: ${COMPOSE_PROJECT_NAME}-tika
  orbit-oidc:
    environment:
      TEST_OIDC_ISSUER: https://${DEMO_HOST:?set DEMO_HOST to this machine's LAN address}:4444/
    # Published on 4444 so a WebKit run of scripts/test-e2e-local.sh, which
    # forwards 127.0.0.1:4443, can run while the bed is up (#1445). Inside the
    # container the provider still listens on 4443.
    ports: !override
      - "0.0.0.0:4444:4443"
  demo-tls:
    image: nginx:alpine@sha256:060849a174666c53439dc7cecbf8f67e225c7cbfb1a44ca97915d9a172a81e6d
    volumes:
      - ./demo-tls:/etc/demo:ro
      - ./demo-tls/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "0.0.0.0:3443:3443"
      - "${DEMO_HOST:?set DEMO_HOST to this machine's LAN address}:3000:3080"
