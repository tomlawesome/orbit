# Licence allow-list for every package in the installed dependency tree.
# Read by scripts/ci/licence-policy.mjs, run as the `licence_policy` job in
# .gitlab-ci.yml. GitHub's actions/dependency-review-action read this file
# under its former name and path (.github/dependency-review-config.yml) and
# only ever compared a pull-request diff; it stopped running when GitHub
# became a push-mirror with no pull requests (#801), so the licence check
# moved here and now walks the whole installed tree instead (#815).
allow-licenses:
  - 0BSD
  - Apache-2.0
  - Artistic-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - Python-2.0
  - Unicode-3.0
  - Unlicense
  - Zlib
# Version-bound sharp/libvips platform-package exception. This does not allow
# LGPL generally. Owner, rationale, evidence and 2026-10-31 review deadline:
# https://github.com/tomlawesome/orbit/issues/107
allow-dependencies-licenses:
  # Version-bound OFL-1.1 exception for the three self-hosted typefaces. This
  # does NOT allow OFL-1.1 generally: a blanket entry would silently admit any
  # future font package, including ones with bundled binaries or different
  # reserved-name obligations. OFL and AGPL coexist by aggregation - the fonts
  # stay under OFL, Orbit stays under AGPL - provided each package's LICENSE
  # ships in the image and the faces are neither modified nor renamed.
  # Owner approval, rationale and review trigger:
  # https://github.com/tomlawesome/orbit/issues/440
  - pkg:npm/@fontsource/space-grotesk@5.3.0
  - pkg:npm/@fontsource-variable/inter@5.3.0
  - pkg:npm/@fontsource-variable/jetbrains-mono@5.3.0
  - pkg:npm/@img/sharp-libvips-darwin-arm64@1.3.0
  - pkg:npm/@img/sharp-libvips-darwin-x64@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-arm@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-arm64@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-ppc64@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-riscv64@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-s390x@1.3.0
  - pkg:npm/@img/sharp-libvips-linux-x64@1.3.0
  - pkg:npm/@img/sharp-libvips-linuxmusl-arm64@1.3.0
  - pkg:npm/@img/sharp-libvips-linuxmusl-x64@1.3.0
  - pkg:npm/@img/sharp-wasm32@0.35.0
  - pkg:npm/@img/sharp-win32-arm64@0.35.0
  - pkg:npm/@img/sharp-win32-ia32@0.35.0
  - pkg:npm/@img/sharp-win32-x64@0.35.0
