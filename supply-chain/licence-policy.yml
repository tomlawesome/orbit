# Licence allow-list for every package that SHIPS in the product, not the
# build/test tree. Read by scripts/ci/licence-policy.mjs, run as the
# `licence_policy` job in .gitlab-ci.yml. GitHub's actions/dependency-review-
# action read this file under its former name and path
# (.github/dependency-review-config.yml) and only ever compared a
# pull-request diff; it stopped running when GitHub became a push-mirror with
# no pull requests (#801), so the licence check moved here and walked the
# whole installed tree, tooling included (#815).
#
# Scope narrowed to the shipped tree only (owner decision, 2026-09-05): a
# GPL build tool does not affect the licence of what it produces, so a licence
# gate has no business blocking on one. "Shipped" is the Dockerfile's runtime
# image -- see scripts/ci/licence-policy.mjs's header for exactly which
# packages that is and how the checker now finds them (pnpm's own prod/dev
# split, plus the named `@fontsource*` carve-out below). Entries that were
# here only because some devDependency-only build/lint/test tool needed them
# were removed in the same change: 0BSD, Artistic-2.0, BlueOak-1.0.0,
# BSD-2-Clause, CC-BY-4.0, CC0-1.0, Python-2.0, Unicode-3.0 and Zlib matched no
# shipped package (several matched nothing anywhere in the tree; the rest were
# transitive-only to eslint/typescript-eslint).
allow-licenses:
  - Apache-2.0
  - BSD-3-Clause
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - Unlicense
allow-dependencies-licenses:
  # Version-bound OFL-1.1 exception for the three self-hosted typefaces. This
  # does NOT allow OFL-1.1 generally: a blanket entry would silently admit any
  # future font package, including ones with bundled binaries or different
  # reserved-name obligations. OFL and AGPL coexist by aggregation - the fonts
  # stay under OFL, Orbit stays under AGPL - provided each package's LICENSE
  # ships in the image and the faces are neither modified nor renamed.
  # Owner approval, rationale and review trigger:
  # https://github.com/tomlawesome/orbit/issues/440
  - pkg:npm/@fontsource/space-grotesk@5.3.0
  - pkg:npm/@fontsource-variable/inter@5.3.0
  - pkg:npm/@fontsource-variable/jetbrains-mono@5.3.0
