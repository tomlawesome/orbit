name: orbit

services:
  orbit-db:
    container_name: orbit-postgres
    image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD_FILE: /run/secrets/orbit-postgres-password
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/18/docker and declares
      # its volume one level up. Mounting the 17 path leaves the cluster outside
      # the named volume, which the image refuses to do rather than risk it.
      - orbit-db-data:/var/lib/postgresql
    secrets:
      - orbit-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}"]
      interval: 5s
      timeout: 3s
      retries: 10
  orbit-app:
    container_name: orbit
    # No build declaration: this file describes a deployment, which fetches
    # compose assets and a published image but no source tree. Building from
    # source is an explicit developer workflow through compose/docker-compose.build.yml.
    image: "${ORBIT_IMAGE:?Set ORBIT_IMAGE to an immutable registry digest or a local build tag}"
    restart: unless-stopped
    env_file: .env-orbit
    environment:
      POSTGRES_HOST: orbit-db
      POSTGRES_PASSWORD_FILE: /run/orbit-secrets/orbit-postgres-password
      SESSION_SECRET_FILE: /run/orbit-secrets/orbit-session-secret
      DOCUMENT_KEK_FILE: /run/orbit-secrets/orbit-document-kek
      VAPID_PRIVATE_KEY_FILE: /run/orbit-secrets/orbit-vapid-private-key
      MIGRATE_ON_START: "true"
      WORKER_ENABLED: "true"
    volumes:
      - orbit-documents-data:/var/lib/orbit/documents
    tmpfs:
      - /tmp/orbit-document-quarantine:rw,noexec,nosuid,nodev,uid=1001,gid=1001,mode=0700,size=64m
      - /run/orbit-secrets:rw,noexec,nosuid,nodev,uid=0,gid=1001,mode=0750,size=1m
    secrets:
      - orbit-postgres-password
      - orbit-session-secret
      - orbit-document-kek
      - orbit-vapid-private-key
      - orbit-oidc-client-secret
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - orbit-document-processing
    ports: ["${ORBIT_BIND_ADDRESS:-0.0.0.0}:${ORBIT_PORT:-3000}:3000"]
    depends_on:
      orbit-db:
        condition: service_healthy
  # ClamAV remains independent of Orbit startup: document operations must fail
  # closed when it is unavailable, while the rest of the application stays up.
  orbit-clamav:
    container_name: orbit-clamav
    image: clamav/clamav:1.5.4-debian@sha256:5037bae34bf7566052d18f30be1e351155bfce845a583f0c08027f9fcaa44b5d
    restart: unless-stopped
    networks:
      # clamd shares only the hostile-document channel with Orbit. A separate
      # egress network lets FreshClam update signatures without a route to
      # PostgreSQL or other default-network services.
      - orbit-document-processing
      - orbit-malware-signature-updates
    volumes:
      - orbit-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    # Keep malware scanning bounded on small hosts. Raise these limits only
    # alongside documented upload-size and scanner-capacity requirements.
    cpus: "1.0"
    mem_limit: ${CLAMAV_MEMORY_LIMIT:-4g}
    pids_limit: 256
  # Optional local-only document parser/OCR. Enable explicitly with:
  # docker compose --profile processing up -d
  orbit-tika:
    container_name: orbit-tika
    image: apache/tika:4.0.0-full@sha256:6c244af88e8575ebe8bf0bc5e2da03c49663dd0acc7809cd99c8e9ff8741cbfb
    profiles: ["processing"]
    restart: unless-stopped
    user: "35002:35002"
    read_only: true
    # Tika 4 takes JSON, not the XML of Tika 3. The exclusion in that file is
    # the only thing holding the Tesseract OCR parser out of the parser set,
    # and it only binds in the array form under a registered component name:
    # the object form parses, loads nothing and reports no error (#687).
    # This argument is the only thing that selects the config file: the server
    # reads no environment variable for it, so change the path here (#692).
    command: ["-c", "/etc/orbit/tika-config.json"]
    configs:
      - source: orbit-tika-config
        target: /etc/orbit/tika-config.json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=35002,gid=35002,mode=0700,size=256m
    # The parser accepts hostile documents. Keep it reachable from Orbit while
    # denying access to the database, sibling services and external networks.
    networks:
      - orbit-document-processing
    cpus: "1.0"
    mem_limit: ${TIKA_MEMORY_LIMIT:-1g}
    pids_limit: 256

  # Optional private model server for a future reviewed semantic-extraction
  # workflow. Orbit does not call it yet, so selecting and pulling a model is an
  # explicit operator action rather than a deployment requirement.
  #
  # ADR-0025 makes this container egress-free: document text handed to a model
  # must not sit somewhere that can reach the internet, and the model server is
  # then structurally incapable of becoming a cloud extraction path, whatever a
  # future image or configuration tries. Getting a model in is therefore a
  # separate, deliberate step -- see the one-shot model pull helper below.
  orbit-ollama:
    container_name: orbit-ollama
    image: ollama/ollama:0.33.3@sha256:57a73f11f75b32b97b59b003f351445c9c2a8af4b9d586ecdc928dee6150ef26
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Bind on the Compose network only; deliberately do not publish 11434 to
      # the host. The service needs this address for future in-network callers.
      OLLAMA_HOST: 0.0.0.0:11434
      # Never fall back to a cloud model or transmit document text to Ollama
      # Cloud. Pulling an explicitly chosen local model remains possible.
      OLLAMA_NO_CLOUD: "1"
      # Keep a small host from accumulating queued inference work or several
      # resident models. The application will also retain its own timeouts.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-8}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-0}"
      # Kept separate from Ollama's own settings so the administrator-selected
      # model can be pulled without relying on a host shell environment.
      ORBIT_OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
    volumes:
      - orbit-ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The model reads hostile document text, so it gets exactly what Tika gets:
    # reachable from Orbit over the internal network, and no route out. This is
    # the structural half of ADR-0025's "the endpoint cannot become a cloud
    # path" -- OLLAMA_NO_CLOUD above is defence in depth behind it. Adding
    # `default`, a published port, or any second network here reopens egress.
    networks:
      - orbit-document-processing
    cpus: "${OLLAMA_CPUS:-2.0}"
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 8

  # One-shot model pull, and the only part of this stack allowed to fetch model
  # data. Never started with the stack; the notes inside it say how it runs.
  orbit-ollama-model-pull:
    # The model server above has no route off the internal processing network,
    # so it cannot fetch a model itself. This runs the same pinned image against
    # the same model volume on the default network, which does have egress, and
    # then exits. Its own profile keeps it out of `--profile ai` and out of
    # every `up`, so it runs only when an operator names it, having first set
    # OLLAMA_MODEL in .env-orbit to the model reference to fetch:
    #
    #   docker compose --env-file .env-orbit --profile ai-model-pull \
    #     run --rm orbit-ollama-model-pull
    #
    # It never sees document text: it starts a private loopback server for the
    # length of the download only, writes to the volume, and stops. Deliberately
    # no container_name, and restart "no": a one-shot `run` container must not
    # claim a name a long-lived service could want, nor come back by itself.
    image: ollama/ollama:0.33.3@sha256:57a73f11f75b32b97b59b003f351445c9c2a8af4b9d586ecdc928dee6150ef26
    profiles: ["ai-model-pull"]
    restart: "no"
    environment:
      # Loopback only. The temporary server exists to accept this container's
      # own pull; nothing on the default network should be able to reach it.
      OLLAMA_HOST: 127.0.0.1:11434
      # A pull of an explicitly named local model, never a cloud model or a
      # cloud relay -- the same promise the serving container makes.
      OLLAMA_NO_CLOUD: "1"
      ORBIT_OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
    volumes:
      - orbit-ollama-data:/root/.ollama
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ -z "$${ORBIT_OLLAMA_MODEL:-}" ]; then
          echo "Set OLLAMA_MODEL in .env-orbit to the model reference to pull." >&2
          exit 2
        fi
        /bin/ollama serve > /tmp/orbit-model-pull.log 2>&1 &
        server_pid=$$!
        waited=0
        while ! /bin/ollama list > /dev/null 2>&1; do
          waited=$$((waited + 1))
          if [ "$$waited" -ge 60 ]; then
            echo "The temporary model server did not start; nothing was pulled." >&2
            cat /tmp/orbit-model-pull.log >&2
            kill "$$server_pid" 2>/dev/null || true
            exit 1
          fi
          sleep 1
        done
        echo "Pulling $${ORBIT_OLLAMA_MODEL} into the orbit-ollama-data volume."
        status=0
        /bin/ollama pull "$${ORBIT_OLLAMA_MODEL}" || status=$$?
        kill "$$server_pid" 2>/dev/null || true
        wait "$$server_pid" 2>/dev/null || true
        if [ "$$status" -ne 0 ]; then
          echo "Model pull failed. Orbit is unaffected: the serving profile keeps whatever model the volume already held." >&2
          exit "$$status"
        fi
        /bin/ollama list
    cpus: "${OLLAMA_CPUS:-2.0}"
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    pids_limit: 512

networks:
  orbit-document-processing:
    internal: true
  orbit-malware-signature-updates:

volumes:
  orbit-db-data:
  orbit-documents-data:
  orbit-clamav-data:
  orbit-ollama-data:

configs:
  orbit-tika-config:
    file: ./config/tika-config.json

secrets:
  orbit-postgres-password:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/postgres-password
  orbit-session-secret:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/session-secret
  orbit-document-kek:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/document-kek
  orbit-vapid-private-key:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/vapid-private-key
  orbit-oidc-client-secret:
    file: ${ORBIT_SECRETS_DIR:-./.orbit-secrets}/oidc-client-secret
