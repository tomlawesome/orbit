name: orbit

services:
  orbit-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
    volumes:
      - orbit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}"]
      interval: 5s
      timeout: 3s
      retries: 10
  orbit-app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@orbit-db:5432/${POSTGRES_DB:-orbit}
      MIGRATE_ON_START: "true"
      WORKER_ENABLED: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      orbit-db:
        condition: service_healthy

volumes:
  orbit-db-data:
