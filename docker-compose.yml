services:
  homesee-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homesee}
      POSTGRES_USER: ${POSTGRES_USER:-homesee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homesee}
    volumes:
      - homesee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homesee} -d ${POSTGRES_DB:-homesee}"]
      interval: 5s
      timeout: 3s
      retries: 10
  homesee-fe:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homesee}:${POSTGRES_PASSWORD:-homesee}@homesee-db:5432/${POSTGRES_DB:-homesee}
      MIGRATE_ON_START: "true"
      WORKER_ENABLED: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      homesee-db:
        condition: service_healthy

volumes:
  homesee-db:
