# Opt-in processing overlay. Combine with docker-compose.yml; this file is not
# discovered automatically by Docker Compose, so the standard deployment stays
# lightweight and does not run a language model.
#
# Start the complete local processing stack with:
# docker compose --env-file .env-orbit -f docker-compose.yml -f docker-compose.full.yml --profile processing --profile ai up -d
services:
  # Tika is declared in the base Compose file behind the "processing" profile.
  # This overlay adds an independent, private Ollama server for a future
  # reviewed semantic-extraction workflow. Orbit does not call it yet.
  orbit-ollama:
    container_name: orbit-ollama
    image: ollama/ollama:0.32.2
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Bind on the Compose network only; deliberately do not publish 11434 to
      # the host. The service needs this address for future in-network callers.
      OLLAMA_HOST: 0.0.0.0:11434
      # Never fall back to a cloud model or transmit document text to Ollama
      # Cloud. Pulling an explicitly chosen local model remains possible.
      OLLAMA_NO_CLOUD: "1"
      # Keep a small host from accumulating queued inference work or several
      # resident models. The application will also retain its own timeouts.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-8}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-0}"
      # Kept separate from Ollama's own settings so the administrator-selected
      # model can be pulled without relying on a host shell environment.
      ORBIT_OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
    volumes:
      - orbit-ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${OLLAMA_CPUS:-2.0}"
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 8

volumes:
  orbit-ollama-data:
